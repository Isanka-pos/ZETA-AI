<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZETA ADMIN | Coin Manager</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #04060C;
            color: #E0E8F0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #04060C; }
        ::-webkit-scrollbar-thumb { background: #00A3FF33; border-radius: 3px; }

        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0,163,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,163,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0%{transform:translate(0,0);} 100%{transform:translate(60px,60px);} }

        .glass-card {
            background: linear-gradient(135deg, rgba(13,17,32,0.9), rgba(10,14,26,0.7));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,163,255,0.08);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,163,255,0.3), transparent);
        }

        .neon-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 13px 24px;
            background: linear-gradient(135deg, #00A3FF, #0066CC);
            color: white; font-weight: 600; border-radius: 12px; border: none;
            cursor: pointer; font-size: 14px; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0,163,255,0.25);
        }
        .neon-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0,163,255,0.4); }
        .neon-btn-green { background: linear-gradient(135deg, #22C55E, #15803D); box-shadow: 0 0 15px rgba(34,197,94,0.25); }
        .neon-btn-green:hover { box-shadow: 0 0 25px rgba(34,197,94,0.4); }
        .neon-btn-red { background: linear-gradient(135deg, #EF4444, #B91C1C); box-shadow: 0 0 15px rgba(239,68,68,0.2); font-size: 12px; padding: 8px 14px; }
        .neon-btn-ghost {
            background: rgba(0,163,255,0.06); border: 1px solid rgba(0,163,255,0.2);
            box-shadow: none; font-size: 12px; padding: 8px 14px;
        }

        .inp {
            width: 100%; padding: 13px 16px;
            background: rgba(4,6,12,0.6);
            border: 1px solid rgba(0,163,255,0.12);
            border-radius: 12px; color: #E0E8F0; font-size: 14px;
            font-family: 'Inter', sans-serif; outline: none; transition: all 0.3s;
        }
        .inp:focus { border-color: rgba(0,163,255,0.4); box-shadow: 0 0 0 3px rgba(0,163,255,0.08); }
        .inp::placeholder { color: rgba(224,232,240,0.25); }

        .badge-glow {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 16px; border-radius: 100px;
            background: rgba(0,163,255,0.06); border: 1px solid rgba(0,163,255,0.15);
            font-size: 12px; font-weight: 600; color: #00D4FF; letter-spacing: 0.5px;
        }

        .stat-box {
            background: rgba(13,17,32,0.5);
            border: 1px solid rgba(0,163,255,0.1);
            border-radius: 16px; padding: 20px; text-align: center;
        }
        .stat-num {
            font-family: 'Orbitron', sans-serif; font-size: 30px; font-weight: 800;
            background: linear-gradient(135deg, #00D4FF, #0066FF);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            font-size: 11px; letter-spacing: 2px; color: rgba(224,232,240,0.4);
            padding: 12px 14px; text-align: left; font-weight: 600;
            border-bottom: 1px solid rgba(0,163,255,0.1);
        }
        td { padding: 14px; font-size: 14px; border-bottom: 1px solid rgba(0,163,255,0.05); }
        tr:hover td { background: rgba(0,163,255,0.03); }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease both; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
    </style>
<base target="_blank">
</head>
<body>
    <div class="cyber-grid"></div>

    <!-- ===== ADMIN LOGIN ===== -->
    <div id="loginView" style="position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div class="glass-card fade-in" style="width:100%;max-width:400px;padding:40px 32px;">
            <div style="text-align:center;margin-bottom:28px;">
                <div style="width:52px;height:52px;background:linear-gradient(135deg,#00A3FF,#0066CC);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 20px rgba(0,163,255,0.3);">
                    <span style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;color:white;">Z</span>
                </div>
                <h1 style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;letter-spacing:2px;">ZETA ADMIN</h1>
                <p style="font-size:13px;color:rgba(224,232,240,0.45);margin-top:8px;">Coin Manager Panel</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:14px;">
                <input type="password" id="adminPass" class="inp" placeholder="Admin password" onkeydown="if(event.key==='Enter')adminLogin()">
                <p id="loginMsg" style="font-size:13px;color:#FF6B7E;min-height:18px;margin:0;"></p>
                <button class="neon-btn" style="width:100%;" onclick="adminLogin()"><i data-lucide="shield-check" style="width:16px;height:16px;"></i> Login</button>
            </div>
        </div>
    </div>

    <!-- ===== ADMIN PANEL ===== -->
    <div id="panelView" class="hidden" style="position:relative;z-index:2;min-height:100vh;padding:30px 20px 60px;">
        <div style="max-width:860px;margin:0 auto;">

            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:28px;">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:42px;height:42px;background:linear-gradient(135deg,#00A3FF,#0066CC);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(0,163,255,0.3);">
                        <span style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;color:white;">Z</span>
                    </div>
                    <div>
                        <h1 style="font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;">ZETA ADMIN</h1>
                        <p style="font-size:12px;color:rgba(224,232,240,0.4);">Coin Manager Panel</p>
                    </div>
                </div>
                <button class="neon-btn neon-btn-ghost" onclick="adminLogout()"><i data-lucide="log-out" style="width:14px;height:14px;"></i> Logout</button>
            </div>

            <!-- Stats -->
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:14px;margin-bottom:24px;">
                <div class="stat-box"><p style="font-size:11px;color:rgba(224,232,240,0.4);letter-spacing:2px;margin-bottom:8px;">TOTAL USERS</p><div class="stat-num" id="statUsers">0</div></div>
                <div class="stat-box"><p style="font-size:11px;color:rgba(224,232,240,0.4);letter-spacing:2px;margin-bottom:8px;">TOTAL COINS</p><div class="stat-num" id="statCoins">0</div></div>
            </div>

            <!-- Add Coins Form -->
            <div class="glass-card fade-in" style="padding:30px;margin-bottom:24px;">
                <span class="badge-glow" style="margin-bottom:18px;display:inline-flex;"><i data-lucide="coins" style="width:14px;height:14px;"></i> ADD / DEDUCT COINS</span>
                <div style="display:flex;flex-direction:column;gap:14px;">
                    <input type="email" id="targetGmail" class="inp" placeholder="Userගේ Gmail address" onkeydown="if(event.key==='Enter')addCoins()">
                    <input type="number" id="coinAmount" class="inp" placeholder="Coins ගාන (උදා: 100)" min="1" onkeydown="if(event.key==='Enter')addCoins()">
                    <p id="panelMsg" style="font-size:13px;min-height:18px;margin:0;line-height:1.5;"></p>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <button class="neon-btn neon-btn-green" style="flex:1;min-width:150px;" onclick="addCoins()"><i data-lucide="plus-circle" style="width:16px;height:16px;"></i> Add Coins</button>
                        <button class="neon-btn" style="flex:1;min-width:150px;background:linear-gradient(135deg,#F59E0B,#B45309);box-shadow:0 0 15px rgba(245,158,11,0.2);" onclick="deductCoins()"><i data-lucide="minus-circle" style="width:16px;height:16px;"></i> Deduct Coins</button>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="glass-card fade-in" style="padding:10px 6px;">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 14px 6px;">
                    <span class="badge-glow"><i data-lucide="users" style="width:14px;height:14px;"></i> REGISTERED USERS</span>
                    <button class="neon-btn neon-btn-ghost" onclick="refreshUsers()"><i data-lucide="refresh-ccw" style="width:14px;height:14px;"></i> Refresh</button>
                </div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr><th>GMAIL</th><th>COINS</th><th>REGISTERED</th><th style="text-align:right;">ACTIONS</th></tr>
                        </thead>
                        <tbody id="userRows"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ⚠️ අනිවාර්යයෙන් මේ password එක වෙනස් කරගන්න!
        const ADMIN_PASS = 'zeta2026';
        const LS_USERS = 'zeta_users';
        const LS_SESSION = 'zeta_session';
        const LS_ADMIN = 'zeta_admin';

        function getUsers(){ try { return JSON.parse(localStorage.getItem(LS_USERS)) || {}; } catch(e){ return {}; } }
        function saveUsers(u){ localStorage.setItem(LS_USERS, JSON.stringify(u)); }

        // ===== Admin Login =====
        function adminLogin(){
            const p = document.getElementById('adminPass').value;
            const msg = document.getElementById('loginMsg');
            if (p === ADMIN_PASS) {
                sessionStorage.setItem(LS_ADMIN, '1');
                showPanel();
            } else {
                msg.textContent = '❌ Password වැරදියි.';
            }
        }

        function adminLogout(){
            sessionStorage.removeItem(LS_ADMIN);
            document.getElementById('panelView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('adminPass').value = '';
        }

        function showPanel(){
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('panelView').classList.remove('hidden');
            refreshUsers();
            lucide.createIcons();
        }

        // ===== Add / Deduct =====
        function setPanelMsg(text, ok){
            const m = document.getElementById('panelMsg');
            m.style.color = ok ? '#4ADE80' : '#FF6B7E';
            m.textContent = text;
        }

        function addCoins(){
            const g = document.getElementById('targetGmail').value.trim().toLowerCase();
            const amt = parseInt(document.getElementById('coinAmount').value, 10);
            if (!g) { setPanelMsg('⚠️ Gmail address එක දාන්න.', false); return; }
            if (!amt || amt <= 0) { setPanelMsg('⚠️ Coins ගාන එක දාන්න.', false); return; }
            const users = getUsers();
            if (!users[g]) { setPanelMsg('❌ මේ Gmail එකෙන් register වෙලා නැහැ. User ට කියන්න weather site එකෙන් register වෙන්න.', false); return; }
            users[g].coins += amt;
            saveUsers(users);
            setPanelMsg('✅ ' + g + ' ට coins ' + amt + ' add කළා! අලුත් balance: ' + users[g].coins, true);
            refreshUsers();
        }

        function deductCoins(){
            const g = document.getElementById('targetGmail').value.trim().toLowerCase();
            const amt = parseInt(document.getElementById('coinAmount').value, 10);
            if (!g) { setPanelMsg('⚠️ Gmail address එක දාන්න.', false); return; }
            if (!amt || amt <= 0) { setPanelMsg('⚠️ Coins ගාන එක දාන්න.', false); return; }
            const users = getUsers();
            if (!users[g]) { setPanelMsg('❌ මේ Gmail එකෙන් register වෙලා නැහැ.', false); return; }
            if (users[g].coins < amt) { setPanelMsg('⚠️ Deduct කරන්න බැහැ — user ගේ ළඟ coins ' + users[g].coins + ' විතරයි තියෙන්නේ.', false); return; }
            users[g].coins -= amt;
            saveUsers(users);
            setPanelMsg('✅ ' + g + ' ගෙන් coins ' + amt + ' අඩු කළා! අලුත් balance: ' + users[g].coins, true);
            refreshUsers();
        }

        function deleteUser(g){
            if (!confirm(g + ' කියන user එව delete කරන්නද? මේක අභ්‍යන්තරයි!')) return;
            const users = getUsers();
            delete users[g];
            saveUsers(users);
            if (localStorage.getItem(LS_SESSION) === g) localStorage.removeItem(LS_SESSION);
            refreshUsers();
            setPanelMsg('✅ User එව delete කළා.', true);
        }

        function resetCoins(g){
            if (!confirm(g + ' ගේ coins 0 කරන්නද?')) return;
            const users = getUsers();
            if (users[g]) { users[g].coins = 0; saveUsers(users); refreshUsers(); }
        }

        // ===== Users List =====
        function refreshUsers(){
            const users = getUsers();
            const gmails = Object.keys(users);
            let totalCoins = 0;
            gmails.forEach(g => { totalCoins += users[g].coins || 0; });

            document.getElementById('statUsers').textContent = gmails.length;
            document.getElementById('statCoins').textContent = totalCoins;

            const tbody = document.getElementById('userRows');
            tbody.innerHTML = '';
            if (!gmails.length) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:rgba(224,232,240,0.3);padding:30px;">තවම users ලා register වෙලා නැහැ</td></tr>';
                return;
            }
            gmails.sort((a, b) => (users[b].created || '').localeCompare(users[a].created || ''));
            gmails.forEach(g => {
                const u = users[g];
                const date = u.created ? new Date(u.created).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '—';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:rgba(224,232,240,0.8);">${g}</td>
                    <td><span style="font-family:'Orbitron',sans-serif;font-weight:700;color:#00D4FF;">${u.coins}</span></td>
                    <td style="color:rgba(224,232,240,0.4);font-size:12px;">${date}</td>
                    <td style="text-align:right;white-space:nowrap;">
                        <button class="neon-btn neon-btn-ghost" style="margin-right:6px;" onclick="document.getElementById('targetGmail').value='${g}';document.getElementById('coinAmount').focus();">Select</button>
                        <button class="neon-btn neon-btn-ghost" style="margin-right:6px;" onclick="resetCoins('${g}')">Reset</button>
                        <button class="neon-btn neon-btn-red" onclick="deleteUser('${g}')">Delete</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        // ===== Init =====
        lucide.createIcons();
        if (sessionStorage.getItem(LS_ADMIN) === '1') showPanel();
    </script>
</body>
</html>
