<style>

<script>
// ================= HELPERS =================
function esc(s) {
  const d = document.createElement('div');
  d.textContent = (s == null) ? '' : String(s);
  return d.innerHTML;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}
function validPhone(p) {
  p = String(p || '').replace(/\s/g, '');
  return /^0\d{9}$/.test(p);
}
function fmtTime(ts) {
  const d = new Date(ts);
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
}
const AVATAR_COLORS = ['#00A3FF','#7C3AED','#059669','#D97706','#DC2626','#DB2777','#0891B2','#65A30D'];

function getMsgs() { try { return JSON.parse(localStorage.getItem('zc_msgs')) || {}; } catch(e) { return {}; } }
function saveMsgs(m) { localStorage.setItem('zc_msgs', JSON.stringify(m)); }
function getSession() { try { return JSON.parse(localStorage.getItem('zc_session')); } catch(e) { return null; } }
function setSession(s) { localStorage.setItem('zc_session', JSON.stringify(s)); }

  'අනිවාර්යයෙන්ම! 🙌', 'හොඳයි, කියන්න ඕන දෙයක්?', 'මම දැන් busy, පස්සේ කතා කරමු.',
  '😂😂😂 සිරා!', 'ඔව් ඔව්, එහෙම තමයි!', 'OK bro, deal! 🤝'

// ================= AUTH =================
let currentUser = null;
let activeContact = null;

function switchTab(tab) {
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  hideError(); hideSuccess();
}

function showError(msg) {
  const e = document.getElementById('authError');
  e.textContent = msg;
  e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
}
function hideError() { document.getElementById('authError').classList.remove('show'); }
function showSuccess(msg) {
  const s = document.getElementById('authSuccess');
  s.textContent = msg; s.classList.add('show');
}
function hideSuccess() { document.getElementById('authSuccess').classList.remove('show'); }

document.getElementById('registerForm').addEventListener('submit', function(e) {
  e.preventDefault();
  hideError(); hideSuccess();
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.replace(/\s/g, '');
  const pass = document.getElementById('regPassword').value;

  if (name.length < 2) { showError('නම ටිකක් වැඩි දිගු එකක් දාන්න.'); return; }
  if (!validPhone(phone)) { showError('ෆෝන් නම්බර් එක වැරදියි. (07XXXXXXXX)'); return; }
  if (pass.length < 4) { showError('පාස්වර්ඩ් අකුරු 4ට වැඩි එකක් දාන්න.'); return; }

  const users = getUsers();
  if (users.some(u => u.phone === phone)) { showError('මේ නම්බර් එකෙන් ගිණුමක් තියෙනවා. ලොග් වෙන්න.'); return; }

  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader" style="width:18px;height:18px;animation:spin 1s linear infinite;"></i> හදමින්...';
  lucide.createIcons();

  setTimeout(() => {
    users.push({ name: name, phone: phone, pass: btoa(pass) });
    saveUsers(users);
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="user-plus" style="width:18px;height:18px;"></i> ගිණුම හදන්න';
    lucide.createIcons();
    showSuccess('✅ ගිණුම හදලා ඉවරයි! දැන් ලොග් වෙන්න.');
    switchTab('login');
    document.getElementById('loginPhone').value = phone;
  }, 700);
});

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  hideError(); hideSuccess();
  const phone = document.getElementById('loginPhone').value.replace(/\s/g, '');
  const pass = document.getElementById('loginPassword').value;

  if (!validPhone(phone)) { showError('ෆෝන් නම්බර් එක වැරදියි. (07XXXXXXXX)'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader" style="width:18px;height:18px;animation:spin 1s linear infinite;"></i> ලොග් වෙමින්...';
  lucide.createIcons();

  setTimeout(() => {
    const users = getUsers();
    const found = users.find(u => u.phone === phone && u.pass === btoa(pass));
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="log-in" style="width:18px;height:18px;"></i> ලොග් වෙන්න';
    lucide.createIcons();
    if (!found) { showError('නම්බර් එක හෝ පාස්වර්ඩ් එක වැරදියි.'); return; }
    setSession({ phone: found.phone, name: found.name });
    enterApp();
  }, 600);
});

function logout() {
  clearSession();
  currentUser = null; activeContact = null;
  document.getElementById('app').classList.remove('active');
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('loginForm').reset();
  document.getElementById('loginPassword').value = '';
  lucide.createIcons();
  toast('ලොග් අවුට් වුනා 👋');
}

function enterApp() {
  const s = getSession();
  currentUser = s;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('myName').textContent = s.name;
  document.getElementById('myPhone').textContent = s.phone;
  document.getElementById('myAvatarLetter').textContent = (s.name[0] || 'Z').toUpperCase();
  renderContacts('');
  lucide.createIcons();
  toast('සාදරයෙන් පිළිගන්නවා, ' + s.name + '! 🎉');
}

// ================= CONTACTS =================
function getAllContacts() {
  const registered = getUsers().filter(u => u.phone !== currentUser.phone);
  const all = registered.slice();
  DEMO_CONTACTS.forEach(d => {
    if (!all.some(u => u.phone === d.phone)) all.push(d);
  });
  return all;
}

function avatarColor(phone) {
  let h = 0;
  for (let i = 0; i < phone.length; i++) h = (h * 31 + phone.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

function renderContacts(filter) {
  const listEl = document.getElementById('contactList');
  const contacts = getAllContacts();
  const f = (filter || '').toLowerCase();
  const filtered = contacts.filter(c => c.name.toLowerCase().includes(f) || c.phone.includes(f));

  if (filtered.length === 0) {
    listEl.innerHTML = '<p style="padding:24px; text-align:center; font-size:13px; color:rgba(224,232,240,0.3);">Contact කෙනෙක් හමු වුනේ නෑ 😕</p>';
    return;
  }

  listEl.innerHTML = filtered.map(c => {
    const msgs = getMsgs();
    const thread = msgs[threadKey(c.phone)] || [];
    const last = thread[thread.length - 1];
    const preview = last ? ((last.from === currentUser.phone ? 'ඔයා: ' : '') + esc(last.text)) : 'මැසේජ් නෑ';
    return `
      <div class="contact-item ${activeContact && activeContact.phone === c.phone ? 'active' : ''}" onclick="openChat('${c.phone}','${esc(c.name)}')">
        <div class="avatar online" style="background:${avatarColor(c.phone)};">
          <span>${esc(c.name[0].toUpperCase())}</span><span class="online-dot"></span>
        </div>
        <div style="flex:1; min-width:0;">
          <p style="font-weight:600; font-size:14px; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(c.name)}</p>
          <p style="font-size:12px; color:rgba(224,232,240,0.4); margin:1px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${preview}</p>
        </div>
        ${last ? `<span style="font-size:10.5px; color:rgba(224,232,240,0.3); flex-shrink:0;">${fmtTime(last.time)}</span>` : ''}
      </div>`;
  }).join('');
}

document.getElementById('contactSearch').addEventListener('input', function() {
  renderContacts(this.value.trim());
});

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

// ================= MESSAGING =================
function threadKey(otherPhone) {
  return [currentUser.phone, otherPhone].sort().join('|');
}

function openChat(phone, name) {
  activeContact = { phone: phone, name: name };
  document.getElementById('emptyChat').style.display = 'none';
  document.getElementById('activeChat').style.display = 'flex';
  document.getElementById('chatName').textContent = name;
  document.getElementById('chatAvatarLetter').textContent = name[0].toUpperCase();
  document.getElementById('chatAvatar').style.background = avatarColor(phone);
  document.getElementById('chatStatus').textContent = 'online';
  document.getElementById('chatStatus').style.color = '#22C55E';
  renderContacts(document.getElementById('contactSearch').value.trim());
  renderMessages();
  document.getElementById('msgInput').focus();
  if (window.innerWidth <= 820) document.getElementById('sidebar').classList.remove('open');
}

function renderMessages() {
  const area = document.getElementById('messagesArea');
  const msgs = getMsgs();
  const thread = msgs[threadKey(activeContact.phone)] || [];
  if (thread.length === 0) {
    area.innerHTML = `
      <div style="text-align:center; padding:40px 20px; color:rgba(224,232,240,0.3);">
        <div style="width:60px; height:60px; margin:0 auto 12px; border-radius:50%; background:rgba(0,163,255,0.06); border:1px solid rgba(0,163,255,0.15); display:flex; align-items:center; justify-content:center;">
          <i data-lucide="lock" style="width:24px; height:24px; color:#00A3FF;"></i>
        </div>
        <p style="font-size:13px;">මේ chat එක encrypted 🔒<br>${esc(activeContact.name)} ට මැසේජ් එකක් යවන්න.</p>
      </div>`;
    lucide.createIcons();
    return;
  }
  area.innerHTML = thread.map(m => `
    <div class="msg-row ${m.from === currentUser.phone ? 'sent' : 'received'}">
      <div class="msg-bubble">
        <div>${esc(m.text)}</div>
        <div class="msg-time">${fmtTime(m.time)} ${m.from === currentUser.phone ? '✓✓' : ''}</div>
      </div>
    </div>`).join('');
  area.scrollTop = area.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !activeContact) return;

  const msgs = getMsgs();
  const key = threadKey(activeContact.phone);
  if (!msgs[key]) msgs[key] = [];
  msgs[key].push({ from: currentUser.phone, to: activeContact.phone, text: text, time: Date.now() });
  saveMsgs(msgs);

  input.value = '';
  renderMessages();
  renderContacts(document.getElementById('contactSearch').value.trim());

  // Simulated reply (demo)
  const typingArea = document.getElementById('typingArea');
  document.getElementById('chatStatus').textContent = 'typing...';
  document.getElementById('chatStatus').style.color = '#00D4FF';
  typingArea.innerHTML = '<div class="typing-indicator">typing...</div>';
  typingArea.style.height = 'auto';

  setTimeout(() => {
    typingArea.innerHTML = ''; typingArea.style.height = '0';
    document.getElementById('chatStatus').textContent = 'online';
    document.getElementById('chatStatus').style.color = '#22C55E';
    const msgs2 = getMsgs();
    if (!msgs2[key]) msgs2[key] = [];
    msgs2[key].push({
      from: activeContact.phone, to: currentUser.phone,
      text: DEMO_REPLIES[Math.floor(Math.random() * DEMO_REPLIES.length)],
      time: Date.now()
    });
    saveMsgs(msgs2);
    renderMessages();
    renderContacts(document.getElementById('contactSearch').value.trim());
  }, 1200 + Math.random() * 1500);
}

document.getElementById('msgInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

// ================= INIT =================
lucide.createIcons();
const sess = getSession();
if (sess && getUsers().some(u => u.phone === sess.phone)) {
  enterApp();
}
</script>
</body>
</html>
