<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZETA TOOLS — Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { display: ['Space Grotesk', 'sans-serif'], body: ['DM Sans', 'sans-serif'] } } }
        }
    </script>
    <style>
        /* ═══════════════════════════════════════════════════════════
           ROOT VARIABLES — consistent design system
           ═══════════════════════════════════════════════════════════ */
        :root {
            --bg: #0b0b12;
            --bg2: #12121c;
            --bg3: #1a1a2a;
            --bg4: #24243a;
            --bg5: #2e2e48;
            --brd: #2a2a42;
            --brd2: #3d3d5c;
            --tx: #ececf5;
            --tx2: #a8a8c6;
            --tx3: #6b6b8a;
            --acc: #e8922a;
            --acc-l: #f0a848;
            --acc-g: rgba(232, 146, 42, 0.12);
            --ok: #34d399;
            --ok-bg: rgba(52, 211, 153, 0.1);
            --err: #f87171;
            --err-bg: rgba(248, 113, 113, 0.1);
            --wrn: #fbbf24;
            --wrn-bg: rgba(251, 191, 36, 0.1);
            --info: #60a5fa;
            --info-bg: rgba(96, 165, 250, 0.1);
            --pur: #a78bfa;
            --pur-bg: rgba(167, 139, 250, 0.1);
            --radius: 12px;
            --radius-lg: 16px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--tx);
            overflow: hidden;
            height: 100dvh;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brd2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--tx3);
        }

        /* ─── Login page ─── */
        .login-page {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            background: var(--bg);
            overflow: hidden;
        }
        .login-page .lbg {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.2;
            animation: lfoat 30s ease-in-out infinite alternate;
        }
        .login-page .lbg:nth-child(1) {
            width: 500px;
            height: 500px;
            background: var(--acc);
            top: -20%;
            left: -15%;
        }
        .login-page .lbg:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #6366f1;
            bottom: -20%;
            right: -10%;
            animation-delay: -10s;
        }
        .login-page .lbg:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #ec4899;
            top: 40%;
            left: 55%;
            animation-delay: -18s;
        }
        @keyframes lfoat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(50px, -40px) scale(1.1);
            }
        }
        .login-card {
            position: relative;
            z-index: 1;
            width: 420px;
            max-width: 92vw;
            background: rgba(18, 18, 28, 0.75);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--brd);
            border-radius: var(--radius-lg);
            padding: 40px 36px;
            box-shadow: var(--shadow);
            animation: fadeUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .lfield {
            background: var(--bg3);
            border: 1px solid var(--brd);
            color: var(--tx);
            border-radius: var(--radius);
            padding: 14px 16px 14px 42px;
            width: 100%;
            font-size: 14px;
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
        }
        .lfield:focus {
            border-color: var(--acc);
            box-shadow: 0 0 0 3px var(--acc-g);
        }
        .lfield::placeholder {
            color: var(--tx3);
        }
        .lbtn {
            background: linear-gradient(135deg, var(--acc), var(--acc-l));
            color: #fff;
            font-weight: 700;
            padding: 14px 24px;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: transform var(--transition), box-shadow var(--transition);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }
        .lbtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(232, 146, 42, 0.35);
        }
        .lbtn:active {
            transform: translateY(0);
        }
        .lbtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .lerr {
            background: var(--err-bg);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--err);
            display: none;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s ease;
        }
        .lerr.show {
            display: flex;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20%,
            60% {
                transform: translateX(-6px);
            }
            40%,
            80% {
                transform: translateX(6px);
            }
        }

        /* ─── Admin layout ─── */
        .adm-sidebar {
            width: 260px;
            min-width: 260px;
            height: 100dvh;
            background: var(--bg2);
            border-right: 1px solid var(--brd);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 40;
            position: relative;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 1024px) {
            .adm-sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%);
            }
            .adm-sidebar.open {
                transform: translateX(0);
            }
        }
        .adm-ov {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 35;
            backdrop-filter: blur(4px);
        }
        .adm-ov.active {
            display: block;
        }

        /* Sidebar items */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            margin: 2px 10px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            color: var(--tx2);
            transition: background var(--transition), color var(--transition);
            position: relative;
        }
        .nav-item:hover {
            background: var(--bg3);
            color: var(--tx);
        }
        .nav-item.active {
            background: var(--acc-g);
            color: var(--acc-l);
            font-weight: 600;
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            background: var(--acc);
            border-radius: 0 3px 3px 0;
        }
        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }
        .nav-badge {
            margin-left: auto;
            background: var(--err);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            min-width: 20px;
            text-align: center;
        }

        /* Header */
        .adm-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 24px;
            height: 64px;
            min-height: 64px;
            background: var(--bg2);
            border-bottom: 1px solid var(--brd);
            position: relative;
        }
        .adm-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--acc), transparent);
            background-size: 200% 100%;
            animation: headerGlow 4s ease-in-out infinite;
        }
        @keyframes headerGlow {
            0%,
            100% {
                background-position: 200% 0;
            }
            50% {
                background-position: -200% 0;
            }
        }
        .hbtn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--brd);
            background: var(--bg3);
            color: var(--tx2);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            flex-shrink: 0;
        }
        .hbtn:hover {
            border-color: var(--acc);
            color: var(--acc-l);
            background: var(--acc-g);
        }

        /* Stat cards */
        .stat-card {
            background: var(--bg3);
            border: 1px solid var(--brd);
            border-radius: var(--radius-lg);
            padding: 22px 24px;
            position: relative;
            overflow: hidden;
            transition: all var(--transition);
            animation: cardIn 0.4s ease both;
        }
        .stat-card:hover {
            border-color: var(--brd2);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.12;
            pointer-events: none;
        }
        .stat-card.orange::after {
            background: var(--acc);
        }
        .stat-card.green::after {
            background: var(--ok);
        }
        .stat-card.blue::after {
            background: var(--info);
        }
        .stat-card.purple::after {
            background: var(--pur);
        }
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .stat-num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
        }
        .stat-label {
            font-size: 13px;
            color: var(--tx3);
            margin-top: 6px;
            font-weight: 500;
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .stat-icon.orange {
            background: var(--acc-g);
            color: var(--acc-l);
        }
        .stat-icon.green {
            background: var(--ok-bg);
            color: var(--ok);
        }
        .stat-icon.blue {
            background: var(--info-bg);
            color: var(--info);
        }
        .stat-icon.purple {
            background: var(--pur-bg);
            color: var(--pur);
        }

        /* Tables */
        .atbl {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .atbl thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: var(--tx3);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            background: var(--bg4);
            border-bottom: 1px solid var(--brd);
        }
        .atbl thead th:first-child {
            border-radius: var(--radius) 0 0 0;
        }
        .atbl thead th:last-child {
            border-radius: 0 var(--radius) 0 0;
        }
        .atbl tbody tr {
            transition: background 0.1s;
        }
        .atbl tbody tr:hover {
            background: var(--bg3);
        }
        .atbl tbody td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--brd);
            color: var(--tx2);
        }
        .atbl tbody tr:last-child td {
            border-bottom: none;
        }

        /* Bar chart */
        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .bar-label {
            width: 80px;
            font-size: 12px;
            color: var(--tx3);
            text-align: right;
            flex-shrink: 0;
            font-weight: 500;
        }
        .bar-track {
            flex: 1;
            height: 28px;
            background: var(--bg4);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            padding-left: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            min-width: fit-content;
        }
        .bar-fill.orange {
            background: linear-gradient(90deg, var(--acc), var(--acc-l));
        }
        .bar-fill.green {
            background: linear-gradient(90deg, #059669, var(--ok));
        }
        .bar-fill.blue {
            background: linear-gradient(90deg, #2563eb, var(--info));
        }
        .bar-fill.purple {
            background: linear-gradient(90deg, #7c3aed, var(--pur));
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.ok {
            background: var(--ok-bg);
            color: var(--ok);
        }
        .badge.err {
            background: var(--err-bg);
            color: var(--err);
        }
        .badge.warn {
            background: var(--wrn-bg);
            color: var(--wrn);
        }
        .badge.info {
            background: var(--info-bg);
            color: var(--info);
        }
        .badge.pur {
            background: var(--pur-bg);
            color: var(--pur);
        }

        /* Activity items */
        .act-item {
            display: flex;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--brd);
            animation: itemIn 0.3s ease both;
        }
        .act-item:last-child {
            border-bottom: none;
        }
        .act-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }
        @keyframes itemIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toasts */
        .tc {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 12px 20px 12px 24px;
            border-radius: 100px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 220px;
            max-width: 420px;
            backdrop-filter: blur(16px);
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow);
            cursor: default;
        }
        .toast.success {
            background: rgba(6, 95, 70, 0.85);
            color: #a7f3d0;
            border-color: rgba(16, 185, 129, 0.25);
        }
        .toast.error {
            background: rgba(127, 29, 29, 0.85);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.25);
        }
        .toast.info {
            background: rgba(30, 58, 95, 0.85);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.25);
        }
        .toast .tcls {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            opacity: 0.4;
            font-size: 16px;
            padding: 4px 4px 4px 8px;
            border-radius: 50%;
            transition: opacity 0.15s;
        }
        .toast .tcls:hover {
            opacity: 1;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(50px) scale(0.95);
            }
        }

        /* Modals */
        .mo {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
        }
        .moc {
            background: var(--bg2);
            border: 1px solid var(--brd);
            border-radius: var(--radius-lg);
            max-width: 480px;
            width: 92%;
            animation: modalIn 0.3s ease;
            box-shadow: var(--shadow);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Misc */
        .sfield {
            background: var(--bg3);
            border: 1px solid var(--brd);
            color: var(--tx);
            border-radius: var(--radius);
            padding: 12px 16px;
            width: 100%;
            font-size: 13px;
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
            font-family: 'Space Grotesk', monospace;
        }
        .sfield:focus {
            border-color: var(--acc);
            box-shadow: 0 0 0 3px var(--acc-g);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="tc" id="toasts"></div>
    <div id="modal-root"></div>

    <script>
        /* ═══════════════════════════════════════════════════
           CREDENTIALS — char code arrays (obfuscated)
           Username: admin
           Password: zeta@2024
           ═══════════════════════════════════════════════════ */
        var _cu = [97, 100, 109, 105, 110]; /* "admin"   */
        var _cp = [122, 101, 116, 97, 64, 50, 48, 50, 52]; /* "zeta@2024" */

        function verifyAdmin(u, p) {
            if (u.length !== _cu.length || p.length !== _cp.length) return false;
            for (var i = 0; i < u.length; i++) {
                if (u.charCodeAt(i) !== _cu[i]) return false;
            }
            for (var j = 0; j < p.length; j++) {
                if (p.charCodeAt(j) !== _cp[j]) return false;
            }
            return true;
        }

        /* ═══════════════════════════════════════
           STORAGE — reads main app's z_* data
           ═══════════════════════════════════════ */
        var LS = {
            _g: function(k) { try { return JSON.parse(localStorage.getItem('z_' + k)); } catch (e) { return null; } },
            getUsers: function() { return this._g('users') || []; },
            getNicAll: function() { var users = this.getUsers(); var all = [];
                users.forEach(function(u) { var items = LS._g('nic_' + u.id); if (items) all = all.concat(items); }); return all; },
            getFxAll: function() { var users = this.getUsers(); var all = [];
                users.forEach(function(u) { var items = LS._g('fx_' + u.id); if (items) all = all.concat(items); }); return all; },
            getLotAll: function() { var users = this.getUsers(); var all = [];
                users.forEach(function(u) { var items = LS._g('lot_' + u.id); if (items) all = all.concat(items); }); return all; },
            getPwAll: function() { var users = this.getUsers(); var all = [];
                users.forEach(function(u) { var items = LS._g('pwd_' + u.id); if (items) all = all.concat(items); }); return all; },
            deleteUser: function(uid) {
                var users = this.getUsers().filter(function(u) { return u.id !== uid; });
                localStorage.setItem('z_users', JSON.stringify(users));
                ['nic_', 'fx_', 'lot_', 'pwd_', 'set_'].forEach(function(prefix) { localStorage.removeItem('z_' + prefix +
                        uid); });
            },
            clearAllAppData: function() {
                var keys = [];
                for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('z_') === 0)
                        keys.push(k); }
                keys.forEach(function(k) { localStorage.removeItem(k); });
            },
            // APK specific functions
            getApks: function() {
                try { return JSON.parse(localStorage.getItem('z_apks') || '[]'); } catch { return []; }
            },
            saveApks: function(apks) {
                localStorage.setItem('z_apks', JSON.stringify(apks));
            },
            addApk: function(apk) {
                var apks = this.getApks();
                apks.push(apk);
                this.saveApks(apks);
                return apk;
            },
            updateApk: function(id, data) {
                var apks = this.getApks();
                var index = apks.findIndex(function(a) { return a.id === id; });
                if (index !== -1) {
                    apks[index] = { ...apks[index], ...data, updatedAt: new Date().toISOString() };
                    this.saveApks(apks);
                    return apks[index];

            var lotEntries = Object.keys(lotByGame).sort(function(a, b) { return lotByGame[b] - lotByGame[a]; }).map(function(
                g) { return { label: g.charAt(0).toUpperCase() + g.slice(1), val: lotByGame[g] }; });
            var pwLenDist = {};
            pwAll.forEach(function(p) { var l = p.length || 16; var bucket = l <= 10 ? '6-10' : l <= 16 ? '11-16' : l <=

            return '<div class="p-5 md:p-8 max-w-7xl mx-auto w-full"><div class="grid grid-cols-1 lg:grid-cols-2 gap-6">' +
                '<div class="p-6 rounded-2xl" style="background:var(--bg3);border:1px solid var(--brd)"><div class="flex items-center gap-2 mb-5"><i class="fa-solid fa-venus-mars" style="color:var(--info)"></i><h3 class="font-display text-sm font-semibold">NIC Gender Distribution</h3></div>' +
                barChart([{ label: 'Male', val: nicM, cls: 'blue' }, { label: 'Female', val: nicF, cls: 'purple' }]) +
                '<p class="text-xs mt-3" style="color:var(--tx3)">' + nicAll.length +
                ' total NIC checks</p></div>' +
                '<div class="p-6 rounded-2xl" style="background:var(--bg3);border:1px solid var(--brd)"><div class="flex items-center gap-2 mb-5"><i class="fa-solid fa-money-bill-transfer" style="color:var(--ok)"></i><h3 class="font-display text-sm font-semibold">Currency Lookups</h3></div>' +
                (fxEntries.length ? barChart(fxEntries.map(function(e, i) { return { label: e.label, val: e.val,
                            cls: ['green', 'blue', 'purple', 'orange'][i % 4] }; })) :
                    '<p class="text-sm" style="color:var(--tx3)">No data yet</p>') +
                '<p class="text-xs mt-3" style="color:var(--tx3)">' + fxAll.length +
                ' total FX checks</p></div>' +
                '<div class="p-6 rounded-2xl" style="background:var(--bg3);border:1px solid var(--brd)"><div class="flex items-center gap-2 mb-5"><i class="fa-solid fa-ticket" style="color:var(--acc-l)"></i><h3 class="font-display text-sm font-semibold">Lottery Game Checks</h3></div>' +
                (lotEntries.length ? barChart(lotEntries.map(function(e, i) { return { label: e.label, val: e.val,
                            cls: ['orange', 'green', 'blue', 'purple'][i % 4] }; })) :
                    '<p class="text-sm" style="color:var(--tx3)">No data yet</p>') +
                '<p class="text-xs mt-3" style="color:var(--tx3)">' + lotAll.length +
                ' total lottery checks</p></div>' +
                '<div class="p-6 rounded-2xl" style="background:var(--bg3);border:1px solid var(--brd)"><div class="flex items-center gap-2 mb-5"><i class="fa-solid fa-key" style="color:var(--pur)"></i><h3 class="font-display text-sm font-semibold">Password Length Distribution</h3></div>' +
                barChart(pwEntries.map(function(e, i) { return { label: e.label + ' chars', val: e.val,
                        cls: ['purple', 'blue', 'green', 'orange'][i % 4] }; })) +
                '<p class="text-xs mt-3" style="color:var(--tx3)">' + pwAll.length +
                ' passwords generated</p></div>' +
                '</div></div>';
        }

        /* ═══════════════════════════════════════
           PAGE: ACTIVITY LOG (unchanged)
           ═══════════════════════════════════════ */
        function pgActivity() {
            var allActs = [];
            var users = LS.getUsers();
            var userMap = {};
            users.forEach(function(u) { userMap[u.id] = u.name || 'Unknown'; });
            LS.getNicAll().forEach(function(a) { allActs.push({ type: 'NIC Check', cls: 'info', icon: 'fa-id-card',
                    user: userMap['local'] || 'Guest', detail: 'Decoded ' + esc(a.nic), time: a.created_at }); });
            LS.getFxAll().forEach(function(a) { allActs.push({ type: 'FX Lookup', cls: 'ok', icon: 'fa-money-bill-transfer',
                    user: userMap['local'] || 'Guest', detail: esc(a.code || '') + ' → LKR',
                    time: a.created_at }); });
            LS.getLotAll().forEach(function(a) { allActs.push({ type: 'Lottery Check', cls: 'warn',
                    icon: 'fa-ticket', user: userMap['local'] || 'Guest', detail: esc(a.game || '') + ' #' + esc(a
                        .draw_number || ''), time: a.created_at }); });
            LS.getPwAll().forEach(function(a) { allActs.push({ type: 'Password Gen', cls: 'pur', icon: 'fa-key',
                    user: userMap['local'] || 'Guest', detail: 'Length: ' + (a.length || '?'),
                    time: a.created_at }); });
            allActs.sort(function(a, b) { return new Date(b.time) - new Date(a.time); });
            return '<div class="p-5 md:p-8 max-w-4xl mx-auto w-full"><div class="flex items-center justify-between mb-6"><div><h3 class="font-display text-lg font-semibold">Activity Log</h3><p class="text-sm" style="color:var(--tx3)">' +
                allActs.length + ' event' + (allActs.length === 1 ? '' : 's') +
                ' recorded</p></div>' +
                (allActs.length ? '<button class="px-4 py-2 rounded-lg text-xs font-semibold border-none cursor-pointer" style="background:var(--err-bg);color:var(--err)" onclick="clearActivity()"><i class="fa-solid fa-broom mr-1"></i> Clear Log</button>' :
                    '') +
                '</div>' +
                (allActs.length ?
                    '<div class="rounded-2xl" style="background:var(--bg3);border:1px solid var(--brd)"><div class="divide-y" style="--tw-divide-color:var(--brd)">' +
                    allActs.map(function(a, i) {
                        return '<div class="act-item" style="padding:14px 20px;animation-delay:' + Math.min(i *
                            0.03, 0.5) + 's">' +
                            '<div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style="background:var(--' +
                            a.cls + '-bg);color:var(--' + a.cls + ')"><i class="fa-solid ' + a.icon +
                            '" style="font-size:13px"></i></div>' +
                            '<div class="flex-1 min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="badge ' +
                            a.cls + '">' + a.type + '</span><span class="text-sm" style="color:var(--tx)">' +
                            a.detail + '</span></div>' +
                            '<div class="text-xs mt-1" style="color:var(--tx3)">' + esc(a.user) + ' &bull; ' +
                            relTime(a.time) + '</div></div></div>';
                    }).join('') + '</div></div>'
                    :
                    '<div class="text-center py-16 rounded-2xl" style="background:var(--bg3);border:1px solid var(--brd)"><i class="fa-solid fa-clock-rotate-left text-3xl mb-3" style="color:var(--tx3)"></i><p class="text-sm" style="color:var(--tx3)">No activity recorded yet</p></div>'
                    ) + '</div>';
        }

        function clearActivity() {
            var users = LS.getUsers();
            users.forEach(function(u) { ['nic_', 'fx_', 'lot_', 'pwd_'].forEach(function(p) { localStorage.removeItem(
                        'z_' + p + u.id); }); });
            Toast.show('Activity log cleared', 'info');
            renderPage();
        }

        /* ═══════════════════════════════════════
           PAGE: APKs (NEW)
           ═══════════════════════════════════════ */
        function pgApks() {
            var apks = LS.getApks();
            return '<div class="p-5 md:p-8 max-w-7xl mx-auto w-full">' +
                '<div class="flex items-center justify-between mb-6">' +
                '<div><h3 class="font-display text-lg font-semibold">APK Management</h3><p class="text-sm" style="color:var(--tx3)">' +
                apks.length + ' APK' + (apks.length === 1 ? '' : 's') + ' available</p></div>' +
                '<button class="px-4 py-2 rounded-lg text-sm font-semibold border-none cursor-pointer transition-all" style="background:var(--acc-g);color:var(--acc-l)" onclick="showApkForm()"><i class="fa-solid fa-plus mr-1"></i> Add New APK</button>' +
                '</div>' +
                (apks.length ?
                    '<div class="rounded-2xl overflow-hidden" style="background:var(--bg3);border:1px solid var(--brd)"><div class="overflow-x-auto"><table class="atbl"><thead><tr>' +
                    '<th>#</th><th>Title</th><th>Icon</th><th>Color</th><th>Badge</th><th style="text-align:right">Actions</th></tr></thead><tbody>' +
                    apks.map(function(a, i) {
                        return '<tr>' +
                            '<td>' + (i + 1) + '</td>' +
                            '<td><span class="font-medium" style="color:var(--tx)">' + esc(a
                                .title) + '</span></td>' +
                            '<td><i class="fa-brands ' + esc(a.icon || 'fa-box') + '"></i></td>' +
                            '<td><span class="badge ' + (a.color || 'info') + '" style="background:' +
                            (a.color === 'violet' ? 'var(--pur-bg)' : a.color === 'blue' ?
                                'var(--info-bg)' : a.color === 'red' ? 'var(--err-bg)' :
                                'var(--ok-bg)') + ';color:' + (a.color === 'violet' ?
                                'var(--pur)' : a.color === 'blue' ? 'var(--info)' :
                                a.color === 'red' ? 'var(--err)' : 'var(--ok)') + '">' +
                            esc(a.color || 'info') + '</span></td>' +
                            '<td>' + esc(a.badge || '') + '</td>' +
                            '<td style="text-align:right"><button class="hbtn" style="width:32px;height:32px;font-size:12px" onclick="showApkForm(\'' +
                            a.id + '\')"><i class="fa-solid fa-pen"></i></button> ' +
                            '<button class="hbtn" style="width:32px;height:32px;font-size:12px;color:var(--err)" onclick="deleteApk(\'' +
                            a.id + '\',\'' + esc(a.title).replace(/'/g, "\\'") +
                            '\')"><i class="fa-solid fa-trash-can"></i></button></td></tr>';
                    }).join('') +
                    '</tbody></table></div></div>'
                    :
                    '<div class="text-center py-16 rounded-2xl" style="background:var(--bg3);border:1px solid var(--brd)"><i class="fa-solid fa-box-open text-3xl mb-3" style="color:var(--tx3)"></i><p class="text-sm" style="color:var(--tx3)">No APKs yet. Click "Add New APK" to get started.</p></div>'
                    ) + '</div>';
        }

        function showApkForm(id) {
            var apk = id ? LS.getApks().find(function(a) { return a.id === id; }) : null;
            var isEdit = !!apk;
            var title = isEdit ? 'Edit APK' : 'Add New APK';
            var buttonText = isEdit ? 'Update APK' : 'Create APK';
            var formHtml = `
                <div class="p-5">
                    <h3 class="font-display text-lg font-semibold mb-1">${title}</h3>
                    <p class="text-sm mb-4" style="color:var(--tx3)">${isEdit ? 'Update the APK details below.' : 'Fill in the details to add a new APK.'}</p>
                    <form id="apkForm" onsubmit="return false;">
                        <div class="mb-3">
                            <label class="block text-xs font-medium mb-1" style="color:var(--tx2)">Title *</label>
                            <input type="text" id="apkTitle" class="sfield" value="${isEdit ? esc(apk.title) : ''}" placeholder="e.g. WhatsApp Premium APK" required />
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium mb-1" style="color:var(--tx2)">Description *</label>
                            <input type="text" id="apkDesc" class="sfield" value="${isEdit ? esc(apk.description) : ''}" placeholder="Short description" required />
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-xs font-medium mb-1" style="color:var(--tx2)">Icon (Font Awesome class)</label>
                                <input type="text" id="apkIcon" class="sfield" value="${isEdit ? esc(apk.icon) : 'fa-youtube'}" placeholder="fa-youtube" />
                            </div>
                            <div>
                                <label class="block text-xs font-medium mb-1" style="color:var(--tx2)">Color theme</label>
                                <select id="apkColor" class="sfield">
                                    ${['violet','blue','red','green','cyan'].map(c => `<option value="${c}" ${isEdit && apk.color === c ? 'selected' : ''}>${c}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-medium mb-1" style="color:var(--tx2)">Download URL *</label>
                            <input type="url" id="apkUrl" class="sfield" value="${isEdit ? esc(apk.downloadUrl) : ''}" placeholder="https://..." required />
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-xs font-medium mb-1" style="color:var(--tx2)">Badge text</label>
                                <input type="text" id="apkBadge" class="sfield" value="${isEdit ? esc(apk.badge) : 'Premium'}" placeholder="Premium" />
                            </div>
                            <div>
                                <label class="block text-xs font-medium mb-1" style="color:var(--tx2)">Tags (comma separated)</label>
                                <input type="text" id="apkTags" class="sfield" value="${isEdit ? esc(apk.tags ? apk.tags.join(', ') : '') : 'APK, Android, MediaFire'}" placeholder="APK, Android" />
                            </div>
                        </div>
                        <div id="apkFormError" class="auth-error"></div>
                        <button type="submit" id="apkSubmit" class="lbtn w-full mt-2">${buttonText}</button>
                    </form>
                </div>
            `;
            Modal.open(formHtml);
            setTimeout(function() {
                var form = document.getElementById('apkForm');
                var errorEl = document.getElementById('apkFormError');
                var submitBtn = document.getElementById('apkSubmit');
                if (!form) return;
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    var title = document.getElementById('apkTitle').value.trim();
                    var desc = document.getElementById('apkDesc').value.trim();
                    var icon = document.getElementById('apkIcon').value.trim() || 'fa-box';
                    var color = document.getElementById('apkColor').value;
                    var url = document.getElementById('apkUrl').value.trim();
                    var badge = document.getElementById('apkBadge').value.trim();
                    var tags = document.getElementById('apkTags').value.split(',').map(function(t) { return t
                        .trim(); }).filter(function(t) { return t; });

                    if (!title || !desc || !url) {
                        errorEl.textContent = 'Title, Description, and Download URL are required.';
                        return;
                    }
                    errorEl.textContent = '';
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Saving...';

                    var data = {
                        title: title,
                        description: desc,
                        icon: icon,
                        color: color,
                        downloadUrl: url,
                        badge: badge || 'Premium',
                        tags: tags
                    };
                    if (isEdit) {
                        LS.updateApk(id, data);
                        Toast.show('APK updated successfully', 'success');
                    } else {
                        var newApk = {
                            id: 'apk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                            ...data,
                            createdAt: new Date().toISOString()
                        };
                        LS.addApk(newApk);
                        Toast.show('APK created successfully', 'success');
                    }
                    Modal.close();
                    renderPage();
                });
            }, 50);
        }

        function deleteApk(id, title) {
            Modal.open('<div class="p-6"><div class="flex items-center gap-3 mb-4"><div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--err-bg)"><i class="fa-solid fa-trash-can" style="color:var(--err)"></i></div><div><h3 class="font-display font-semibold">Delete APK</h3><p class="text-xs" style="color:var(--tx3)">This action cannot be undone</p></div></div><p class="text-sm mb-6" style="color:var(--tx2)">Delete <strong style="color:var(--tx)">' +
                title + '</strong> permanently?</p><div class="flex gap-3"><button class="flex-1 py-3 rounded-lg font-semibold text-sm border cursor-pointer" style="background:var(--bg3);border-color:var(--brd);color:var(--tx)" onclick="Modal.close()">Cancel</button><button class="flex-1 py-3 rounded-lg font-semibold text-sm border-none cursor-pointer" style="background:var(--err);color:#fff" onclick="doDeleteApk(\'' +
                id + '\')">Delete</button></div></div>');
        }

        function doDeleteApk(id) {
            LS.deleteApk(id);
            Modal.close();
            Toast.show('APK deleted', 'info');
            renderPage();
        }

        /* ═══════════════════════════════════════
           PAGE: SETTINGS (unchanged)
           ═══════════════════════════════════════ */
        function pgSettings() {
            var totalKeys = 0;
            var totalSize = 0;
            for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('z_') === 0) {
                    totalKeys++;
                    totalSize += (localStorage.getItem(k) || '').length; } }
            var sizeKB = (totalSize / 1024).toFixed(1);
            return '<div class="p-5 md:p-8 max-w-3xl mx-auto w-full">' +
                '<div class="p-6 rounded-2xl mb-6" style="background:var(--bg3);border:1px solid var(--brd)"><div class="flex items-center gap-2 mb-5"><i class="fa-solid fa-database" style="color:var(--info)"></i><h3 class="font-display text-sm font-semibold">Storage Information</h3></div><div class="grid grid-cols-2 gap-4">' +
                si('Total Keys', totalKeys, 'fa-key') + si('Storage Used', sizeKB + ' KB', 'fa-hard-drive') +
                si('Max Capacity', '5 MB', 'fa-circle-info') + si('Usage', Math.round((totalSize / 1024 / 5) *
                    100) + '%', 'fa-chart-simple') +
                '</div></div>' +
                '<div class="p-6 rounded-2xl" style="background:var(--bg3);border:1px solid rgba(248,113,113,0.2)"><div class="flex items-center gap-2 mb-5"><i class="fa-solid fa-triangle-exclamation" style="color:var(--err)"></i><h3 class="font-display text-sm font-semibold" style="color:var(--err)">Danger Zone</h3></div><p class="text-sm mb-5" style="color:var(--tx3)">These actions are irreversible.</p><div class="flex flex-col gap-3">' +
                '<button class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium border cursor-pointer text-left" style="background:var(--err-bg);border-color:rgba(248,113,113,0.15);color:var(--err)" onclick="clearAllUsers()"><i class="fa-solid fa-users-slash w-5 text-center"></i><div><div>Delete All Users & Data</div><div class="text-xs font-normal mt-0.5" style="color:var(--tx3)">Remove every user and all tool history</div></div></button>' +
                '<button class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium border cursor-pointer text-left" style="background:var(--err-bg);border-color:rgba(248,113,113,0.15);color:var(--err)" onclick="clearActivity()"><i class="fa-solid fa-broom w-5 text-center"></i><div><div>Clear All Activity Logs</div><div class="text-xs font-normal mt-0.5" style="color:var(--tx3)">Remove NIC, FX, Lottery, Password history</div></div></button>' +
                '<button class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium border cursor-pointer text-left" style="background:rgba(251,191,36,0.08);border-color:rgba(251,191,36,0.15);color:var(--wrn)" onclick="nuclearOption()"><i class="fa-solid fa-radiation w-5 text-center"></i><div><div>Nuclear Option — Wipe Everything</div><div class="text-xs font-normal mt-0.5" style="color:var(--tx3)">Clear ALL localStorage for this domain</div></div></button>' +
                '</div></div>' +
                '<div class="mt-6 p-5 rounded-2xl text-center" style="background:var(--bg3);border:1px solid var(--brd)"><p class="text-xs" style="color:var(--tx3)">ZETA TOOLS Admin Panel v1.0</p><p class="text-xs mt-1" style="color:var(--tx3)">Session: ' +
                (AdminAuth.isLogged() ? '<span style="color:var(--ok)">Active</span>' :
                    '<span style="color:var(--err)">Expired</span>') + '</p></div></div>';
        }

        function si(label, val, icon) {
            return '<div class="p-4 rounded-xl" style="background:var(--bg4)"><div class="flex items-center gap-2 mb-1"><i class="fa-solid ' +
                icon + '" style="color:var(--tx3);font-size:11px"></i><span class="text-xs" style="color:var(--tx3)">' +
                label + '</span></div><div class="font-display text-lg font-bold" style="color:var(--tx)">' + val +
                '</div></div>';
        }

        function nuclearOption() {
            Modal.open('<div class="p-6 text-center"><i class="fa-solid fa-radiation text-4xl mb-3" style="color:var(--wrn)"></i><h3 class="font-display text-lg font-semibold mb-2">Nuclear Option</h3><p class="text-sm mb-6" style="color:var(--tx2)">Clear <strong>ALL</strong> localStorage data for this entire domain.</p><div class="flex gap-3"><button class="flex-1 py-3 rounded-lg font-semibold text-sm border cursor-pointer" style="background:var(--bg3);border-color:var(--brd);color:var(--tx)" onclick="Modal.close()">Cancel</button><button class="flex-1 py-3 rounded-lg font-semibold text-sm border-none cursor-pointer" style="background:var(--wrn);color:#000" onclick="localStorage.clear();Modal.close();Toast.show(\'Everything wiped\',\'info\');renderPage();">Wipe All</button></div></div>');
        }

        /* ═══════════════════════════════════════
           INIT
           ═══════════════════════════════════════ */
        (function() {
            document.documentElement.classList.add('dark');
            if (AdminAuth.isLogged()) { renderAdmin(); } else { renderLogin(); }
        })();
    </script>
</body>
</html>
