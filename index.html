<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZETA TOOLS — Premium APK Downloads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { display: ['Space Grotesk', 'sans-serif'], body: ['DM Sans', 'sans-serif'] } } } }
    </script>
    <style>
        :root {
            --bg: #050510;
            --bg2: #0a0a1a;
            --bg3: #0f0f24;
            --bg4: #14142e;
            --brd: rgba(255,255,255,0.05);
            --brd2: rgba(255,255,255,0.09);
            --tx: #eeeef5;
            --tx2: #8b8baa;
            --tx3: #555570;
            --acc: #3b82f6;
            --acc-l: #60a5fa;
            --acc-d: #2563eb;
            --acc-g: rgba(59,130,246,0.07);
            --acc-glow: rgba(59,130,246,0.12);
            --cyan: #06b6d4;
            --cyan-l: #22d3ee;
            --purple: #8b5cf6;
            --purple-l: #a78bfa;
            --ok: #34d399;
            --err: #f87171;
            --wrn: #fbbf24;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--tx); overflow: hidden; height: 100dvh; }
        h1,h2,h3,h4,h5,h6 { font-family: 'Space Grotesk', sans-serif; }
        input,textarea,button,select { font-family: inherit; }
        ::selection { background: rgba(59,130,246,0.25); color: var(--tx); }
        :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; transition: background .3s; }
        ::-webkit-scrollbar-thumb:hover { background: var(--acc); }
        #tarea::-webkit-scrollbar { width: 4px; }
        #tarea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 10px; }

        /* ===== TOP NAV — centered branding ===== */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            height: 62px; display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 20px;
            background: rgba(5,5,16,0.82);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--brd);
            z-index: 50;
        }
        .top-nav::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent 5%, rgba(59,130,246,0.3) 35%, rgba(139,92,246,0.2) 65%, transparent 95%);
        }
        .nav-left { display: flex; align-items: center; gap: 8px; }
        .nav-right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
        .nav-center { display: flex; align-items: center; justify-content: center; }

        /* Centered logo — the main branding */
        .nav-brand {
            display: flex; align-items: center; gap: 11px;
            text-decoration: none; user-select: none;
            position: relative;
        }
        .nav-brand-icon {
            width: 36px; height: 36px; border-radius: 11px;
            background: linear-gradient(135deg, var(--acc), var(--acc-d));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 15px; flex-shrink: 0;
            box-shadow: 0 2px 14px rgba(59,130,246,0.28);
            position: relative;
            transition: transform .3s, box-shadow .3s;
        }
        .nav-brand-icon::after {
            content: ''; position: absolute; inset: -3px; border-radius: 14px;
            background: linear-gradient(135deg, var(--acc), var(--purple));
            opacity: 0.25; z-index: -1; filter: blur(10px);
            transition: opacity .3s;
        }
        .nav-brand:hover .nav-brand-icon { transform: scale(1.06) rotate(-3deg); box-shadow: 0 4px 22px rgba(59,130,246,0.35); }
        .nav-brand:hover .nav-brand-icon::after { opacity: 0.45; }
        .nav-brand-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px; font-weight: 700; letter-spacing: -0.8px; line-height: 1;
        }
        .nav-brand-zeta {
            background: linear-gradient(135deg, #60a5fa, #3b82f6, #818cf8, #3b82f6);
            background-size: 200% 100%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: brandGrad 5s ease-in-out infinite;
            filter: drop-shadow(0 0 18px rgba(59,130,246,0.06));
        }
        @keyframes brandGrad { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .nav-brand-tools {
            -webkit-text-fill-color: var(--tx2); font-weight: 400;
            margin-left: 1px;
        }
        .nav-brand-sub {
            font-size: 9px; font-weight: 600; color: var(--tx3);
            letter-spacing: 2.5px; text-transform: uppercase;
            margin-top: 1px; opacity: .6;
        }

        /* Nav links */
        .nav-links { display: flex; align-items: center; gap: 2px; }
        .nav-link {
            padding: 7px 13px; border-radius: 9px; font-size: 13px;
            font-weight: 500; color: var(--tx2); cursor: pointer;
            transition: all .2s; border: none; background: none; white-space: nowrap;
        }
        .nav-link:hover { color: var(--tx); background: rgba(255,255,255,0.04); }

        /* Nav buttons */
        .nav-btn {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--brd); background: rgba(255,255,255,0.02);
            color: var(--tx2); cursor: pointer; transition: all .2s; font-size: 13px;
        }
        .nav-btn:hover { border-color: rgba(59,130,246,0.25); color: var(--acc-l); background: var(--acc-g); }
        .nav-avatar {
            width: 34px; height: 34px; border-radius: 10px; object-fit: cover;
            border: 2px solid rgba(255,255,255,0.07); cursor: pointer; transition: all .25s;
        }
        .nav-avatar:hover { border-color: rgba(59,130,246,0.35); transform: scale(1.06); }

        /* ===== SIDEBAR (mobile menu) ===== */
        .sidebar {
            width: 280px; min-width: 280px; height: 100dvh;
            background: rgba(8,8,20,0.98);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--brd);
            display: flex; flex-direction: column;
            transition: transform .3s cubic-bezier(0.32,1.25,0.58,1);
            z-index: 45; position: relative; overflow: hidden;
            box-shadow: 4px 0 40px rgba(0,0,0,0.4);
        }
        .sidebar::after {
            content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(59,130,246,0.12), transparent);
        }
        @media(min-width:768px) { .sidebar { display: none !important; } .sb-ov { display: none !important; } }
        @media(max-width:767px) {
            .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); border-radius: 0 18px 18px 0; }
            .sidebar.open { transform: translateX(0); }
        }
        .sb-header { padding: 20px 20px 16px; position: relative; }
        .sb-header::after { content: ''; position: absolute; bottom: 0; left: 16px; right: 16px; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.1), transparent); }
        .sb-logo { display: flex; align-items: center; gap: 12px; }
        .sb-logo-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--acc), var(--acc-d)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; flex-shrink: 0; box-shadow: 0 3px 16px rgba(59,130,246,0.25); }
        .sb-logo-name { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; color: var(--tx); line-height: 1; }
        .sb-logo-name span { color: var(--tx3); font-weight: 400; }
        .sb-logo-ver { font-size: 10px; color: var(--tx3); margin-top: 2px; letter-spacing: 0.5px; }
        .sb-nav { padding: 12px; display: flex; flex-direction: column; gap: 2px; }
        .sb-nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 11px; font-size: 14px; font-weight: 500; color: var(--tx2); background: none; border: none; cursor: pointer; transition: all .2s; width: 100%; text-align: left; }
        .sb-nav-item:hover { background: rgba(59,130,246,0.06); color: var(--tx); }
        .sb-nav-item i { width: 18px; text-align: center; font-size: 14px; color: var(--tx3); transition: color .2s; }
        .sb-nav-item:hover i { color: var(--acc-l); }
        .sb-profile { margin: auto 12px 14px; padding: 12px 14px; border-radius: 13px; background: rgba(59,130,246,0.03); border: 1px solid var(--brd); cursor: pointer; transition: all .25s; position: relative; }
        .sb-profile:hover { border-color: rgba(59,130,246,0.15); background: rgba(59,130,246,0.06); }
        .sb-profile-inner { display: flex; align-items: center; gap: 11px; position: relative; z-index: 1; }
        .sb-profile-avatar { position: relative; flex-shrink: 0; }
        .sb-profile-avatar img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 2px solid rgba(255,255,255,0.07); transition: border-color .2s; }
        .sb-profile:hover .sb-profile-avatar img { border-color: rgba(59,130,246,0.3); }
        .sb-profile-dot { position: absolute; bottom: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); border: 2px solid #0a0a1a; animation: dotPulse 2s ease-in-out infinite; }
        @keyframes dotPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); } 50% { box-shadow: 0 0 0 4px rgba(52,211,153,0); } }
        .sb-profile-name { font-size: 13px; font-weight: 600; color: var(--tx); line-height: 1.2; }
        .sb-profile-status { font-size: 11px; color: var(--ok); display: flex; align-items: center; gap: 5px; }
        .sb-profile-status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
        .sb-profile-ellipsis { margin-left: auto; color: var(--tx3); font-size: 13px; transition: all .25s; }
        .sb-profile:hover .sb-profile-ellipsis { color: var(--tx2); transform: rotate(90deg); }
        .sb-ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; backdrop-filter: blur(6px); animation: fi .2s ease; }
        .sb-ov.active { display: block; }

        /* ===== DROPDOWN ===== */
        .dd { position: absolute; background: rgba(10,10,26,0.96); backdrop-filter: blur(20px); border: 1px solid var(--brd); border-radius: 12px; padding: 6px; min-width: 180px; box-shadow: 0 12px 48px rgba(0,0,0,0.5); animation: ddin .15s cubic-bezier(0.32,1.25,0.58,1); z-index: 50; }
        @keyframes ddin { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .ddi { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--tx2); transition: all .15s; border: none; background: none; width: 100%; text-align: left; }
        .ddi:hover { background: rgba(59,130,246,0.06); color: var(--tx); }
        .ddv { height: 1px; background: var(--brd); margin: 4px 0; }

        /* ===== TOAST ===== */
        .tc { position: fixed; top: 74px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; max-width: 380px; width: calc(100% - 32px); }
        .toast { padding: 12px 16px; border-radius: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; animation: tin .3s cubic-bezier(0.32,1.25,0.58,1); backdrop-filter: blur(16px); font-weight: 500; border: 1px solid var(--brd); box-shadow: 0 8px 32px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        .toast .toast-content { display: flex; align-items: center; gap: 10px; }
        .toast .progress-bar { width: 100%; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
        .toast .progress-fill { height: 100%; width: 100%; background: currentColor; border-radius: 2px; animation: shrinkProg 3.5s linear forwards; }
        @keyframes shrinkProg { from { width: 100%; } to { width: 0%; } }
        .toast.success { background: rgba(6,78,59,0.88); color: #a7f3d0; } .toast.success i { color: #34d399; }
        .toast.error { background: rgba(127,29,29,0.88); color: #fca5a5; } .toast.error i { color: #f87171; }
        .toast.info { background: rgba(30,58,138,0.88); color: #93c5fd; } .toast.info i { color: #60a5fa; }
        .toast-close { background: none; border: none; color: inherit; cursor: pointer; opacity: .3; font-size: 14px; padding: 4px 4px 4px 8px; transition: all .15s; border-radius: 50%; margin-left: auto; line-height: 1; }
        .toast-close:hover { opacity: 1; background: rgba(0,0,0,0.15); }
        @keyframes tin { from { opacity: 0; transform: translateX(40px) scale(.94); } to { opacity: 1; transform: translateX(0) scale(1); } }
        @keyframes tout { from { opacity: 1; transform: translateX(0) scale(1); } to { opacity: 0; transform: translateX(40px) scale(.94); } }

        /* ===== MODAL ===== */
        .mo { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(14px); z-index: 100; display: flex; align-items: center; justify-content: center; animation: fi .2s ease; }
        .moc { background: rgba(10,10,26,0.94); backdrop-filter: blur(24px); border: 1px solid var(--brd); border-radius: 18px; max-width: 520px; width: 92%; max-height: 85vh; overflow-y: auto; animation: modin .3s cubic-bezier(0.32,1.25,0.58,1); box-shadow: 0 20px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03); }
        .moc::-webkit-scrollbar { width: 4px; } .moc::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
        @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modin { from { opacity: 0; transform: scale(.93) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        /* ===== BUTTONS ===== */
        .bs { background: rgba(255,255,255,0.03); border: 1px solid var(--brd); color: var(--tx); font-weight: 500; padding: 10px 20px; border-radius: 11px; cursor: pointer; font-size: 13px; transition: all .25s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .bs:hover { border-color: var(--brd2); background: rgba(255,255,255,0.05); transform: translateY(-1px); }
        .data-mgmt { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .data-mgmt .bs { flex: 1; min-width: 80px; font-size: 12px; padding: 8px 12px; }
        .hidden { display: none !important; }

        /* ===== HERO ===== */
        .hero-section { position: relative; padding: 90px 24px 56px; text-align: center; overflow: hidden; }
        .hero-section::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(59,130,246,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.035) 1px, transparent 1px); background-size: 52px 52px; mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 15%, transparent 65%); -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 15%, transparent 65%); pointer-events: none; }
        .hero-orb { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(80px); will-change: transform; }
        .hero-orb-1 { top: -15%; left: -5%; width: 480px; height: 480px; background: radial-gradient(circle, rgba(59,130,246,0.10), transparent 70%); animation: orbDrift1 22s ease-in-out infinite alternate; }
        .hero-orb-2 { bottom: -20%; right: -8%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.08), transparent 70%); animation: orbDrift2 18s ease-in-out infinite alternate; }
        @keyframes orbDrift1 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,20px) scale(1.08); } 100% { transform: translate(-20px,-10px) scale(.95); } }
        @keyframes orbDrift2 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-25px,15px) scale(1.1); } 100% { transform: translate(15px,-25px) scale(.92); } }
        .hero-geo { position: absolute; border: 1px solid rgba(59,130,246,0.06); pointer-events: none; }
        .hero-geo-1 { top: 18%; right: 10%; width: 100px; height: 100px; border-radius: 18px; transform: rotate(45deg); animation: geoSpin 30s linear infinite; }
        .hero-geo-2 { bottom: 22%; left: 7%; width: 60px; height: 60px; border-radius: 50%; border-color: rgba(139,92,246,0.05); animation: geoSpin 24s linear infinite reverse; }
        @keyframes geoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .hero-badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 16px; border-radius: 100px; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.1); color: var(--acc-l); margin-bottom: 24px; }
        .hero-badge i { font-size: 10px; }
        .hero-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 5.5vw, 52px); font-weight: 700; letter-spacing: -2px; line-height: 1.05; margin-bottom: 16px; }
        .hero-title-gradient { background: linear-gradient(135deg, #60a5fa, #3b82f6, #818cf8, #3b82f6); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: heroGrad 6s ease-in-out infinite; }
        @keyframes heroGrad { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .hero-subtitle { font-size: clamp(14px, 2vw, 17px); color: var(--tx2); max-width: 480px; margin: 0 auto 32px; line-height: 1.7; font-weight: 400; }
        .hero-ctas { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .cta-primary { display: inline-flex; align-items: center; gap: 9px; padding: 13px 28px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #fff; background: linear-gradient(135deg, var(--acc), var(--acc-d)); border: none; cursor: pointer; transition: all .3s; box-shadow: 0 4px 20px rgba(59,130,246,0.2); text-decoration: none; }
        .cta-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(59,130,246,0.3); }
        .cta-primary:active { transform: scale(.97); }
        .cta-secondary { display: inline-flex; align-items: center; gap: 9px; padding: 13px 28px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--tx2); background: rgba(255,255,255,0.03); border: 1px solid var(--brd2); cursor: pointer; transition: all .3s; text-decoration: none; }
        .cta-secondary:hover { color: var(--tx); border-color: rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); transform: translateY(-2px); }
        .hero-divider { width: 48px; height: 1px; background: linear-gradient(90deg, transparent, var(--acc), transparent); margin: 40px auto 0; opacity: .4; }

        /* ===== FEATURES ===== */
        .features-section { padding: 56px 24px; max-width: 960px; margin: 0 auto; }
        .section-label { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--acc-l); margin-bottom: 12px; }
        .section-label i { font-size: 10px; }
        .section-title { font-size: clamp(22px, 3.5vw, 32px); font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
        .section-desc { font-size: 14px; color: var(--tx2); max-width: 440px; line-height: 1.7; margin-bottom: 36px; }
        .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .feature-card { background: rgba(12,12,30,0.6); backdrop-filter: blur(10px); border: 1px solid var(--brd); border-radius: 18px; padding: 26px 22px; transition: all .35s; position: relative; overflow: hidden; }
        .feature-card::before { content: ''; position: absolute; inset: 0; border-radius: 18px; padding: 1px; background: linear-gradient(135deg, rgba(59,130,246,0.12), transparent 50%, rgba(139,92,246,0.08)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: 0; transition: opacity .35s; }
        .feature-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.07); box-shadow: 0 10px 36px rgba(0,0,0,0.25); }
        .feature-card:hover::before { opacity: 1; }
        .feature-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; margin-bottom: 16px; transition: transform .3s; }
        .feature-card:hover .feature-icon { transform: scale(1.08); }
        .feature-icon.blue { background: rgba(59,130,246,0.1); color: var(--acc-l); }
        .feature-icon.cyan { background: rgba(6,182,212,0.1); color: var(--cyan-l); }
        .feature-icon.purple { background: rgba(139,92,246,0.1); color: var(--purple-l); }
        .feature-icon.green { background: rgba(52,211,153,0.1); color: var(--ok); }
        .feature-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.3px; }
        .feature-card p { font-size: 13px; color: var(--tx3); line-height: 1.65; }

        /* ===== DOWNLOADS ===== */
        .downloads-section { padding: 36px 24px 56px; max-width: 800px; margin: 0 auto; }
        .download-card { background: rgba(12,12,30,0.65); backdrop-filter: blur(14px); border: 1px solid var(--brd); border-radius: 22px; padding: 28px; position: relative; overflow: hidden; transition: all .35s; margin-bottom: 16px; }

        .download-card::after { content: ''; position: absolute; top: -40%; right: -15%; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, var(--card-glow, rgba(59,130,246,0.06)), transparent 70%); pointer-events: none; opacity: .6; transition: opacity .35s; }

        .app-icon { width: 56px; height: 56px; min-width: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; position: relative; z-index: 2; transition: transform .35s; }

        .app-icon.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 4px 18px rgba(139,92,246,0.3); }

        .app-icon .sparkle { position: absolute; top: -5px; right: -5px; font-size: 11px; color: #fcd34d; filter: drop-shadow(0 0 6px rgba(252,211,77,0.4)); animation: sparkle 2.5s ease-in-out infinite; }
        @keyframes sparkle { 0%,100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(1.25) rotate(15deg); opacity: .7; } }
        .dl-card-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; }

        .dl-card-desc { font-size: 13px; color: var(--tx2); line-height: 1.65; margin-top: 2px; }
        .dl-info { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .dl-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 7px; font-size: 11px; color: var(--tx3); background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.035); }
        .dl-tag i { font-size: 10px; }
        .premium-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 100px; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .premium-badge.purple { background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.12); color: var(--purple-l); }
        .premium-badge.blue { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.12); color: var(--acc-l); }
        .premium-badge i { font-size: 7px; color: #fcd34d; }
        .dl-btn { display: inline-flex; align-items: center; gap: 9px; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; color: #fff; border: none; cursor: pointer; transition: all .3s; text-decoration: none; position: relative; overflow: hidden; z-index: 2; }
        .dl-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 60%); opacity: 0; transition: opacity .3s; }
        .dl-btn:hover::before { opacity: 1; }
        .dl-btn.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 3px 16px rgba(139,92,246,0.2); }
        .dl-btn.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 3px 16px rgba(59,130,246,0.2); }

        /* ===== SCROLL REVEAL ===== */
        .reveal { opacity: 0; transform: translateY(22px); transition: opacity .65s ease, transform .65s ease; }

        .reveal-d1 { transition-delay: .08s; } .reveal-d2 { transition-delay: .16s; } .reveal-d3 { transition-delay: .24s; } .reveal-d4 { transition-delay: .32s; }

        /* ===== RESPONSIVE ===== */

            .hero-section { padding: 72px 18px 40px; }

<body>
    <div id="app"></div>
    <div class="tc" id="toasts"></div>
    <div id="modal-root"></div>

    <script>
        const U = {
            esc: s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; },
            now: () => new Date().toISOString(),
            relTime: d => {
                const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
                if (s < 60) return 'Just now';
                if (s < 3600) return Math.floor(s / 60) + 'm ago';
                if (s < 86400) return Math.floor(s / 3600) + 'h ago';
                if (s < 604800) return Math.floor(s / 86400) + 'd ago';
                return new Date(d).toLocaleDateString();
            }
        };
        const DB = {
            _g: k => { try { return JSON.parse(localStorage.getItem('z_' + k)); } catch(e) { return null; } },
            _s: (k, v) => { try { localStorage.setItem('z_' + k, JSON.stringify(v)); } catch(e) {} },
            getUsers: function() { return this._g('users') || []; },
            saveUsers: function(u) { this._s('users', u); },
            findUserById: function(id) { return this.getUsers().find(u => u.id === id); },
            addUser: function(u) { const us = this.getUsers(); us.push(u); this.saveUsers(us); return u; },
            clearAll: function() {
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('z_') === 0) keys.push(k); }
                keys.forEach(k => localStorage.removeItem(k));
                try { sessionStorage.removeItem('z_sess'); } catch(e) {}
            }
        };
        const Auth = {
            _uid: 'local',
            getUser: function() {
                let user = DB.findUserById(this._uid);
                if (!user) { user = DB.addUser({ id: this._uid, name: 'Guest', profile_image: 'https://ui-avatars.com/api/?name=Guest&background=3b82f6&color=fff&size=128&bold=true', created_at: U.now() }); }
                return user;
            }
        };
        const Toast = {
            show: function(msg, type, dur) {
                type = type || 'info'; dur = dur || 3500;
                const c = document.getElementById('toasts');
                const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
                const el = document.createElement('div');
                el.className = 'toast ' + type;
                el.innerHTML = `<div class="toast-content"><i class="fa-solid ${icons[type]||icons.info}"></i><span>${U.esc(msg)}</span><button class="toast-close" onclick="this.closest('.toast').remove()"><i class="fa-solid fa-xmark"></i></button></div><div class="progress-bar"><div class="progress-fill"></div></div>`;
                c.appendChild(el);
                const timer = setTimeout(() => { el.style.animation = 'tout .25s ease forwards'; setTimeout(() => el.remove(), 300); }, dur);
                el.addEventListener('click', e => { if (e.target.closest('.toast-close')) return; clearTimeout(timer); el.style.animation = 'tout .25s ease forwards'; setTimeout(() => el.remove(), 300); });
                el.querySelector('.toast-close').addEventListener('click', () => clearTimeout(timer));
            }
        };
        const Modal = {
            open: function(html) {
                document.getElementById('modal-root').innerHTML = `<div class="mo" id="mo"><div class="moc">${html}</div></div>`;

            close: function() { document.getElementById('modal-root').innerHTML = ''; }
        };
        const Store = { sidebarOpen: false, profileDropdown: false };

        function togSB() {
            const s = document.getElementById('sb'), o = document.getElementById('sb-ov');

            Store.sidebarOpen = !Store.sidebarOpen;
        }
        function clsSBM() {
            if (window.innerWidth < 768) {

        }

            if (Store.profileDropdown && !e.target.closest('#ptrig') && !e.target.closest('#pmenu')) {

                if (m) m.classList.add('hidden');
            }
        });
        function navTo(id) {
            clsSBM();
            setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 280);
        }

        function openProfile() {
            const user = Auth.getUser();
            Modal.open(`<div class="p-6"><div class="flex items-center gap-4 mb-5"><div class="relative"><img src="${U.esc(user.profile_image)}" class="w-14 h-14 rounded-xl object-cover border-2" style="border-color:rgba(59,130,246,0.2)" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=3b82f6&color=fff&size=64'"><div class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2" style="background:var(--ok);border-color:#0a0a1a"></div></div><div><h3 class="font-display text-lg font-semibold">${U.esc(user.name)}</h3><p class="text-sm" style="color:var(--tx3)">${U.esc(user.email||'guest@zeta.tools')}</p></div></div><div style="background:rgba(255,255,255,0.025);border:1px solid var(--brd);border-radius:14px;padding:14px 16px;font-size:13px"><div class="flex justify-between py-2" style="border-bottom:1px solid var(--brd)"><span style="color:var(--tx2)">Member since</span><span>${U.relTime(user.created_at)}</span></div><div class="flex justify-between py-2"><span style="color:var(--tx2)">User ID</span><span class="font-mono text-xs" style="color:var(--tx3)">${user.id.slice(0,8)}</span></div></div><button class="bs w-full mt-4" onclick="Modal.close()">Close</button></div>`);

        function openDataManagement() {
            Modal.open(`<div class="p-6"><h3 class="font-display text-lg font-semibold mb-2"><i class="fa-solid fa-database mr-2" style="color:var(--acc)"></i>Data Management</h3><p class="text-sm mb-4" style="color:var(--tx2)">Manage your stored data and history.</p><div class="data-mgmt"><button class="bs flex-1" onclick="clearAll()"><i class="fa-solid fa-trash-can mr-1" style="color:var(--err)"></i>Clear All</button><button class="bs flex-1" onclick="Modal.close();Toast.show('Data refreshed','success')"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button></div></div>`);

        function openSettings() {
            Modal.open(`<div class="p-6"><h3 class="font-display text-lg font-semibold mb-2"><i class="fa-solid fa-gear mr-2" style="color:var(--acc)"></i>Settings</h3><p class="text-sm mb-4" style="color:var(--tx2)">App preferences and configuration.</p><div style="background:rgba(255,255,255,0.025);border:1px solid var(--brd);border-radius:14px;padding:14px 16px;font-size:13px"><div class="flex items-center justify-between py-2" style="border-bottom:1px solid var(--brd)"><span style="color:var(--tx2)">Theme</span><span style="color:var(--tx)">Dark</span></div><div class="flex items-center justify-between py-2" style="border-bottom:1px solid var(--brd)"><span style="color:var(--tx2)">Platform</span><span style="color:var(--tx3)">Android</span></div><div class="flex items-center justify-between py-2"><span style="color:var(--tx2)">Version</span><span style="color:var(--tx3)">ZETA v2.0</span></div></div><button class="bs w-full mt-4" onclick="Modal.close()">Close</button></div>`);
        }
        function clearAll() {

        function doClearAll() { DB.clearAll(); Modal.close(); Toast.show('All data cleared', 'info'); pgDashboard(); }

        function initReveal() {
            const obs = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('revealed'); obs.unobserve(e.target); } }); }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
            document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

        function pgDashboard() {

            const avatarUrl = U.esc(user.profile_image);
            document.getElementById('app').innerHTML =
                `<div class="sb-ov${Store.sidebarOpen?' active':''}" id="sb-ov" onclick="togSB()"></div>
                <nav class="top-nav">
                    <div class="nav-left">

                        <img src="${avatarUrl}" class="nav-avatar md:hidden" onclick="togSB()" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=3b82f6&color=fff&size=64'" />

        function rAPKPage() {
            return `
                <section class="hero-section">

                        </div>

                </section>
                <section class="features-section" id="features">
                    <div class="reveal">
                        <div class="section-label"><i class="fa-solid fa-sparkles"></i> The ZETA Advantage</div>
                        <h2 class="section-title">Why Choose ZETA</h2>
                        <p class="section-desc">We focus on what matters — quality, security, and simplicity.</p>
                    </div>
