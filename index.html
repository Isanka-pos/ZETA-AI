<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZETA TOOLS — Sri Lankan Utility Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://hashu-apis-production.up.railway.app" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { display: ['Space Grotesk', 'sans-serif'], body: ['DM Sans', 'sans-serif'] } } } }
    </script>
    <style>
        /* ===== BEAUTY ENHANCEMENTS + ALL NEW FEATURES ===== */

        :root {
            --bg: #07070e;
            --bg2: #0b0b14;
            --bg3: #11111e;
            --bg4: #1a1a2e;
            --brd: #1a1a2e;
            --brd2: #282844;
            --tx: #eaeaf0;
            --tx2: #9494b8;
            --tx3: #5a5a7a;
            --acc: #e8922a;
            --acc-l: #f0a848;
            --acc-g: rgba(232, 146, 42, 0.08);
            --acc-glow: rgba(232, 146, 42, 0.15);
            --ok: #4ade80;
            --err: #f87171;
            --wrn: #fbbf24;
            --card-radius: 16px;
            --glass-bg: rgba(17, 17, 30, 0.7);
            --shadow-glow: 0 8px 40px rgba(232, 146, 42, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--tx);
            overflow: hidden;
            height: 100dvh;
        }

        /* ===== 1. ANIMATED GRADIENT BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(232, 146, 42, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(232, 146, 42, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(232, 146, 42, 0.02) 0%, transparent 50%);
            animation: bgFloat 14s ease-in-out infinite alternate;
        }

        @keyframes bgFloat {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: scale(0.95) rotate(-1deg);
                opacity: 0.8;
            }
        }

        /* ===== 2. FLOATING ORBS (extra) ===== */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 10% 80%, rgba(232, 146, 42, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 70%, rgba(232, 146, 42, 0.03) 0%, transparent 35%),
                radial-gradient(circle at 30% 30%, rgba(232, 146, 42, 0.02) 0%, transparent 30%);
            animation: orbFloat 18s ease-in-out infinite alternate;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-20px, 30px) scale(1.05);
            }
            100% {
                transform: translate(20px, -20px) scale(0.95);
            }
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brd2);
            border-radius: 10px;
            transition: background .3s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--acc);
        }

        input,
        textarea,
        button,
        select {
            font-family: inherit;
        }

        .sr-file {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100dvh;
            background: linear-gradient(180deg, rgba(11, 11, 20, 0.98), rgba(7, 7, 14, 0.99));
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 40;
            position: relative;
            overflow: hidden;
            box-shadow: 4px 0 40px rgba(0, 0, 0, 0.3);
        }
        .sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(232, 146, 42, 0.15), transparent);
        }

        @media(max-width:768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%);
                width: 280px;
                min-width: 280px;
                border-radius: 0 20px 20px 0;
            }
            .sidebar.open {
                transform: translateX(0)
            }
        }

        .sb-brand {
            padding: 22px 22px 18px;
            position: relative;
        }
        .sb-brand::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232, 146, 42, 0.15), transparent);
        }

        .sb-brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sb-brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--acc), #d4781a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(232, 146, 42, 0.3);
            position: relative;
            transition: transform .3s;
        }
        .sb-brand-icon:hover {
            transform: scale(1.05) rotate(-2deg);
        }
        .sb-brand-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--acc), transparent, var(--acc-l));
            opacity: 0.3;
            z-index: -1;
            filter: blur(6px);
        }
        .sb-brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--tx), var(--tx));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .sb-brand-name span {
            background: linear-gradient(135deg, var(--acc), var(--acc-l));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sb-brand-sub {
            font-size: 10px;
            font-weight: 500;
            color: var(--tx3);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            -webkit-text-fill-color: var(--tx3);
        }
        .sb-version-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(232, 146, 42, 0.08);
            border: 1px solid rgba(232, 146, 42, 0.12);
            color: var(--acc-l);
            backdrop-filter: blur(4px);
            transition: all .3s;
        }
        .sb-version-badge:hover {
            border-color: rgba(232, 146, 42, 0.3);
            background: rgba(232, 146, 42, 0.14);
        }

        /* ===== SEARCH WITH CLEAR BUTTON ===== */
        .sb-search {
            padding: 14px 18px 10px;
        }
        .sb-search-wrap {
            position: relative;
        }
        .sb-search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tx3);
            font-size: 13px;
            pointer-events: none;
            transition: color .3s;
        }
        .sb-search-wrap input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--brd);
            border-radius: 12px;
            padding: 10px 40px 10px 40px;
            font-size: 13px;
            color: var(--tx);
            outline: none;
            transition: border-color .3s, box-shadow .3s, background .3s;
        }
        .sb-search-wrap input::placeholder {
            color: var(--tx3)
        }
        .sb-search-wrap input:focus {
            border-color: rgba(232, 146, 42, 0.3);
            background: rgba(232, 146, 42, 0.04);
            box-shadow: 0 0 0 4px var(--acc-g);
        }
        .sb-search-wrap input:focus+i {
            color: var(--acc);
        }
        .sb-search-wrap .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--tx3);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            font-size: 14px;
            display: none;
            transition: all .2s;
        }
        .sb-search-wrap .clear-btn:hover {
            color: var(--tx);
            background: rgba(255, 255, 255, 0.05);
        }
        .sb-search-wrap .clear-btn.visible {
            display: block;
        }

        .sb-section-label {
            padding: 16px 22px 8px;
            font-size: 10px;
            font-weight: 700;
            color: var(--tx3);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .sb-cat {
            margin: 2px 14px;
            padding: 0;
            border-radius: 12px;
            cursor: pointer;
            transition: background .2s, transform .2s;
            position: relative;
        }
        .sb-cat:hover {
            background: rgba(255, 255, 255, 0.035);
            transform: translateX(4px);
        }
        .sb-cat-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
        }
        .sb-cat-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            transition: transform .2s;
        }
        .sb-cat:hover .sb-cat-icon {
            transform: scale(1.05);
        }
        .sb-cat-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--tx);
            line-height: 1.2;
        }
        .sb-cat-count {
            font-size: 11px;
            color: var(--tx3);
            margin-top: 1px;
        }

        .sb-profile {
            margin: auto 14px 16px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(232, 146, 42, 0.04);
            border: 1px solid rgba(232, 146, 42, 0.06);
            cursor: pointer;
            transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            backdrop-filter: blur(4px);
        }
        .sb-profile::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(232, 146, 42, 0.1), transparent, rgba(232, 146, 42, 0.05));
            opacity: 0;
            transition: opacity .3s;
            z-index: 0;
        }
        .sb-profile:hover {
            border-color: rgba(232, 146, 42, 0.2);
            background: rgba(232, 146, 42, 0.08);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(232, 146, 42, 0.05);
        }
        .sb-profile:hover::before {
            opacity: 1;
        }
        .sb-profile-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .sb-profile-avatar {
            position: relative;
            flex-shrink: 0;
        }
        .sb-profile-avatar img {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(232, 146, 42, 0.15);
            transition: border-color .3s;
        }
        .sb-profile:hover .sb-profile-avatar img {
            border-color: rgba(232, 146, 42, 0.35);
        }
        .sb-profile-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--ok);
            border: 2.5px solid #0b0b14;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4);
            }
            50% {
                box-shadow: 0 0 0 4px rgba(74, 222, 128, 0);
            }
        }
        .sb-profile-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--tx);
            line-height: 1.2;
        }
        .sb-profile-status {
            font-size: 11px;
            color: var(--ok);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sb-profile-status::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--ok);
            animation: dotPulse 2s ease-in-out infinite;
        }
        .sb-profile-ellipsis {
            margin-left: auto;
            color: var(--tx3);
            font-size: 14px;
            transition: color .3s, transform .3s;
        }
        .sb-profile:hover .sb-profile-ellipsis {
            color: var(--tx2);
            transform: rotate(90deg);
        }

        /* ===== HEADER ===== */
        .zeta-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 24px;
            height: 64px;
            min-height: 64px;
            background: rgba(7, 7, 14, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
        }
        .zeta-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--acc), var(--acc-l), var(--acc), transparent);
            background-size: 200% 100%;
            animation: headerLine 5s ease-in-out infinite;
            z-index: 2;
            filter: blur(0.5px);
        }
        @keyframes headerLine {
            0%,
            100% {
                background-position: 200% 0
            }
            50% {
                background-position: -100% 0
            }
        }

        .header-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0a848, #e8922a, #f5c76e, #e8922a);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShine 6s ease-in-out infinite;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(0 0 20px rgba(232, 146, 42, 0.05));
        }
        @keyframes titleShine {
            0%,
            100% {
                background-position: 0% 50%
            }
            50% {
                background-position: 100% 50%
            }
        }
        .header-subtitle {
            font-size: 10px;
            font-weight: 500;
            color: var(--tx3);
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1;
            margin-top: 2px;
            opacity: 0.7;
        }
        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
            color: var(--tx2);
            cursor: pointer;
            transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 15px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }
        .header-btn:hover {
            border-color: rgba(232, 146, 42, 0.3);
            color: var(--acc-l);
            background: var(--acc-g);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 20px rgba(232, 146, 42, 0.08);
        }
        .header-btn:active {
            transform: scale(0.95);
        }
        .header-divider {
            width: 1px;
            height: 28px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.06), transparent);
            flex-shrink: 0;
        }

        /* ===== HERO ===== */
        .hero-wrap {
            position: relative;
            padding: 36px 28px 32px;
            text-align: center;
            z-index: 1;
        }
        .hero-wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 100%;
            background: radial-gradient(ellipse at center top, rgba(232, 146, 42, 0.04), transparent 70%);
            pointer-events: none;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            background: rgba(232, 146, 42, 0.07);
            border: 1px solid rgba(232, 146, 42, 0.12);
            color: var(--acc-l);
            margin-bottom: 18px;
            backdrop-filter: blur(4px);
            transition: all .3s;
        }
        .hero-badge:hover {
            background: rgba(232, 146, 42, 0.12);
            border-color: rgba(232, 146, 42, 0.25);
            transform: translateY(-1px);
        }
        .hero-bolt-wrap {
            margin-bottom: 14px;
        }
        .hero-bolt-wrap>div {
            color: var(--acc);
            font-size: 32px;
            position: relative;
            z-index: 1;
            display: inline-block;
            animation: boltFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(232, 146, 42, 0.15));
        }
        @keyframes boltFloat {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-6px) scale(1.05);
            }
        }

        /* ===== TYPEWRITER EFFECT ===== */
        .hero-title-main {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(28px, 5.5vw, 50px);
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 4px;
            display: inline-block;
        }
        .hero-title-zeta {
            background: linear-gradient(135deg, #f0a848, #e8922a, #f5c76e, #e8922a);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGrad 5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(232, 146, 42, 0.05));
            display: inline-block;
        }
        .hero-title-tools {
            color: var(--tx);
            font-weight: 300;
            -webkit-text-fill-color: var(--tx);
            display: inline-block;
        }
        /* typewriter: reveal letters one by one */
        .typewriter {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            animation: typing 2s steps(10, end) forwards;
            width: 0;
        }
        @keyframes typing {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }
        /* For the whole title we can use a simpler animation */
        .hero-title-main {
            animation: fadeInUp 0.8s ease both;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-tagline {
            font-size: 12px;
            font-weight: 500;
            color: var(--tx3);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.7;
        }
        .hero-greeting {
            font-size: 15px;
            color: var(--tx2);
            margin-bottom: 22px;
        }
        .hero-greeting strong {
            color: var(--acc-l);
            font-weight: 600;
        }
        .hero-stats {
            display: inline-flex;
            gap: 3px;
            background: rgba(17, 17, 30, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 4px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        .hero-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 22px;
            border-radius: 12px;
            min-width: 72px;
            transition: background .3s;
        }
        .hero-stat:hover {
            background: rgba(232, 146, 42, 0.04);
        }
        .hero-stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--acc-l);
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .hero-stat-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--tx3);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .hero-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--acc), transparent);
            margin: 28px auto 0;
            border-radius: 2px;
            opacity: 0.5;
        }

        /* ===== TOOL CARDS ===== */
        .wc {
            background: linear-gradient(145deg, rgba(17, 17, 30, 0.7), rgba(11, 11, 20, 0.85));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--card-radius);
            padding: 22px 20px;
            cursor: pointer;
            transition: all .35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            will-change: transform;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .wc::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            background: linear-gradient(135deg, rgba(232, 146, 42, 0.02), transparent 60%);
            opacity: 0;
            transition: opacity .4s;
            pointer-events: none;
        }
        .wc:hover::before {
            opacity: 1;
        }
        .wc::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232, 146, 42, 0.15), transparent);
            opacity: 0;
            transition: opacity .4s;
        }
        .wc:hover::after {
            opacity: 1;
        }
        /* glow border on hover */
        .wc:hover {
            border-color: rgba(232, 146, 42, 0.2);
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3), 0 0 40px rgba(232, 146, 42, 0.04), 0 0 80px rgba(232, 146, 42, 0.02);
        }
        .wc-icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all .35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .wc:hover .wc-icon-wrap {
            transform: scale(1.08) rotate(-2deg);
        }
        .wc-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--tx);
            line-height: 1.2;
            transition: color .3s;
        }
        .wc:hover .wc-title {
            color: var(--acc-l);
        }
        .wc-desc {
            font-size: 12px;
            color: var(--tx3);
            line-height: 1.6;
            transition: color .3s;
        }
        .wc:hover .wc-desc {
            color: var(--tx2);
        }
        .wc-arrow {
            position: absolute;
            top: 18px;
            right: 16px;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(232, 146, 42, 0.06);
            color: var(--acc);
            font-size: 12px;
            opacity: 0;
            transform: translateX(-8px) scale(0.8);
            transition: all .35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .wc:hover .wc-arrow {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        /* Tool badge (NEW / POPULAR) */
        .tool-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--acc);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(232, 146, 42, 0.3);
            z-index: 2;
        }

        /* ===== CATEGORY SECTION ===== */
        .cat-section {
            margin-bottom: 32px;
            content-visibility: auto;
            contain-intrinsic-size: 1px 380px;
        }
        .cat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            padding-left: 2px;
        }
        .cat-accent {
            width: 4px;
            height: 16px;
            border-radius: 4px;
            background: var(--acc);
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(232, 146, 42, 0.15);
        }
        .cat-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--tx3);
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0.7;
        }
        .cat-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04), transparent);
        }
        .cat-count-badge {
            font-size: 10px;
            font-weight: 600;
            color: var(--tx3);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 2px 10px;
            border-radius: 8px;
            flex-shrink: 0;
            opacity: 0.6;
        }

        /* ===== FORM ELEMENTS ===== */
        .ifield {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--tx);
            border-radius: 12px;
            padding: 11px 16px;
            width: 100%;
            font-size: 14px;
            transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
            backdrop-filter: blur(4px);
        }
        .ifield:focus {
            border-color: var(--acc);
            box-shadow: 0 0 0 4px var(--acc-g), 0 4px 20px rgba(232, 146, 42, 0.04);
            background: rgba(232, 146, 42, 0.04);
        }
        .ifield::placeholder {
            color: var(--tx3);
        }
        .ifield:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .bp {
            background: linear-gradient(135deg, var(--acc), #d4781a);
            color: #fff;
            font-weight: 600;
            padding: 11px 22px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 16px rgba(232, 146, 42, 0.15);
            position: relative;
            overflow: hidden;
        }
        .bp::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity .3s;
        }
        .bp:hover::after {
            opacity: 1;
        }
        .bp:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 32px rgba(232, 146, 42, 0.25);
        }
        .bp:active {
            transform: scale(0.96);
        }
        .bp:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        /* spin icon for loading */
        .spin-icon {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .bs {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--tx);
            font-weight: 500;
            padding: 11px 22px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        .bs:hover {
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-1px);
        }

        /* ===== MODAL ===== */
        .mo {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fi .25s ease;
        }
        .moc {
            background: rgba(11, 11, 20, 0.92);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            max-width: 560px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            animation: modin .4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(232, 146, 42, 0.02);
        }
        .moc::-webkit-scrollbar {
            width: 4px;
        }
        .moc::-webkit-scrollbar-thumb {
            background: var(--brd2);
            border-radius: 10px;
        }
        @keyframes fi {
            from {
                opacity: 0
            }
            to {
                opacity: 1
            }
        }
        @keyframes modin {
            from {
                opacity: 0;
                transform: scale(.92) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ===== TOASTS WITH PROGRESS BAR ===== */
        .tc {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 420px;
            width: calc(100% - 40px);
        }
        .toast {
            padding: 12px 18px 12px 22px;
            border-radius: 14px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: tin .4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(20px);
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, .04);
            box-shadow: 0 8px 40px rgba(0, 0, 0, .5);
            position: relative;
            overflow: hidden;
        }
        .toast .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }
        .toast .progress-bar .progress-fill {
            height: 100%;
            width: 100%;
            background: currentColor;
            border-radius: 2px;
            animation: shrinkProgress 3.5s linear forwards;
        }
        @keyframes shrinkProgress {
            from {
                width: 100%;
            }
            to {
                width: 0%;
            }
        }
        .toast.success {
            background: rgba(6, 95, 70, .85);
            color: #a7f3d0;
        }
        .toast.success i {
            color: #4ade80;
        }
        .toast.error {
            background: rgba(127, 29, 29, .85);
            color: #fca5a5;
        }
        .toast.error i {
            color: #f87171;
        }
        .toast.info {
            background: rgba(30, 58, 95, .85);
            color: #93c5fd;
        }
        .toast.info i {
            color: #60a5fa;
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            opacity: .3;
            font-size: 16px;
            padding: 4px 4px 4px 10px;
            transition: all .2s;
            line-height: 1;
            border-radius: 50%;
            margin-left: auto;
        }
        .toast .toast-close:hover {
            opacity: 1;
            background: rgba(0, 0, 0, .15);
        }
        @keyframes tin {
            from {
                opacity: 0;
                transform: translateX(50px) scale(.92)
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1)
            }
        }
        @keyframes tout {
            from {
                opacity: 1;
                transform: translateX(0) scale(1)
            }
            to {
                opacity: 0;
                transform: translateX(50px) scale(.92)
            }
        }

        /* ===== DROPDOWN ===== */
        .dd {
            position: absolute;
            background: rgba(11, 11, 20, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 8px;
            min-width: 190px;
            box-shadow: 0 16px 60px rgba(0, 0, 0, .5);
            animation: ddin .15s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 50;
        }
        @keyframes ddin {
            from {
                opacity: 0;
                transform: translateY(-6px) scale(.96)
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }
        .ddi {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--tx2);
            transition: all .2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .ddi:hover {
            background: rgba(232, 146, 42, 0.06);
            color: var(--tx);
        }
        .ddi.dng {
            color: var(--err);
        }
        .ddi.dng:hover {
            background: rgba(248, 113, 113, .08);
        }
        .ddv {
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 6px 0;
        }

        /* ===== RESULTS ===== */
        .nc-res {
            background: rgba(232, 146, 42, 0.04);
            border: 1px solid rgba(232, 146, 42, 0.08);
            border-radius: 14px;
            padding: 16px;
            animation: mi .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            gap: 6px;
            backdrop-filter: blur(4px);
        }
        @keyframes mi {
            from {
                opacity: 0;
                transform: translateY(10px) scale(.96)
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }
        .nc-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .nc-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .nc-row .l {
            font-size: 12px;
            color: var(--tx3);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .nc-row .v {
            font-size: 13px;
            font-weight: 600;
            color: var(--tx);
            text-align: right;
            word-break: break-word;
        }
        .nc-ib {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            color: var(--tx2);
            transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 13px;
        }
        .nc-ib:hover {
            background: var(--acc);
            color: #fff;
            transform: scale(1.08);
            box-shadow: 0 4px 16px rgba(232, 146, 42, 0.2);
        }
        .nc-hi {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all .25s;
            border: 1px solid transparent;
        }
        .nc-hi:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.04);
        }
        .nc-hi .o {
            font-size: 11px;
            color: var(--tx3);
            opacity: 0.7;
        }
        .nc-hi .s {
            font-size: 13px;
            color: var(--acc-l);
            font-weight: 600;
        }

        .lp {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--tx);
            margin-right: 4px;
            min-width: 32px;
            text-align: center;
        }
        .lp.gold {
            background: rgba(232, 146, 42, 0.08);
            border-color: rgba(232, 146, 42, 0.15);
            color: var(--acc-l);
        }

        .lot-game-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.03);
            color: var(--tx3);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .lot-game-badge.dlb {
            background: rgba(232, 146, 42, 0.08);
            color: var(--acc-l);
            border-color: rgba(232, 146, 42, 0.15);
        }

        .pw-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px 18px;
            font-family: 'Space Grotesk', monospace;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: .5px;
            color: var(--acc-l);
            display: flex;
            align-items: center;
            justify-content: space-between;
            word-break: break-all;
            gap: 12px;
            transition: border-color .3s;
        }
        .pw-box:hover {
            border-color: rgba(232, 146, 42, 0.15);
        }
        .pw-box .copy-btn {
            background: none;
            border: none;
            color: var(--tx3);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 16px;
            flex-shrink: 0;
        }
        .pw-box .copy-btn:hover {
            background: rgba(232, 146, 42, 0.08);
            color: var(--acc-l);
            transform: scale(1.08);
        }

        .pw-length-selector {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 4px 0;
        }
        .pw-length-selector input[type="range"] {
            flex: 1;
            accent-color: var(--acc);
            height: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            outline: none;
            -webkit-appearance: none;
            transition: background .3s;
        }
        .pw-length-selector input[type="range"]:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .pw-length-selector input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--acc), var(--acc-l));
            cursor: pointer;
            border: 2px solid var(--bg2);
            box-shadow: 0 2px 12px rgba(232, 146, 42, 0.2);
            transition: transform .2s;
        }
        .pw-length-selector input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        .pw-length-selector input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--acc), var(--acc-l));
            cursor: pointer;
            border: 2px solid var(--bg2);
        }
        .pw-length-selector .length-label {
            font-weight: 700;
            min-width: 36px;
            text-align: center;
            color: var(--acc-l);
            font-size: 16px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .av-upload-wrap {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }
        .av-upload-btn {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--acc), var(--acc-l));
            color: #fff;
            font-size: 13px;
            border: 2.5px solid var(--bg2);
            transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
            box-shadow: 0 2px 16px rgba(232, 146, 42, 0.25);
        }
        .av-upload-wrap:hover .av-upload-btn {
            transform: scale(1.1) rotate(4deg);
            box-shadow: 0 4px 24px rgba(232, 146, 42, 0.35);
        }

        .sb-ov {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 35;
            backdrop-filter: blur(8px);
            animation: fi .2s ease;
        }
        .sb-ov.active {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:640px) {
            .hero-wrap {
                padding: 20px 12px 20px
            }
            .hero-badge {
                padding: 4px 12px;
                font-size: 9px;
                margin-bottom: 14px
            }
            .hero-bolt-wrap>div {
                font-size: 24px
            }
            .hero-title-main {
                font-size: 24px;
                letter-spacing: -1px
            }
            .hero-tagline {
                font-size: 10px;
                letter-spacing: 2.5px;
                margin-bottom: 8px
            }
            .hero-greeting {
                font-size: 13px;
                margin-bottom: 18px
            }
            .hero-stats {
                flex-wrap: wrap;
                border-radius: 14px;
                padding: 3px;
                gap: 2px;
            }
            .hero-stat {
                flex: 1 1 calc(50% - 2px);
                min-width: 0;
                padding: 8px 10px;
                border-radius: 10px
            }
            .hero-stat-val {
                font-size: 15px
            }
            .hero-stat-label {
                font-size: 8px
            }
            .hero-divider {
                margin-top: 20px;
                width: 40px
            }
            .header-title {
                font-size: 18px !important
            }
            .header-subtitle {
                font-size: 8px;
                letter-spacing: 2px
            }
            .zeta-header {
                height: 52px;
                min-height: 52px;
                padding: 0 12px;
                gap: 8px
            }
            .header-btn {
                width: 34px;
                height: 34px;
                border-radius: 10px;
                font-size: 13px
            }
            .header-divider {
                display: none
            }
            .wc {
                padding: 16px;
                border-radius: 14px
            }
            .wc-arrow {
                top: 14px;
                right: 12px;
                width: 26px;
                height: 26px;
                font-size: 10px
            }
            .wc-icon-wrap {
                width: 36px;
                height: 36px;
                border-radius: 10px
            }
            .wc-icon-wrap i {
                font-size: 13px
            }
            .wc-title {
                font-size: 13px
            }
            .wc-desc {
                font-size: 11px
            }
            .cat-section {
                margin-bottom: 22px
            }
            .cat-header {
                gap: 8px;
                margin-bottom: 10px
            }
            .cat-accent {
                height: 14px;
                width: 3px;
            }
            .cat-label {
                font-size: 9px;
                letter-spacing: 2px
            }
            .cat-line {
                display: none
            }
            .cat-count-badge {
                display: none
            }
            .tc {
                top: 12px;
                right: 12px;
                left: 12px;
                max-width: 100%;
                width: auto;
            }
            .toast {
                padding: 10px 14px 10px 18px;

        function apiFetch(url, onDone, onError) {
            var ctrl = new AbortController();
            var timeout = setTimeout(function() { ctrl.abort(); }, 15000);
            fetch(url, { signal: ctrl.signal })
                .then(function(res) {
                    clearTimeout(timeout);
                    return res.text().then(function(raw) {
                        var data;
                        try { data = JSON.parse(raw); } catch (e) { throw new Error(res.ok ? 'BAD_JSON' :
                            'API_ERR_' + res.status); }
                        if (!res.ok) throw new Error('API_ERR_' + res.status);
                        return data;
                    });
                })
                .then(function(data) {
                    if (data.success === false || data.status === false) throw new Error('API_MSG:' + (data.message ||
                        data.error || 'Request failed'));
                    var r = data.results || data.result || data.data || data;
                    if (!r) throw new Error('EMPTY');
                    onDone(r);
                })
                .catch(function(e) {
                    clearTimeout(timeout);
                    if (e.name === 'AbortError') onError('Request timed out.');
                    else if (e.message === 'EMPTY') onError('Empty response from service.');
                    else if (e.message === 'BAD_JSON') onError('Unexpected response format.');
                    else if (e.message.indexOf('API_MSG:') === 0) onError(e.message.slice(8));
                    else if (e.message.indexOf('API_ERR_402') === 0) onError('Service quota exhausted.');
                    else if (e.message.indexOf('API_ERR_401') === 0 || e.message.indexOf('API_ERR_403') === 0) onError(
                        'API key rejected.');
                    else if (e.message.indexOf('API_ERR_429') === 0) onError('Rate limited. Try again.');
                    else if (e.message.indexOf('API_ERR') === 0) onError('Service unavailable.');
                    else if (e.message.indexOf('fetch') >= 0 || e.message.indexOf('Network') >= 0 || e.message.indexOf(
                            'Failed') >= 0) onError('Network error.');
                    else onError('Something went wrong.');
                });
        }

        // ===== FILTER =====
        var _filterTimeout = 0;

        function filterTools(q) {
            clearTimeout(_filterTimeout);
            _filterTimeout = setTimeout(function() {
                var qs = q.toLowerCase();
                var wcs = document.querySelectorAll('#toolsList .wc');
                var secs = document.querySelectorAll('#toolsList [data-cat]');
                var visible = {};
                for (var i = 0; i < wcs.length; i++) {
                    var w = wcs[i];
                    var show = (w.dataset.t || '').indexOf(qs) >= 0;
                    w.style.display = show ? '' : 'none';
                    var sec = w.closest('[data-cat]');
                    if (sec) visible[sec.id] = visible[sec.id] || show;
                }
                for (var j = 0; j < secs.length; j++) {
                    secs[j].style.display = visible[secs[j].id] ? '' : 'none';
                }
                toggleClearBtn();
            }, 80);
        }

        function avPicked(inp) {

                inp.value = ''; return; }

            reader.onload = function(e) { var prev = document.getElementById('pprev'); if (prev) prev.src = e.target
                    .result;
                _pendingAvatar = e.target.result; };
            reader.onerror = function() { Toast.show('Failed to read image', 'error');
                inp.value = ''; };
            reader.readAsDataURL(f);

        function doNicCheck() {

        function doFxCheck() {

                amtIn = document.getElementById('fxamt'),
                btn = document.getElementById('fxbtn'),
                res = document.getElementById('fxres');

            apiFetch(url,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rFXResult(r, amt);

                    var entry = { id: U.id(), code: r.from, rate: r.rate, amount: amt, converted: amt * r.rate,

                    Toast.show(err, 'error'); }

        function rFXResult(r, amt) {
            var converted = (amt * r.rate).toLocaleString('en-LK', { maximumFractionDigits: 2 });

            return '<div class="nc-res"><div class="text-center mb-1" style="padding:6px 0"><div class="text-2xl font-display font-bold" style="color:var(--acc)">Rs. ' +

                U.esc(r.source || '-') + '</span></div></div>';

                l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';

                btn = document.getElementById('lotbtn'),
                res = document.getElementById('lotres');
            var game = inp.value.trim();
            if (!game) { Toast.show('Enter a lottery game name', 'error'); return; }
            btn.disabled = true;
            var orig = btn.innerHTML;
            btn.innerHTML = spin(14);
            var url = buildUrl(CFG.LOTTERY_API_URL, { apiKey: CFG.LOTTERY_API_KEY, text: game });
            apiFetch(url,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rLotteryResult(r);
                    var user = Auth.getUser();
                    var entry = { id: U.id(), game: r.game, board: r.board || 'DLB', draw_number: r
                            .draw_number || '-', date: r.date || '-', numbers: r.numbers || [],
                        source_url: r.source_url || '', disclaimer: r.disclaimer || '',
                    created_at: U.now() };
                    DB.addLotteryCheck(user.id, entry);
                    var list = document.getElementById('lotlist');
                    if (list) list.innerHTML = DB.getLotteryChecks(user.id).map(rLotteryItem).join('');
                    Toast.show('Lottery results loaded', 'success');
                },
                function(err) { btn.disabled = false;
                    btn.innerHTML = orig;
                    Toast.show(err, 'error'); }
            );
        }

        function rLotteryResult(r) {
            var nums = (r.numbers || []).map(function(n) { return '<span class="lp gold">' + U.esc(String(n)) +
                    '</span>'; }).join('');
            var boardClass = (r.board || '').toLowerCase() === 'dlb' ? 'dlb' : '';
            return '<div class="nc-res"><div class="text-center mb-1" style="padding:2px 0"><span class="lot-game-badge ' +
                boardClass + '">' + U.esc(r.board || 'DLB') +
                '</span></div><div class="nc-row"><span class="l">Game</span><span class="v" style="text-transform:capitalize">' +
                U.esc(r.game || '-') +
                '</span></div><div class="nc-row"><span class="l">Draw Number</span><span class="v">' + U.esc(r
                    .draw_number || '-') +
                '</span></div><div class="nc-row"><span class="l">Date</span><span class="v">' + U.esc(r.date || '-') +
                '</span></div><div class="nc-row" style="flex-wrap:wrap"><span class="l">Winning Numbers</span><span class="v" style="flex-wrap:wrap;display:flex;gap:4px;justify-content:flex-end">' +
                nums + '</span></div>' + (r.source_url ?
                    '<div class="nc-row"><span class="l">Source</span><span class="v"><a href="' + U.esc(r
                        .source_url) +
                    '" target="_blank" rel="noopener noreferrer" style="color:var(--acc-l);text-decoration:underline;font-size:13px">results.govdoc.lk</a></span></div>'
                    : '') + (r.disclaimer ?
                    '<div class="mt-2 text-xs" style="color:var(--tx3);line-height:1.4">' + U.esc(r.disclaimer) +
                    '</div>' : '') + '</div>';
        }

        function rLotteryItem(l) {
            var nums = (l.numbers || []).slice(0, 3).map(function(n) { return U.esc(String(n)); }).join(' ');
            var suffix = (l.numbers || []).length > 3 ? ' …' : '';
            var boardLabel = (l.board || 'DLB').toUpperCase();
            return '<div class="nc-hi"><i class="fa-solid fa-ticket" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">' +
                U.esc(l.game) + ' #' + U.esc(l.draw_number || '-') + ' — ' + nums + suffix +
                '</div><div class="o">' + boardLabel + ' &bull; ' + U.esc(l.date || '') + ' &bull; ' + U.esc(U
                    .relTime(l.created_at)) +
                '</div></div><button class="nc-ib" title="Copy" onclick="cpText(\'' + (l.numbers || []).join(' ')
                .replace(/'/g, "\\'") +
                '\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delLot(\'' +
                l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
        }

        function delLot(id) { var user = Auth.getUser(); if (!user) return;
            DB.deleteLotteryCheck(user.id, id); var list = document.getElementById('lotlist'); if (list) list
                .innerHTML = DB.getLotteryChecks(user.id).map(rLotteryItem).join(''); }

        // ===== PASSWORD GENERATOR =====
        function openPasswordGenerator() {
            Store.profileDropdown = false;
            var m = document.getElementById('pmenu');
            if (m) m.classList.add('hidden');
            var user = Auth.getUser();
            if (!user) return;
            var entries = DB.getPasswordEntries(user.id);
            Modal.open(
                '<div class="p-6"><div class="flex items-center justify-between mb-5"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-key mr-2" style="color:var(--acc)"></i>Password Generator</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Generate a secure, random password with a custom length.</p><div class="mb-4"><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">PASSWORD LENGTH</label><div class="pw-length-selector"><input type="range" id="pwrange" class="ri" min="6" max="32" value="16" oninput="document.getElementById(\'pwlen\').textContent=this.value"><span class="length-label" id="pwlen">16</span></div></div><button class="bp w-full" id="pwbtn" onclick="doGeneratePassword()"><i class="fa-solid fa-rotate"></i> Generate Password</button><div id="pwres" class="mt-4"></div>' +
                (entries.length ?
                    '<div class="mt-5"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="pwlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">' +
                    entries.map(rPasswordItem).join('') + '</div></div>' : '<div id="pwlist"></div>') + '</div>'
            );
            setTimeout(function() { doGeneratePassword(); }, 80);
        }

        function doGeneratePassword() {
            var range = document.getElementById('pwrange'),
                btn = document.getElementById('pwbtn'),
                res = document.getElementById('pwres');
            var length = parseInt(range.value, 10);
            if (isNaN(length) || length < 6 || length > 32) { Toast.show('Select a length between 6 and 32',
                    'error'); return; }
            btn.disabled = true;
            var orig = btn.innerHTML;
            btn.innerHTML = spin(14);
            var url = buildUrl(CFG.PASSWORD_API_URL, { apiKey: CFG.PASSWORD_API_KEY, length: String(length) });
            apiFetch(url,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rPasswordResult(r);
                    var user = Auth.getUser();
                    var entry = { id: U.id(), password: r.password, length: r.length, created_at: U.now() };
                    DB.addPasswordEntry(user.id, entry);
                    var list = document.getElementById('pwlist');
                    if (list) list.innerHTML = DB.getPasswordEntries(user.id).map(rPasswordItem).join('');
                    Toast.show('Password generated', 'success');
                },
                function(err) { btn.disabled = false;
                    btn.innerHTML = orig;
                    Toast.show(err, 'error'); }
            );
        }

        function rPasswordResult(r) {
            var pw = U.esc(r.password);
            return '<div class="nc-res"><div class="pw-box"><span class="font-mono tracking-wide">' + pw +
                '</span><button class="copy-btn" onclick="cpText(\'' + pw.replace(/'/g, "\\'") +
                '\')" title="Copy"><i class="fa-regular fa-copy"></i></button></div><div class="nc-row"><span class="l">Length</span><span class="v">' +
                U.esc(String(r.length)) + '</span></div></div>';
        }

        function rPasswordItem(l) {
            var pw = U.esc(l.password);
            return '<div class="nc-hi"><i class="fa-solid fa-key" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s font-mono text-sm tracking-wide">' +
                pw + '</div><div class="o">Length ' + U.esc(String(l.length)) + ' &bull; ' + U.esc(U.relTime(l
                    .created_at)) +
                '</div></div><button class="nc-ib" title="Copy" onclick="cpText(\'' + pw.replace(/'/g, "\\'") +
                '\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delPw(\'' +
                l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
        }

        function delPw(id) { var user = Auth.getUser(); if (!user) return;
            DB.deletePasswordEntry(user.id, id); var list = document.getElementById('pwlist'); if (list) list
                .innerHTML = DB.getPasswordEntries(user.id).map(rPasswordItem).join(''); }

        // ===== NPM CHECKER =====
        function openNpmChecker() {
            Store.profileDropdown = false;
            var m = document.getElementById('pmenu');
            if (m) m.classList.add('hidden');
            var user = Auth.getUser();
            if (!user) return;
            var checks = DB.getNpmChecks(user.id);
            Modal.open(
                '<div class="p-6"><div class="flex items-center justify-between mb-5"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-box mr-2" style="color:var(--acc)"></i>NPM Checker</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Enter an NPM package name (e.g. <strong>express</strong>) to get its weekly download count.</p><div class="flex flex-col sm:flex-row gap-2"><input type="text" id="npmpkg" class="ifield" placeholder="Package name…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doNpmCheck();}"><button class="bp sm:w-auto" id="npmbtn" style="padding:10px 18px" onclick="doNpmCheck()"><i class="fa-solid fa-magnifying-glass"></i></button></div><div id="npmres" class="mt-4"></div>' +
                (checks.length ?
                    '<div class="mt-5"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="npmlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">' +
                    checks.map(rNpmItem).join('') + '</div></div>' : '<div id="npmlist"></div>') + '</div>'
            );
            setTimeout(function() { var i = document.getElementById('npmpkg'); if (i) i.focus(); }, 50);
        }

        function doNpmCheck() {
            var inp = document.getElementById('npmpkg'),
                btn = document.getElementById('npmbtn'),
                res = document.getElementById('npmres');
            var pkg = inp.value.trim();
            if (!pkg) { Toast.show('Enter an NPM package name', 'error'); return; }
            btn.disabled = true;
            var orig = btn.innerHTML;
            btn.innerHTML = spin(14);
            var url = buildUrl(CFG.NPM_API_URL, { apiKey: CFG.NPM_API_KEY, text: pkg });
            apiFetch(url,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rNpmResult(r);
                    var user = Auth.getUser();
                    var entry = { id: U.id(), package: r.package || pkg, downloads: r.downloads, start: r
                            .start || '-', end: r.end || '-', created_at: U.now() };
                    DB.addNpmCheck(user.id, entry);
                    var list = document.getElementById('npmlist');
                    if (list) list.innerHTML = DB.getNpmChecks(user.id).map(rNpmItem).join('');
                    Toast.show('Download stats loaded', 'success');
                },
                function(err) { btn.disabled = false;
                    btn.innerHTML = orig;
                    Toast.show(err, 'error'); }
            );
        }

        function rNpmResult(r) {
            var dl = (r.downloads || 0).toLocaleString('en-US');
            return '<div class="nc-res"><div class="text-center mb-1" style="padding:6px 0"><div class="text-2xl font-display font-bold" style="color:var(--acc)">' +
                dl + '</div><div class="text-xs mt-1" style="color:var(--tx3)">downloads for ' + U.esc(r
                    .package || '-') +
                '</div></div><div class="nc-row"><span class="l">Package</span><span class="v">' + U.esc(r
                    .package || '-') +
                '</span></div><div class="nc-row"><span class="l">Period</span><span class="v">' + U.esc(r.start ||
                    '-') + ' &rarr; ' + U.esc(r.end || '-') + '</span></div></div>';
        }

        function rNpmItem(l) {
            var dl = (l.downloads || 0).toLocaleString('en-US');
            return '<div class="nc-hi"><i class="fa-solid fa-box" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">' +
                U.esc(l.package) + ' — ' + dl +
                ' dl</div><div class="o">' + U.esc(l.start || '') + ' &rarr; ' + U.esc(l.end || '') + ' &bull; ' +
                U.esc(U.relTime(l.created_at)) +
                '</div></div><button class="nc-ib" title="Copy" onclick="cpText(\'' + String(l.downloads || 0)
                .replace(/'/g, "\\'") +
                '\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delNpm(\'' +
                l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
        }

        function delNpm(id) { var user = Auth.getUser(); if (!user) return;
            DB.deleteNpmCheck(user.id, id); var list = document.getElementById('npmlist'); if (list) list.innerHTML =
                DB.getNpmChecks(user.id).map(rNpmItem).join(''); }

        // ===== MIME TYPE DETECTOR =====
        function openMimeChecker() {
            Store.profileDropdown = false;
            var m = document.getElementById('pmenu');
            if (m) m.classList.add('hidden');
            var user = Auth.getUser();
            if (!user) return;
            var checks = DB.getMimeChecks(user.id);
            Modal.open(
                '<div class="p-6"><div class="flex items-center justify-between mb-5"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-file-code mr-2" style="color:var(--acc)"></i>MIME Type Detector</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Enter a file name or extension to detect its MIME type and extension.</p><div class="flex flex-col sm:flex-row gap-2"><input type="text" id="mimein" class="ifield" placeholder="e.g. image.png or pdf" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doMimeCheck();}"><button class="bp sm:w-auto" id="mimebtn" style="padding:10px 18px" onclick="doMimeCheck()"><i class="fa-solid fa-magnifying-glass"></i></button></div><div id="mimeres" class="mt-4"></div>' +
                (checks.length ?
                    '<div class="mt-5"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="mimelist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">' +
                    checks.map(rMimeItem).join('') + '</div></div>' : '<div id="mimelist"></div>') + '</div>'
            );
            setTimeout(function() { var i = document.getElementById('mimein'); if (i) i.focus(); }, 50);
        }

        function doMimeCheck() {
            var inp = document.getElementById('mimein'),
                btn = document.getElementById('mimebtn'),
                res = document.getElementById('mimeres');
            var query = inp.value.trim();
            if (!query) { Toast.show('Enter a file name or extension', 'error'); return; }
            btn.disabled = true;
            var orig = btn.innerHTML;
            btn.innerHTML = spin(14);
            var url = buildUrl(CFG.MIME_API_URL, { apiKey: CFG.MIME_API_KEY, text: query });
            apiFetch(url,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rMimeResult(r);
                    var user = Auth.getUser();
                    var entry = { id: U.id(), query: query, extension: r.extension || '-', mime_type: r
                            .mime_type || '-', created_at: U.now() };
                    DB.addMimeCheck(user.id, entry);
                    var list = document.getElementById('mimelist');
                    if (list) list.innerHTML = DB.getMimeChecks(user.id).map(rMimeItem).join('');
                    inp.value = '';
                    Toast.show('MIME type detected', 'success');
                },
                function(err) { btn.disabled = false;
                    btn.innerHTML = orig;
                    Toast.show(err, 'error'); }
            );
        }

        function rMimeResult(r) {
            return '<div class="nc-res"><div class="nc-row"><span class="l">Extension</span><span class="v">' + U
                .esc(r.extension || '-') + '</span></div><div class="nc-row"><span class="l">MIME Type</span><span class="v">' +
                U.esc(r.mime_type || '-') + '</span></div></div>';
        }

        function rMimeItem(l) {
            return '<div class="nc-hi"><i class="fa-solid fa-file-code" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">' +
                U.esc(l.query) + '</div><div class="o">' + U.esc(l.extension || '') + ' &bull; ' + U.esc(l
                    .mime_type || '') + ' &bull; ' + U.esc(U.relTime(l.created_at)) +
                '</div></div><button class="nc-ib" title="Copy" onclick="cpText(\'' + U.esc(l.mime_type || '')
                .replace(/'/g, "\\'") +
                '\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delMime(\'' +
                l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
        }

        function delMime(id) { var user = Auth.getUser(); if (!user) return;
            DB.deleteMimeCheck(user.id, id); var list = document.getElementById('mimelist'); if (list) list.innerHTML =
                DB.getMimeChecks(user.id).map(rMimeItem).join(''); }

        // ===== SETTINGS =====
        function openSettings() {
            Store.profileDropdown = false;
            var m = document.getElementById('pmenu');
            if (m) m.classList.add('hidden');
            var user = Auth.getUser();
            if (!user) return;
            Modal.open(
                '<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><div class="flex items-center gap-3 p-4 rounded-lg mb-4" style="background:var(--bg3)"><i class="fa-solid fa-moon" style="color:var(--acc)"></i><div><div class="text-sm font-medium">Dark Mode</div><div class="text-xs" style="color:var(--tx3)">Always on for this app</div></div></div><button class="bs w-full" onclick="clearAll()"><i class="fa-solid fa-trash-can"></i> Clear all data</button></div>'
                );
        }

        // ===== ROUTER INIT =====
        Router.reg('/dashboard', pgDashboard);
        Router.reg('/settings', function() { pgDashboard();
            setTimeout(openSettings, 120); });

        (function() {
            document.documentElement.classList.add('dark');
            if (!Router.cur() || Router.cur() === '/login' || Router.cur() === '/register') Router.go('/dashboard');
            Router.init();
        })();

        (function() {
            function sync() { document.body.classList.toggle('tab-hidden', document.hidden); }
            document.addEventListener('visibilitychange', sync);
            sync();
        })();
    </script>
</body>
</html>
