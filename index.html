<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZETA TOOLS — Sri Lankan Utility Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { display: ['Space Grotesk','sans-serif'], body: ['DM Sans','sans-serif'] } } }
        }
    </script>
    <style>
        :root {
            --bg:#09090f;--bg2:#0d0d14;--bg3:#16161f;--bg4:#22222e;
            --brd:#1f1f2e;--brd2:#2d2d40;--tx:#eaeaf0;--tx2:#9898b0;--tx3:#5e5e7a;
            --acc:#e8922a;--acc-l:#f0a848;--acc-g:rgba(232,146,42,0.1);
            --ok:#4ade80;--err:#f87171;--wrn:#fbbf24
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;height:100dvh}
        h1,h2,h3,h4,h5,h6{font-family:'Space Grotesk',sans-serif}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
        input,textarea,button,select{font-family:inherit}

        /* Visually hidden but accessible — keeps file inputs functional on all browsers */
        .sr-file {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .sidebar {
            width: 280px; min-width: 280px; height: 100dvh;
            background: linear-gradient(180deg, #0c0c15 0%, #0a0a12 100%);
            border-right: 1px solid var(--brd);
            display: flex; flex-direction: column;
            transition: transform .3s cubic-bezier(.4,0,.2,1);
            z-index: 40; position: relative; overflow: hidden;
        }
        .sidebar::after {
            content: ''; position: absolute; top: 0; right: -1px;
            width: 1px; height: 100%;
            background: linear-gradient(180deg, transparent 0%, rgba(232,146,42,0.15) 30%, rgba(232,146,42,0.25) 50%, rgba(232,146,42,0.15) 70%, transparent 100%);
            pointer-events: none;
        }
        @media(max-width:768px) {
            .sidebar { position:fixed; left:0; top:0; transform:translateX(-100%); width:280px; min-width:280px; }
            .sidebar.open { transform:translateX(0) }
        }

        .sb-brand { padding: 24px 20px 20px; position: relative; }
        .sb-brand-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .sb-brand-icon {
            width: 38px; height: 38px; border-radius: 12px;
            background: linear-gradient(135deg, var(--acc), #d4781a);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #fff;
            box-shadow: 0 4px 16px rgba(232,146,42,0.25);
            flex-shrink: 0; position: relative;
        }
        .sb-brand-icon::after {
            content: ''; position: absolute; inset: -2px; border-radius: 14px;
            background: linear-gradient(135deg, rgba(232,146,42,0.4), transparent 60%);
            z-index: -1; filter: blur(4px);
        }
        .sb-brand-text { font-family: 'Space Grotesk', sans-serif; }
        .sb-brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: var(--tx); line-height: 1; }
        .sb-brand-sub { font-size: 10px; font-weight: 500; color: var(--tx3); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }
        .sb-version-badge {
            display: inline-flex; align-items: center; gap: 4px; margin-top: 12px;
            padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 600;
            background: rgba(232,146,42,0.08); border: 1px solid rgba(232,146,42,0.12);
            color: var(--acc-l); letter-spacing: 0.5px;
        }

        .sb-search { padding: 0 16px; margin-bottom: 8px; }
        .sb-search-wrap { position: relative; }
        .sb-search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--tx3); font-size: 12px; transition: color .2s; }
        .sb-search-wrap input {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--brd);
            border-radius: 12px; padding: 10px 14px 10px 38px; font-size: 13px;
            color: var(--tx); outline: none; transition: all .2s;
        }
        .sb-search-wrap input::placeholder { color: var(--tx3) }
        .sb-search-wrap input:focus { border-color: rgba(232,146,42,0.3); background: rgba(232,146,42,0.04); box-shadow: 0 0 0 3px rgba(232,146,42,0.06); }
        .sb-search-wrap input:focus + i, .sb-search-wrap:focus-within i { color: var(--acc-l) }

        .sb-section-label { padding: 16px 20px 8px; font-size: 10px; font-weight: 700; color: var(--tx3); letter-spacing: 2px; text-transform: uppercase; }

        .sb-cat { margin: 2px 12px; padding: 0; border-radius: 12px; overflow: hidden; border: 1px solid transparent; transition: all .2s; cursor: pointer; }
        .sb-cat:hover { background: rgba(255,255,255,0.025); border-color: var(--brd); }
        .sb-cat-head { display: flex; align-items: center; gap: 12px; padding: 11px 14px; transition: all .15s; }
        .sb-cat-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; transition: all .2s; }
        .sb-cat:hover .sb-cat-icon { transform: scale(1.05); }
        .sb-cat-info { flex: 1; min-width: 0; }
        .sb-cat-name { font-size: 13px; font-weight: 600; color: var(--tx); line-height: 1.2; }
        .sb-cat-count { font-size: 11px; color: var(--tx3); margin-top: 1px; }
        .sb-cat-arrow { color: var(--tx3); font-size: 11px; transition: all .2s; opacity: 0; }
        .sb-cat:hover .sb-cat-arrow { opacity: 1; transform: translateX(2px); }

        .sb-profile {
            margin: auto 12px 12px; padding: 14px; border-radius: 14px;
            background: linear-gradient(135deg, rgba(232,146,42,0.06) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(232,146,42,0.1); cursor: pointer;
            transition: all .25s; position: relative; overflow: hidden;
        }
        .sb-profile::before {
            content: ''; position: absolute; top: -20px; right: -20px;
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(232,146,42,0.06); pointer-events: none;
        }
        .sb-profile:hover { border-color: rgba(232,146,42,0.2); background: linear-gradient(135deg, rgba(232,146,42,0.1) 0%, rgba(255,255,255,0.03) 100%); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(232,146,42,0.08); }
        .sb-profile-inner { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
        .sb-profile-avatar { position: relative; flex-shrink: 0; }
        .sb-profile-avatar img { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; border: 2px solid rgba(232,146,42,0.2); }
        .sb-profile-dot { position: absolute; bottom: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); border: 2px solid #0d0d14; box-shadow: 0 0 6px rgba(74,222,128,0.4); }
        .sb-profile-name { font-size: 13px; font-weight: 600; color: var(--tx); line-height: 1.2; }
        .sb-profile-status { font-size: 11px; color: var(--ok); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
        .sb-profile-status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
        .sb-profile-ellipsis { margin-left: auto; color: var(--tx3); font-size: 14px; transition: color .15s; }
        .sb-profile:hover .sb-profile-ellipsis { color: var(--acc-l) }

        .zeta-header {
            position: relative; display: flex; align-items: center; gap: 14px;
            padding: 0 20px; height: 68px; min-height: 68px;
            background: linear-gradient(135deg, rgba(13,13,20,0.95) 0%, rgba(22,22,31,0.92) 50%, rgba(13,13,20,0.95) 100%);
            border-bottom: 1px solid var(--brd); overflow: hidden; z-index: 1;
        }
        .zeta-header::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--acc) 20%, var(--acc-l) 50%, var(--acc) 80%, transparent 100%);
            background-size: 200% 100%; animation: headerLine 3s ease-in-out infinite; z-index: 2;
        }
        @keyframes headerLine { 0%,100%{background-position:200% 0} 50%{background-position:0% 0} }
        .header-glow { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:260px;height:60px;background:radial-gradient(ellipse,rgba(232,146,42,0.08) 0%,transparent 70%);pointer-events:none;z-index:0;animation:glowPulse 4s ease-in-out infinite alternate }
        @keyframes glowPulse { 0%{opacity:.6;transform:translate(-50%,-50%) scale(1)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1.2)} }
        .header-title { position:relative;z-index:1;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#f0a848 0%,#e8922a 40%,#f5c76e 70%,#e8922a 100%);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShine 5s ease-in-out infinite;line-height:1;user-select:none }
        @keyframes titleShine { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .header-subtitle { position:relative;z-index:1;font-size:11px;font-weight:500;color:var(--tx3);letter-spacing:2.5px;text-transform:uppercase;line-height:1;margin-top:2px }
        .header-btn { position:relative;z-index:1;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--brd);background:var(--bg3);color:var(--tx2);cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);font-size:15px;flex-shrink:0 }
        .header-btn:hover { border-color:var(--acc);color:var(--acc-l);background:var(--acc-g);transform:translateY(-1px);box-shadow:0 4px 16px rgba(232,146,42,0.15) }
        .header-btn:active { transform:translateY(0) scale(.96) }
        .header-divider { width:1px;height:28px;background:linear-gradient(to bottom,transparent,var(--brd2),transparent);flex-shrink:0 }

        .dot-grid-bg { position:relative }
        .dot-grid-bg::before { content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(232,146,42,0.06) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;animation:dotDrift 30s linear infinite }
        @keyframes dotDrift { 0%{background-position:0 0} 100%{background-position:28px 28px} }
        .dot-grid-bg::after { content:'';position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:500px;height:360px;background:radial-gradient(ellipse,rgba(232,146,42,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;animation:heroGlow 6s ease-in-out infinite alternate }
        @keyframes heroGlow { 0%{opacity:.5;transform:translateX(-50%) scale(1)} 100%{opacity:1;transform:translateX(-50%) scale(1.15)} }

        .hero-wrap { position:relative; padding:48px 24px 40px; text-align:center; overflow:hidden; z-index:1; }
        .hero-wrap::before { content:''; position:absolute; top:-80px; left:50%; transform:translateX(-50%); width:600px; height:400px; background:radial-gradient(ellipse,rgba(232,146,42,0.10) 0%,rgba(232,146,42,0.03) 40%,transparent 70%); pointer-events:none; animation:heroOrbPulse 5s ease-in-out infinite alternate; }
        @keyframes heroOrbPulse { 0%{opacity:.6;transform:translateX(-50%) scale(1)} 100%{opacity:1;transform:translateX(-50%) scale(1.15)} }
        .hero-orb { position:absolute; border-radius:50%; pointer-events:none; filter:blur(40px); }
        .hero-orb-1 { width:200px;height:200px;background:rgba(232,146,42,0.08);top:-40px;left:10%;animation:orbFloat1 8s ease-in-out infinite alternate; }
        .hero-orb-2 { width:150px;height:150px;background:rgba(240,168,72,0.06);top:20px;right:8%;animation:orbFloat2 10s ease-in-out infinite alternate; }
        .hero-orb-3 { width:100px;height:100px;background:rgba(245,199,110,0.07);bottom:0;left:40%;animation:orbFloat3 7s ease-in-out infinite alternate; }
        @keyframes orbFloat1{0%{transform:translate(0,0)}100%{transform:translate(20px,30px)}}
        @keyframes orbFloat2{0%{transform:translate(0,0)}100%{transform:translate(-15px,25px)}}
        @keyframes orbFloat3{0%{transform:translate(0,0)}100%{transform:translate(10px,-20px)}}
        .hero-geo{position:absolute;pointer-events:none;opacity:0.06;border:1px solid var(--acc)}
        .hero-geo-1{width:40px;height:40px;top:30px;left:12%;transform:rotate(45deg);animation:geoSpin1 12s linear infinite}
        .hero-geo-2{width:24px;height:24px;top:60px;right:15%;border-radius:50%;animation:geoFloat 6s ease-in-out infinite alternate}
        .hero-geo-3{width:32px;height:32px;bottom:30px;right:20%;transform:rotate(20deg);animation:geoSpin2 15s linear infinite reverse}
        .hero-geo-4{width:16px;height:16px;bottom:50px;left:18%;border-radius:50%;animation:geoFloat 4s ease-in-out infinite alternate-reverse}
        @keyframes geoSpin1{0%{transform:rotate(45deg)}100%{transform:rotate(405deg)}}
        @keyframes geoSpin2{0%{transform:rotate(20deg)}100%{transform:rotate(-340deg)}}
        @keyframes geoFloat{0%{transform:translateY(0)}100%{transform:translateY(-15px)}}
        .hero-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:rgba(232,146,42,0.08);border:1px solid rgba(232,146,42,0.15);color:var(--acc-l);margin-bottom:20px;position:relative;z-index:1;animation:badgeIn .6s ease .1s both}
        @keyframes badgeIn{from{opacity:0;transform:translateY(10px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        .hero-bolt-wrap{position:relative;z-index:1;margin-bottom:16px;animation:boltEntry .7s cubic-bezier(0.34,1.56,0.64,1) .15s both}
        @keyframes boltEntry{from{opacity:0;transform:scale(0.5) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
        .hero-bolt-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;border:1px solid rgba(232,146,42,0.15);animation:ringPulse 3s ease-in-out infinite}
        .hero-bolt-ring:nth-child(2){width:100px;height:100px;border-color:rgba(232,146,42,0.08);animation-delay:0.5s}
        @keyframes ringPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.15);opacity:0.5}}
        .hero-title-main{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,6vw,52px);font-weight:700;letter-spacing:-1.5px;line-height:1;margin-bottom:6px;position:relative;z-index:1;animation:heroTitleIn .8s ease .25s both}
        @keyframes heroTitleIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .hero-title-zeta{background:linear-gradient(135deg,#f0a848 0%,#e8922a 25%,#f5c76e 50%,#e8922a 75%,#f0a848 100%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleGrad 4s ease-in-out infinite}
        @keyframes titleGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
        .hero-title-tools{color:var(--tx);font-weight:300}
        .hero-tagline{font-size:13px;font-weight:500;color:var(--tx3);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;position:relative;z-index:1;animation:heroTagIn .6s ease .35s both}
        @keyframes heroTagIn{from{opacity:0;letter-spacing:6px}to{opacity:1;letter-spacing:3px}}
        .hero-greeting{font-size:15px;color:var(--tx2);position:relative;z-index:1;margin-bottom:28px;animation:heroGreetIn .6s ease .45s both}
        @keyframes heroGreetIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .hero-stats{display:inline-flex;gap:2px;background:var(--bg3);border:1px solid var(--brd);border-radius:16px;padding:4px;position:relative;z-index:1;animation:heroStatsIn .6s ease .55s both}
        @keyframes heroStatsIn{from{opacity:0;transform:translateY(12px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        .hero-stat{display:flex;flex-direction:column;align-items:center;padding:10px 20px;border-radius:12px;transition:background .2s;min-width:80px}
        .hero-stat:hover{background:rgba(232,146,42,0.06)}
        .hero-stat-val{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--acc-l);line-height:1}
        .hero-stat-label{font-size:10px;font-weight:500;color:var(--tx3);margin-top:4px;letter-spacing:0.5px;text-transform:uppercase}
        .hero-divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:32px auto 0;position:relative;z-index:1;border-radius:1px;animation:heroStatsIn .6s ease .6s both}
        .hero-particles{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
        .hero-particles span{position:absolute;border-radius:50%;opacity:0;animation:particleFloat linear infinite}
        @keyframes particleFloat{0%{opacity:0;transform:translateY(0) scale(0)}12%{opacity:.7;transform:scale(1)}80%{opacity:.2}100%{opacity:0;transform:translateY(-180px) scale(0)}}

        .wc{background:linear-gradient(145deg,rgba(22,22,31,0.9) 0%,rgba(13,13,20,0.95) 100%);border:1px solid var(--brd);border-radius:16px;padding:24px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;opacity:0;transform:translateY(20px);animation:cardIn .5s ease forwards;backdrop-filter:blur(8px)}
        .wc::before{content:'';position:absolute;inset:-1px;border-radius:16px;padding:1px;background:linear-gradient(135deg,transparent 30%,var(--acc) 50%,transparent 70%);background-size:300% 300%;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;animation:borderShift 3s linear infinite;pointer-events:none}
        .wc::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(232,146,42,0.03),transparent);transition:left .6s ease;pointer-events:none}
        .wc:hover::before{opacity:1}
        .wc:hover::after{left:150%}
        @keyframes borderShift{0%{background-position:0% 0%}100%{background-position:300% 300%}}
        .wc:hover{border-color:transparent;transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,0.3),0 0 60px rgba(232,146,42,0.06),inset 0 1px 0 rgba(255,255,255,0.03)}
        .wc:hover .wc-icon-wrap{transform:scale(1.08) rotate(-3deg);box-shadow:0 8px 24px rgba(232,146,42,0.2)}
        .wc:hover .wc-arrow{opacity:1;transform:translateX(0)}
        @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
        .wc-icon-wrap{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;flex-shrink:0}
        .wc-icon-wrap::after{content:'';position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,0.1) 0%,transparent 50%);pointer-events:none}
        .wc-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--tx);line-height:1.2;margin-bottom:6px}
        .wc-desc{font-size:12px;color:var(--tx3);line-height:1.5}
        .wc-arrow{position:absolute;top:24px;right:20px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(232,146,42,0.08);color:var(--acc);font-size:11px;opacity:0;transform:translateX(-6px);transition:all .3s cubic-bezier(.4,0,.2,1)}
        .wc:hover .wc-arrow{background:rgba(232,146,42,0.15)}

        .cat-section{margin-bottom:32px}
        .cat-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-left:2px}
        .cat-accent{width:3px;height:16px;border-radius:2px;background:var(--acc);flex-shrink:0}
        .cat-label{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:2.5px;text-transform:uppercase;white-space:nowrap}
        .cat-line{flex:1;height:1px;background:linear-gradient(90deg,var(--brd),transparent)}
        .cat-count-badge{font-size:10px;font-weight:600;color:var(--tx3);background:var(--bg3);border:1px solid var(--brd);padding:2px 8px;border-radius:6px;flex-shrink:0}

        .logo-shimmer{position:relative;display:inline-block}
        .logo-shimmer::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);transform:skewX(-15deg);animation:shimmer 5s ease-in-out infinite;pointer-events:none}
        @keyframes shimmer{0%,80%,100%{left:-60%}40%{left:120%}}

        .sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;backdrop-filter:blur(6px)}
        .sb-ov.active{display:block}

        .ifield{background:var(--bg3);border:1px solid var(--brd);color:var(--tx);border-radius:10px;padding:12px 16px;width:100%;font-size:14px;transition:all .2s;outline:none}
        .ifield:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-g)}
        .ifield::placeholder{color:var(--tx3)}
        .ifield:disabled{opacity:.5;cursor:not-allowed}

                    '<img src="'+U.esc(user.profile_image)+'" id="pprev" class="w-20 h-20 rounded-2xl object-cover" style="border:2px solid var(--brd)" onerror="this.src=\'https://ui-avatars.com/api/?name='+encodeURIComponent(user.name)+'&background=e8922a&color=fff&size=128\'">' +
                    '<div class="av-upload-btn"><i class="fa-solid fa-camera"></i></div>' +
                '</div>' +
                /* File input: visually hidden via clip, NOT display:none */
                '<input type="file" id="avfile" accept="image/*" class="sr-file" onchange="avPicked(this)">' +
                '<p class="text-xs mt-3" style="color:var(--tx3)">Tap the camera icon to change photo</p>' +
            '</div>' +

            '<form onsubmit="saveProf(event)">' +
                inp('pname','Name','text',user.name,{icon:'fa-user'}) +
                '<button type="submit" class="bp" id="psbtn">Save Changes</button>' +
            '</form>' +
        '</div>'
    );
}

function avPicked(inp){
    var f=inp.files[0];
    if(!f)return;
    if(f.size>2097152){
        Toast.show('Image must be under 2MB','error');
        /* Reset the input so the same file can be re-selected */
        inp.value='';
        return;
    }
    var reader=new FileReader();
    reader.onload=function(e){
        var prev=document.getElementById('pprev');
        if(prev) prev.src=e.target.result;
        _pendingAvatar=e.target.result;
    };
    reader.onerror=function(){
        Toast.show('Failed to read the image','error');
        inp.value='';
    };
    reader.readAsDataURL(f);
}

function saveProf(e){
    e.preventDefault();
    var btn=document.getElementById('psbtn');
    var n=document.getElementById('pname').value.trim();
    if(!n){Toast.show('Name is required','error');return;}
    btn.disabled=true;
    btn.innerHTML=spin()+' Saving...';
    setTimeout(function(){
        var up={name:n};
        if(_pendingAvatar) up.profile_image=_pendingAvatar;
        DB.updateUser(Auth.getUser().id,up);
        _pendingAvatar=null;
        Toast.show('Profile updated','success');
        Modal.close();
        pgDashboard();
    },400);
}

function openNicChecker(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;var checks=DB.getNicChecks(user.id);Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-id-card mr-2" style="color:var(--acc)"></i>NIC Checker</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Enter a Sri Lankan NIC number to decode birth date, gender, and format.</p><div class="flex flex-col sm:flex-row gap-2 mb-2"><input type="text" id="ncin" class="ifield" placeholder="e.g. 705693323V or 200012345678" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doNicCheck();}"><button class="bp sm:w-auto" id="ncbtn" style="padding:12px 20px" onclick="doNicCheck()"><i class="fa-solid fa-magnifying-glass"></i></button></div><div id="ncres" class="mt-4"></div>'+(checks.length?'<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="nclist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">'+checks.map(rNCI).join('')+'</div></div>':'<div id="nclist"></div>')+'</div>');setTimeout(function(){var i=document.getElementById('ncin');if(i)i.focus();},50);}

function doNicCheck(){var inp=document.getElementById('ncin'),btn=document.getElementById('ncbtn'),res=document.getElementById('ncres');var nic=inp.value.trim();if(!nic){Toast.show('Enter a NIC number first','error');return;}if(!/^\d{9}[vVxX]$|^\d{12}$/.test(nic)){Toast.show('Enter a valid NIC (9 digits + V, or 12 digits)','error');return;}btn.disabled=true;var orig=btn.innerHTML;btn.innerHTML=spin(14);NICChecker.decode(nic,function(r){btn.disabled=false;btn.innerHTML=orig;res.innerHTML=rNCResult(r);var user=Auth.getUser();var entry={id:U.id(),nic:r.nic,gender:r.gender,birthDate:r.birthDate,created_at:U.now()};DB.addNicCheck(user.id,entry);var list=document.getElementById('nclist');if(list)list.innerHTML=DB.getNicChecks(user.id).map(rNCI).join('');inp.value='';Toast.show('NIC decoded','success');},function(err){btn.disabled=false;btn.innerHTML=orig;Toast.show(err,'error');});}

function rNCResult(r){return '<div class="nc-res"><div class="nc-row"><span class="l">NIC</span><span class="v">'+U.esc(r.nic)+'</span></div><div class="nc-row"><span class="l">Format</span><span class="v">'+U.esc(r.format||'-')+'</span></div><div class="nc-row"><span class="l">Gender</span><span class="v">'+U.esc(r.gender||'-')+'</span></div><div class="nc-row"><span class="l">Birth Date</span><span class="v">'+U.esc(r.birthDate||'-')+'</span></div><div class="nc-row"><span class="l">Birth Year</span><span class="v">'+U.esc(String(r.birthYear||'-'))+'</span></div></div>';}

function rNCI(l){return '<div class="nc-hi"><i class="fa-solid fa-id-card" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">'+U.esc(l.nic)+'</div><div class="o">'+U.esc(l.gender||'')+(l.birthDate?' &bull; '+U.esc(l.birthDate):'')+'</div></div><button class="nc-ib" title="Copy" onclick="cpText(\''+U.esc(l.nic).replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delNC(\''+l.id+'\')"><i class="fa-solid fa-xmark"></i></button></div>';}
function delNC(id){var user=Auth.getUser();if(!user)return;DB.deleteNicCheck(user.id,id);var list=document.getElementById('nclist');if(list)list.innerHTML=DB.getNicChecks(user.id).map(rNCI).join('');}
function cpText(t){navigator.clipboard.writeText(t).then(function(){Toast.show('Copied','success');});}

var FX_CODES=[{c:'USD',n:'US Dollar'},{c:'GBP',n:'British Pound'},{c:'EUR',n:'Euro'},{c:'AUD',n:'Australian Dollar'},{c:'CAD',n:'Canadian Dollar'},{c:'JPY',n:'Japanese Yen'},{c:'INR',n:'Indian Rupee'},{c:'AED',n:'UAE Dirham'},{c:'SAR',n:'Saudi Riyal'},{c:'SGD',n:'Singapore Dollar'},{c:'CHF',n:'Swiss Franc'},{c:'CNY',n:'Chinese Yuan'}];

function openCurrency(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;var checks=DB.getFxChecks(user.id);Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-money-bill-transfer mr-2" style="color:var(--acc)"></i>LKR Exchange Rate</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Check the live rate for any currency against the Sri Lankan Rupee.</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2"><div><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">CURRENCY</label><select id="fxcode" class="ifield" style="padding:12px">'+FX_CODES.map(function(f){return '<option value="'+f.c+'">'+f.c+' — '+f.n+'</option>';}).join('')+'</select></div><div><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">AMOUNT</label><input type="number" id="fxamt" class="ifield" value="1" min="0" step="any" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doFxCheck();}"></div></div><button class="bp mt-1" id="fxbtn" onclick="doFxCheck()"><i class="fa-solid fa-arrow-right-arrow-left"></i> Get Rate</button><div id="fxres" class="mt-4"></div>'+(checks.length?'<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="fxlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">'+checks.map(rFXI).join('')+'</div></div>':'<div id="fxlist"></div>')+'</div>');}

function doFxCheck(){var sel=document.getElementById('fxcode'),amtIn=document.getElementById('fxamt'),btn=document.getElementById('fxbtn'),res=document.getElementById('fxres');var code=sel.value;var amt=parseFloat(amtIn.value);if(isNaN(amt)||amt<0){Toast.show('Enter a valid amount','error');return;}btn.disabled=true;var orig=btn.innerHTML;btn.innerHTML=spin(14);CurrencyAPI.getRate(code,function(r){btn.disabled=false;btn.innerHTML=orig;res.innerHTML=rFXResult(r,amt);var user=Auth.getUser();var entry={id:U.id(),code:r.from,rate:r.rate,amount:amt,converted:amt*r.rate,created_at:U.now()};DB.addFxCheck(user.id,entry);var list=document.getElementById('fxlist');if(list)list.innerHTML=DB.getFxChecks(user.id).map(rFXI).join('');Toast.show('Rate updated','success');},function(err){btn.disabled=false;btn.innerHTML=orig;Toast.show(err,'error');});}

function rFXResult(r,amt){var converted=(amt*r.rate).toLocaleString('en-LK',{maximumFractionDigits:2});var updated=r.last_updated_utc?U.relTime(r.last_updated_utc):'-';return '<div class="nc-res"><div class="text-center mb-1" style="padding:8px 0"><div class="text-2xl font-display font-bold" style="color:var(--acc)">Rs. '+converted+'</div><div class="text-xs mt-1" style="color:var(--tx3)">'+U.esc(String(amt))+' '+U.esc(r.from)+' converted to LKR</div></div><div class="nc-row"><span class="l">Rate (1 '+U.esc(r.from)+')</span><span class="v">Rs. '+U.esc(String(r.rate))+'</span></div><div class="nc-row"><span class="l">Inverse Rate</span><span class="v">'+U.esc(String(r.inverse_rate||'-'))+'</span></div><div class="nc-row"><span class="l">Last Updated</span><span class="v">'+U.esc(updated)+'</span></div><div class="nc-row"><span class="l">Source</span><span class="v">'+U.esc(r.source||'-')+'</span></div></div>';}

function rFXI(l){var conv=(l.converted||0).toLocaleString('en-LK',{maximumFractionDigits:2});return '<div class="nc-hi"><i class="fa-solid fa-money-bill-transfer" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">'+U.esc(String(l.amount))+' '+U.esc(l.code)+' &rarr; Rs. '+conv+'</div><div class="o">Rate: '+U.esc(String(l.rate))+' &bull; '+U.esc(U.relTime(l.created_at))+'</div></div><button class="nc-ib" title="Copy" onclick="cpText(\''+conv.replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delFX(\''+l.id+'\')"><i class="fa-solid fa-xmark"></i></button></div>';}
function delFX(id){var user=Auth.getUser();if(!user)return;DB.deleteFxCheck(user.id,id);var list=document.getElementById('fxlist');if(list)list.innerHTML=DB.getFxChecks(user.id).map(rFXI).join('');}

var LOTTERY_GAMES=[{label:'Sasiri',value:'sasiri'},{label:'Samanala',value:'samanala'},{label:'Mahajana',value:'mahajana'},{label:'Nidahas',value:'nidahas'},{label:'Govi',value:'govi'},{label:'Jaya',value:'jaya'},{label:'Wasana',value:'wasana'},{label:'Kotipathi',value:'kotipathi'},{label:'Lagna',value:'lagna'},{label:'Rathu',value:'rathu'}];

function openLotteryChecker(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;var checks=DB.getLotteryChecks(user.id);var pills=LOTTERY_GAMES.map(function(g){return '<button class="text-xs px-3 py-1.5 rounded-full border border-[var(--brd)] hover:border-[var(--acc)] hover:bg-[var(--acc-g)] transition-all" style="color:var(--tx2)" onclick="document.getElementById(\'lotgame\').value=\''+g.value+'\';doLotteryCheck();">'+U.esc(g.label)+'</button>';}).join('');Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-ticket mr-2" style="color:var(--acc)"></i>Lottery Checker</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Enter a Sri Lankan lottery game name (e.g. <strong>sasiri</strong>) to get the latest draw results.</p><div class="flex flex-wrap gap-2 mb-3">'+pills+'</div><div class="flex flex-col sm:flex-row gap-2"><input type="text" id="lotgame" class="ifield" placeholder="Game name…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doLotteryCheck();}"><button class="bp sm:w-auto" id="lotbtn" style="padding:12px 20px" onclick="doLotteryCheck()"><i class="fa-solid fa-magnifying-glass"></i></button></div><div id="lotres" class="mt-4"></div>'+(checks.length?'<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="lotlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">'+checks.map(rLotteryItem).join('')+'</div></div>':'<div id="lotlist"></div>')+'</div>');setTimeout(function(){var i=document.getElementById('lotgame');if(i)i.focus();},50);}

function doLotteryCheck(){var inp=document.getElementById('lotgame'),btn=document.getElementById('lotbtn'),res=document.getElementById('lotres');var game=inp.value.trim();if(!game){Toast.show('Enter a lottery game name','error');return;}btn.disabled=true;var orig=btn.innerHTML;btn.innerHTML=spin(14);LotteryAPI.fetch(game,function(r){btn.disabled=false;btn.innerHTML=orig;res.innerHTML=rLotteryResult(r);var user=Auth.getUser();var entry={id:U.id(),game:r.game,board:r.board||'DLB',draw_number:r.draw_number||'-',date:r.date||'-',numbers:r.numbers||[],source_url:r.source_url||'',disclaimer:r.disclaimer||'',created_at:U.now()};DB.addLotteryCheck(user.id,entry);var list=document.getElementById('lotlist');if(list)list.innerHTML=DB.getLotteryChecks(user.id).map(rLotteryItem).join('');Toast.show('Lottery results loaded','success');},function(err){btn.disabled=false;btn.innerHTML=orig;Toast.show(err,'error');});}

function rLotteryResult(r){var nums=(r.numbers||[]).map(function(n){return '<span class="lp gold">'+U.esc(String(n))+'</span>';}).join('');var boardClass=(r.board||'').toLowerCase()==='dlb'?'dlb':'';return '<div class="nc-res"><div class="text-center mb-1" style="padding:4px 0"><span class="lot-game-badge '+boardClass+'">'+U.esc(r.board||'DLB')+'</span></div><div class="nc-row"><span class="l">Game</span><span class="v" style="text-transform:capitalize">'+U.esc(r.game||'-')+'</span></div><div class="nc-row"><span class="l">Draw Number</span><span class="v">'+U.esc(r.draw_number||'-')+'</span></div><div class="nc-row"><span class="l">Date</span><span class="v">'+U.esc(r.date||'-')+'</span></div><div class="nc-row" style="flex-wrap:wrap"><span class="l">Winning Numbers</span><span class="v" style="flex-wrap:wrap;display:flex;gap:4px;justify-content:flex-end">'+nums+'</span></div>'+(r.source_url?'<div class="nc-row"><span class="l">Source</span><span class="v"><a href="'+U.esc(r.source_url)+'" target="_blank" rel="noopener noreferrer" style="color:var(--acc-l);text-decoration:underline;font-size:13px">results.govdoc.lk</a></span></div>':'')+(r.disclaimer?'<div class="mt-2 text-xs" style="color:var(--tx3);line-height:1.4">'+U.esc(r.disclaimer)+'</div>':'')+'</div>';}

function rLotteryItem(l){var nums=(l.numbers||[]).slice(0,3).map(function(n){return U.esc(String(n));}).join(' ');var suffix=(l.numbers||[]).length>3?' …':'';var boardLabel=(l.board||'DLB').toUpperCase();return '<div class="nc-hi"><i class="fa-solid fa-ticket" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">'+U.esc(l.game)+' #'+U.esc(l.draw_number||'-')+' — '+nums+suffix+'</div><div class="o">'+boardLabel+' &bull; '+U.esc(l.date||'')+' &bull; '+U.esc(U.relTime(l.created_at))+'</div></div><button class="nc-ib" title="Copy" onclick="cpText(\''+(l.numbers||[]).join(' ').replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delLot(\''+l.id+'\')"><i class="fa-solid fa-xmark"></i></button></div>';}
function delLot(id){var user=Auth.getUser();if(!user)return;DB.deleteLotteryCheck(user.id,id);var list=document.getElementById('lotlist');if(list)list.innerHTML=DB.getLotteryChecks(user.id).map(rLotteryItem).join('');}

function openPasswordGenerator(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;var entries=DB.getPasswordEntries(user.id);Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-key mr-2" style="color:var(--acc)"></i>Password Generator</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Generate a secure, random password with a custom length.</p><div class="mb-4"><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">PASSWORD LENGTH</label><div class="pw-length-selector"><input type="range" id="pwrange" class="ri" min="6" max="32" value="16" oninput="document.getElementById(\'pwlen\').textContent=this.value"><span class="length-label" id="pwlen">16</span></div></div><button class="bp" id="pwbtn" onclick="doGeneratePassword()"><i class="fa-solid fa-rotate"></i> Generate Password</button><div id="pwres" class="mt-4"></div>'+(entries.length?'<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="pwlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">'+entries.map(rPasswordItem).join('')+'</div></div>':'<div id="pwlist"></div>')+'</div>');setTimeout(function(){doGeneratePassword();},100);}

function doGeneratePassword(){var range=document.getElementById('pwrange'),btn=document.getElementById('pwbtn'),res=document.getElementById('pwres');var length=parseInt(range.value,10);if(isNaN(length)||length<6||length>32){Toast.show('Please select a length between 6 and 32','error');return;}btn.disabled=true;var orig=btn.innerHTML;btn.innerHTML=spin(14);PasswordAPI.generate(length,function(r){btn.disabled=false;btn.innerHTML=orig;res.innerHTML=rPasswordResult(r);var user=Auth.getUser();var entry={id:U.id(),password:r.password,length:r.length,created_at:U.now()};DB.addPasswordEntry(user.id,entry);var list=document.getElementById('pwlist');if(list)list.innerHTML=DB.getPasswordEntries(user.id).map(rPasswordItem).join('');Toast.show('Password generated','success');},function(err){btn.disabled=false;btn.innerHTML=orig;Toast.show(err,'error');});}

function rPasswordResult(r){var pw=U.esc(r.password);return '<div class="nc-res"><div class="pw-box"><span class="font-mono tracking-wide">'+pw+'</span><button class="copy-btn" onclick="cpText(\''+pw.replace(/'/g,"\\'")+'\')" title="Copy to clipboard"><i class="fa-regular fa-copy"></i></button></div><div class="nc-row"><span class="l">Length</span><span class="v">'+U.esc(String(r.length))+'</span></div></div>';}

function rPasswordItem(l){var pw=U.esc(l.password);return '<div class="nc-hi"><i class="fa-solid fa-key" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s font-mono text-sm tracking-wide">'+pw+'</div><div class="o">Length '+U.esc(String(l.length))+' &bull; '+U.esc(U.relTime(l.created_at))+'</div></div><button class="nc-ib" title="Copy" onclick="cpText(\''+pw.replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delPw(\''+l.id+'\')"><i class="fa-solid fa-xmark"></i></button></div>';}
function delPw(id){var user=Auth.getUser();if(!user)return;DB.deletePasswordEntry(user.id,id);var list=document.getElementById('pwlist');if(list)list.innerHTML=DB.getPasswordEntries(user.id).map(rPasswordItem).join('');}

function openSettings(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><div class="flex items-center gap-3 p-4 rounded-lg mb-4" style="background:var(--bg3)"><i class="fa-solid fa-moon" style="color:var(--acc)"></i><div><div class="text-sm font-medium">Dark Mode</div><div class="text-xs" style="color:var(--tx3)">Always on for this app</div></div></div><button class="bs" onclick="clearAll()"><i class="fa-solid fa-trash-can"></i> Clear all data</button></div>');}

Router.reg('/dashboard',pgDashboard);
Router.reg('/settings',function(){pgDashboard();setTimeout(openSettings,100);});

(function(){document.documentElement.classList.add('dark');document.documentElement.classList.remove('light');if(!Router.cur()||Router.cur()==='/login'||Router.cur()==='/register')Router.go('/dashboard');Router.init();})();
</script>
