<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ZETA TOOLS — Premium APK Downloads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
    </script>
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --bg-base: #04060C;
            --bg-surface: #080B14;
            --bg-elevated: #0C1020;
            --bg-overlay: #101528;
            --bg-card: rgba(12, 16, 32, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.045);
            --border-default: rgba(255, 255, 255, 0.07);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #F1F2F6;
            --text-secondary: #7C829D;
            --text-tertiary: #474D6A;
            --accent-blue: #4F7DF7;
            --accent-blue-soft: rgba(79, 125, 247, 0.12);
            --accent-cyan: #2DD4E8;
            --accent-violet: #7C5CFC;
            --accent-violet-soft: rgba(124, 92, 252, 0.10);
            --status-success: #22C990;
            --status-error: #F0564A;
            --status-warning: #F5A623;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.2);
            --shadow-elevated: 0 2px 6px rgba(0, 0, 0, 0.4), 0 16px 40px rgba(0, 0, 0, 0.3);
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 400ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            overflow: hidden;
            height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }
        ::selection {
            background: rgba(79, 125, 247, 0.25);
            color: var(--text-primary);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        #app-scroll::-webkit-scrollbar {
            width: 3px;
        }
        #app-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        /* ============================================================
           NAVBAR — clean, icon‑free, responsive
           ============================================================ */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
            background: rgba(4, 6, 12, 0.82);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 50;
        }
        .top-nav::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 5%, rgba(79, 125, 247, 0.2) 35%, rgba(124, 92, 252, 0.12) 65%, transparent 95%);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
            cursor: pointer;
            gap: 0;
            padding: 4px 0;
        }
        .nav-brand-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
            line-height: 1;
            background: linear-gradient(135deg, #8BB4FA 0%, #4F7DF7 40%, #8B7DF8 80%, #6B9BFA 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: brandShift 8s ease-in-out infinite;
            white-space: nowrap;
        }
        @keyframes brandShift {
            0%,
            100% {
                background-position: 0% 50%
            }
            50% {
                background-position: 100% 50%
            }
        }
        @media(max-width:480px) {
            .nav-brand-text {
                font-size: 16px;
                letter-spacing: -0.2px;
            }
        }
        @media(min-width:481px) and (max-width:767px) {
            .nav-brand-text {
                font-size: 18px;
            }
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .nav-btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            border: none;
            background: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'Inter', sans-serif;
        }
        .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }
        .nav-btn .caret {
            font-size: 9px;
            opacity: 0.4;
            margin-left: 2px;
            transition: transform var(--transition-fast);
        }
        .nav-btn:hover .caret {
            opacity: 0.7;
        }

        .nav-btn-primary {
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-blue), #3B5FE0);
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }
        .nav-btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 2px 12px rgba(79, 125, 247, 0.25);
        }
        .nav-btn-primary:active {
            transform: scale(0.97);
        }

        .nav-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            border: 1.5px solid var(--border-subtle);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .nav-avatar:hover {
            border-color: rgba(79, 125, 247, 0.3);
        }

        .nav-hamburger {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 18px;
            font-weight: 300;
            line-height: 1;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        .nav-hamburger:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-cat-dropdown {
            position: relative;
        }
        .nav-cat-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background: var(--bg-elevated);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 5px;
            min-width: 170px;
            box-shadow: var(--shadow-elevated);
            animation: dropIn .15s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 60;
            display: none;
        }
        .nav-cat-menu.open {
            display: block;
        }
        .nav-cat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }
        .nav-cat-item:hover {
            background: rgba(79, 125, 247, 0.06);
            color: var(--text-primary);
        }
        .nav-cat-item .count {
            font-size: 10px;
            color: var(--text-tertiary);
            background: rgba(255, 255, 255, 0.04);
            padding: 0 7px;
            border-radius: 4px;
        }
        @keyframes dropIn {
            from {
                opacity: 0;
                transform: translateY(-4px) scale(.97)
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        .nav-btn-mobile {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            border: none;
            background: none;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }
        .nav-btn-mobile:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        /* ============================================================
           SIDEBAR — fixed: full height, scrollable, responsive
           ============================================================ */
        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100dvh;
            background: rgba(8, 11, 20, 0.98);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-smooth);
            z-index: 45;
            position: relative;
            overflow: hidden;
            box-shadow: 6px 0 36px rgba(0, 0, 0, 0.5);
        }
        @media(min-width:768px) {
            .sidebar {
                display: none !important;
            }
            .sb-overlay {
                display: none !important;
            }
        }
        @media(max-width:767px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%);
                border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
                width: 280px;
                min-width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }
        @media(max-width:480px) {
            .sidebar {
                width: 260px;
                min-width: 260px;
            }
        }

        .sb-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 40;
            backdrop-filter: blur(4px);
            animation: fadeIn .2s ease;
        }
        .sb-overlay.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0
            }
            to {
                opacity: 1
            }
        }

        .sb-head {
            flex-shrink: 0;
            padding: 16px 18px 12px;
            padding-top: max(16px, env(safe-area-inset-top, 16px));
            position: relative;
            border-bottom: 1px solid var(--border-subtle);
        }
        .sb-head-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sb-head-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-violet));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
            flex-shrink: 0;
            box-shadow: 0 2px 10px rgba(79, 125, 247, 0.2);
        }
        .sb-head-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
            letter-spacing: -0.3px;
        }
        .sb-head-name span {
            color: var(--text-tertiary);
            font-weight: 500;
        }
        .sb-head-ver {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .sb-nav {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px 6px;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .sb-nav::-webkit-scrollbar {
            width: 3px;
        }
        .sb-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .sb-nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
        }
        .sb-nav-item:hover {
            background: rgba(79, 125, 247, 0.06);
            color: var(--text-primary);
        }
        .sb-nav-item i {
            width: 18px;
            text-align: center;
            font-size: 13px;
            color: var(--text-tertiary);
            transition: color var(--transition-fast);
        }
        .sb-nav-item:hover i {
            color: var(--accent-blue);
        }
        .sb-nav-divider {
            height: 1px;
            background: var(--border-subtle);
            margin: 4px 8px;
            flex-shrink: 0;
        }

        .sb-profile {
            flex-shrink: 0;
            margin: 6px 10px 14px;
            padding: 11px 13px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all var(--transition-base);
            position: relative;
        }
        .sb-profile:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.03);
        }
        .sb-profile-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        .sb-profile-avatar {
            position: relative;
            flex-shrink: 0;
        }
        .sb-profile-avatar img {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            object-fit: cover;
            border: 1.5px solid var(--border-subtle);
            transition: border-color var(--transition-fast);
        }
        .sb-profile:hover .sb-profile-avatar img {
            border-color: rgba(79, 125, 247, 0.25);
        }
        .sb-profile-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--status-success);
            border: 2px solid var(--bg-surface);
            animation: pulseDot 2.5s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(34, 201, 144, 0.35)
            }
            50% {
                box-shadow: 0 0 0 4px rgba(34, 201, 144, 0)
            }
        }
        .sb-profile-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .sb-profile-status {
            font-size: 11px;
            color: var(--status-success);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sb-profile-status::before {
            content: '';
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--status-success);
        }
        .sb-profile-ellipsis {
            margin-left: auto;
            color: var(--text-tertiary);
            font-size: 12px;
            transition: all var(--transition-base);
        }
        .sb-profile:hover .sb-profile-ellipsis {
            color: var(--text-secondary);
            transform: rotate(90deg);
        }
        .sb-dropdown {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 8px;
            background: var(--bg-elevated);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 5px;
            min-width: 160px;
            box-shadow: var(--shadow-elevated);
            animation: dropIn .15s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }
        .sb-dropdown .ddi {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }
        .sb-dropdown .ddi:hover {
            background: rgba(79, 125, 247, 0.06);
            color: var(--text-primary);
        }
        .sb-dropdown .ddv {
            height: 1px;
            background: var(--border-subtle);
            margin: 3px 0;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn .2s ease;
            padding: 16px;
        }
        .modal-content {
            background: var(--bg-elevated);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-xl);
            max-width: 460px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: modalIn .3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-elevated);
        }
        .modal-content::-webkit-scrollbar {
            width: 3px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(.94) translateY(16px)
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        /* ============================================================
           BUTTONS & INPUTS
           ============================================================ */
        .btn-glass {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            font-weight: 500;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-family: 'Inter', sans-serif;
        }
        .btn-glass:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.04);
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-blue), #3B5FE0);
            border: none;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 2px 14px rgba(79, 125, 247, 0.18);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            opacity: 0;
            transition: opacity var(--transition-base)
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 22px rgba(79, 125, 247, 0.28);
        }
        .btn-primary:hover::after {
            opacity: 1;
        }
        .btn-primary:active {
            transform: scale(.98);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border-default);
            cursor: pointer;
            transition: all var(--transition-base);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }
        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.025);
            transform: translateY(-1px);
        }
        .auth-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            width: 100%;
            color: var(--text-primary);
            font-size: 13px;
            transition: border-color var(--transition-fast);
            font-family: 'Inter', sans-serif;
        }
        .auth-input:focus {
            border-color: var(--accent-blue);
            outline: none;
        }
        .auth-input::placeholder {
            color: var(--text-tertiary);
        }
        .auth-error {
            color: var(--status-error);
            font-size: 12px;
            margin-top: 4px;
            min-height: 18px;
        }
        .auth-success {
            color: var(--status-success);
            font-size: 12px;
            margin-top: 4px;
            min-height: 18px;
        }
        .auth-toggle {
            color: var(--accent-blue);
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }
        .auth-toggle:hover {
            text-decoration: underline;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 14px 0;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }
        .auth-divider span {
            font-size: 11px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;

            padding-left: 20px;
            position: relative;
        }
        .detail-section ul li::before {
            content: '›';
            position: absolute;
            left: 0;
            color: var(--accent-blue);
            font-weight: 700;
        }
        .detail-changelog {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .detail-changelog strong {
            color: var(--text-primary);
        }
        .detail-requirements-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .detail-req-item {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-req-item i {
            color: var(--accent-blue);
            font-size: 11px;
        }
        .detail-req-item strong {
            color: var(--text-primary);
        }

        /* ============================================================
           REVIEWS
           ============================================================ */
        .review-item {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 8px;
        }
        .review-item-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .review-item-avatar {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            object-fit: cover;
        }
        .review-item-name {
            font-size: 12.5px;
            font-weight: 600;
        }
        .review-item-stars {
            display: flex;
            gap: 1px;
            margin-left: auto;
            font-size: 10px;
            color: var(--status-warning);
        }
        .review-item-stars .empty {
            color: var(--text-tertiary);
        }
        .review-item-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .review-item-date {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 3px;
        }

        /* ============================================================
           RELATED APPS
           ============================================================ */
        .related-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .related-item {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .related-item:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.03);
        }
        .related-item-icon {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
        }
        .related-item-icon.violet {
            background: linear-gradient(135deg, #7C5CFC, #6344E0);
        }
        .related-item-icon.blue {
            background: linear-gradient(135deg, #4F7DF7, #3B5FE0);
        }
        .related-item-icon.red {
            background: linear-gradient(135deg, #FF0033, #CC0000);
        }
        .related-item-icon.green {
            background: linear-gradient(135deg, #22C990, #0ea56a);
        }
        .related-item-icon.cyan {
            background: linear-gradient(135deg, #2DD4E8, #0ea5e9);
        }
        .related-item-icon.orange {
            background: linear-gradient(135deg, #F97316, #EA580C);
        }
        .related-item-icon.purple {
            background: linear-gradient(135deg, #A855F7, #7C3AED);
        }
        .related-item-info {
            flex: 1;
            min-width: 0;
        }
        .related-item-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .related-item-meta {
            font-size: 10px;
            color: var(--text-tertiary);
        }

        /* ============================================================
           STATS
           ============================================================ */
        .stats-section {
            padding: 36px 20px;
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
            background: linear-gradient(180deg, rgba(79, 125, 247, 0.01), rgba(124, 92, 252, 0.006), transparent);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 720px;
            margin: 0 auto;
        }
        .stat-item {
            text-align: center;
            padding: 12px 4px;
        }
        .stat-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(20px, 3.5vw, 28px);
            font-weight: 500;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .stat-label {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
            font-weight: 500;
        }

        /* ============================================================
           DOCUMENTS SECTION
           ============================================================ */
        .documents-section {
            padding: 32px 20px;
            max-width: 720px;
            margin: 0 auto;
        }
        .doc-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            overflow: hidden;
            transition: all var(--transition-base);
            position: relative;
        }
        .doc-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-xl);
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 200, 0, 0.10), transparent 50%, rgba(255, 100, 0, 0.06));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition-base);
        }
        .doc-card:hover::before {
            opacity: 1;
        }
        .doc-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .doc-icon {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(245, 200, 66, 0.08);
            color: #F5C842;
            border: 1px solid rgba(245, 200, 66, 0.10);
        }
        .doc-icon.locked {
            background: rgba(255, 70, 70, 0.08);
            color: #FF4D6D;
            border-color: rgba(255, 70, 70, 0.10);
        }
        .doc-icon.unlocked {
            background: rgba(34, 201, 144, 0.08);
            color: var(--status-success);
            border-color: rgba(34, 201, 144, 0.10);
        }
        .doc-header-info {
            flex: 1;
            min-width: 0;
        }
        .doc-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .doc-sub {
            font-size: 11px;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 1px;
            flex-wrap: wrap;
        }
        .doc-sub i {
            font-size: 9px;
        }
        .doc-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .doc-status-badge.locked {
            background: rgba(255, 70, 70, 0.08);
            color: #FF4D6D;
            border: 1px solid rgba(255, 70, 70, 0.10);
        }
        .doc-status-badge.unlocked {
            background: rgba(34, 201, 144, 0.08);
            color: var(--status-success);
            border: 1px solid rgba(34, 201, 144, 0.10);
        }
        .doc-body {
            padding: 16px 20px 20px;
        }
        .doc-locked {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .doc-locked .lock-msg {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .doc-locked .lock-msg i {
            color: var(--status-warning);
            font-size: 14px;
        }
        .doc-password-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .doc-password-row .auth-input {
            flex: 1;
            min-width: 140px;
            font-size: 13px;
            padding: 8px 12px;
        }
        .doc-password-row .btn-unlock {
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #F5A623, #E8920C);
            box-shadow: 0 2px 10px rgba(245, 166, 35, 0.18);
            transition: all var(--transition-base);
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }
        .doc-password-row .btn-unlock:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 18px rgba(245, 166, 35, 0.28);
        }
        .doc-password-row .btn-unlock:active {
            transform: scale(.98);
        }
        .doc-password-hint {
            font-size: 11px;
            color: var(--text-tertiary);
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border: 1px dashed var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .doc-password-hint i {
            color: var(--accent-blue);
            font-size: 10px;
        }
        .doc-error {
            color: var(--status-error);
            font-size: 12px;
            min-height: 18px;
        }
        .doc-unlocked {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn .3s ease;
        }
        .doc-unlocked .doc-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .doc-unlocked .doc-desc strong {
            color: var(--text-primary);
        }
        .doc-unlocked .doc-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 12px;
        }
        .doc-unlocked .doc-meta-grid .label {
            color: var(--text-tertiary);
        }
        .doc-unlocked .doc-meta-grid .value {
            color: var(--text-primary);
            font-weight: 500;
        }
        .doc-unlocked .doc-dl-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #F5A623, #E8920C);
            box-shadow: 0 2px 14px rgba(245, 166, 35, 0.2);
            text-decoration: none;
            transition: all var(--transition-base);
            align-self: flex-start;
            font-family: 'Inter', sans-serif;
        }
        .doc-unlocked .doc-dl-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(245, 166, 35, 0.3);
        }
        .doc-unlocked .doc-dl-link:active {
            transform: scale(.97);
        }
        .doc-unlocked .doc-dl-link i {
            font-size: 14px;
        }

        @media(max-width:767px) {
            .doc-meta-grid {
                grid-template-columns: 1fr !important;
            }
            .doc-password-row {
                flex-direction: column;
                align-items: stretch;
            }
            .doc-password-row .auth-input {
                min-width: unset;
            }
            .doc-unlocked .doc-dl-link {
                width: 100%;
                justify-content: center;
            }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .site-footer {
            padding: 32px 20px 18px;
            border-top: 1px solid var(--border-subtle);
        }
        .footer-grid {
            max-width: 720px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 24px;
        }
        .footer-brand {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
            letter-spacing: -0.2px;
        }
        .footer-desc {
            font-size: 11px;
            color: var(--text-tertiary);
            line-height: 1.7;
            max-width: 220px;
        }
        .footer-social {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .footer-social a {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            transition: all var(--transition-fast);
            text-decoration: none;
            font-size: 12px;
        }
        .footer-social a:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }
        .footer-col-title {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .footer-link {
            display: block;
            font-size: 12px;
            color: var(--text-tertiary);
            text-decoration: none;
            padding: 2px 0;
            transition: color var(--transition-fast);
            cursor: pointer;
            background: none;
            border: none;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }
        .footer-link:hover {
            color: var(--text-primary);
        }
        .footer-bottom {
            max-width: 720px;
            margin: 20px auto 0;
            padding-top: 14px;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 10px;
            color: var(--text-tertiary);
        }

        /* ============================================================
           REVEAL ANIMATIONS
           ============================================================ */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .55s ease, transform .55s ease;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-d1 {
            transition-delay: .06s;
        }
        .reveal-d2 {
            transition-delay: .12s;
        }
        .reveal-d3 {
            transition-delay: .18s;
        }
        .reveal-d4 {
            transition-delay: .24s;
        }

                "gl": "us",
                "hl": "en"
            });

                "headers": {
                    "accept-encoding": "gzip, deflate, br, zstd",

            const match = html.match(/var m=({.+?});var a=m/s);

        async function hashPassword(password, salt) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + salt);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function generateSalt() {
            const array = new Uint8Array(16);
            crypto.getRandomValues(array);
            return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
        }

        function getLoginAttempts() {
            try { return JSON.parse(localStorage.getItem('z_login_attempts') || '{}'); } catch { return {}; }
        }

        function setLoginAttempts(data) { localStorage.setItem('z_login_attempts', JSON.stringify(data)); }

        function isRateLimited(email) {
            const attempts = getLoginAttempts();
            const now = Date.now();
            const record = attempts[email];
            if (!record) return false;
            if (record.count >= 5 && (now - record.lastAttempt) < 300000) return true;
            if (now - record.lastAttempt >= 300000) { delete attempts[email];
                setLoginAttempts(attempts); return false; }
            return false;
        }

        function recordLoginAttempt(email, success) {
            const attempts = getLoginAttempts();
            const now = Date.now();
            if (!attempts[email]) attempts[email] = { count: 0, lastAttempt: now };
            if (success) { delete attempts[email]; } else { attempts[email].count += 1;
                attempts[email].lastAttempt = now; }
            setLoginAttempts(attempts);
        }

        function getSession() { try { return localStorage.getItem('z_session') || null; } catch { return null; } }

        function setSession(userId) { if (userId) localStorage.setItem('z_session', userId);
            else localStorage.removeItem('z_session'); }

        const Auth = {
            getUser: function() {
                const sid = getSession();
                if (sid) { const u = DB.getUser(sid); if (u) return u; }
                let guest = DB.getUser('guest');
                if (!guest) {
                    guest = DB.addUser({
                        id: 'guest',
                        name: 'Guest',
                        email: 'guest@zeta.tools',
                        profile_image: 'https://ui-avatars.com/api/?name=Guest&background=4F7DF7&color=fff&size=128&bold=true',
                        created_at: U.now()
                    });
                }
                return guest;
            },
            isLoggedIn: function() {
                const sid = getSession();
                if (!sid) return false;
                return !!DB.getUser(sid);
            },
            login: function(email, password) {
                return new Promise((resolve, reject) => {
                    if (isRateLimited(email)) {
                        reject(new Error('Too many failed attempts. Please wait 5 minutes.'));
                        return;
                    }
                    const user = DB.getUserByEmail(email);
                    if (!user) { recordLoginAttempt(email, false);
                        reject(new Error('Invalid email or password.'));
                        return; }
                    if (!user.passwordHash || !user.salt) {
                        reject(new Error('Account not properly set up.'));
                        return;
                    }
                    hashPassword(password, user.salt).then(hash => {
                        if (hash === user.passwordHash) {
                            recordLoginAttempt(email, true);
                            setSession(user.id);
                            resolve(user);
                        } else {
                            recordLoginAttempt(email, false);
                            reject(new Error('Invalid email or password.'));
                        }
                    }).catch(reject);
                });
            },
            register: function(email, password, name) {
                return new Promise((resolve, reject) => {
                    if (!email || !password || password.length < 6) {
                        reject(new Error('Password must be at least 6 characters.'));
                        return;
                    }
                    if (DB.getUserByEmail(email)) {
                        reject(new Error('Email already registered.'));
                        return;
                    }
                    const salt = generateSalt();
                    hashPassword(password, salt).then(hash => {
                        const user = {
                            id: U.id(),
                            email: email.toLowerCase(),
                            name: name || email.split('@')[0],
                            passwordHash: hash,
                            salt: salt,
                            profile_image: `https://ui-avatars.com/api/?name=${encodeURIComponent(name || email)}&background=4F7DF7&color=fff&size=128&bold=true`,
                            created_at: U.now()
                        };
                        DB.addUser(user);
                        setSession(user.id);
                        resolve(user);
                    }).catch(reject);
                });
            },
