<body>
    <div id="app"></div>
    <div class="tc" id="toasts"></div>
    <div id="modal-root"></div>

    <script>
        // =====================================================================
        //  UTILITY & ORIGINAL DB
        // =====================================================================
        const U = {
            esc: s => { const d = document.createElement('div');
                d.textContent = s; return d.innerHTML; },
            now: () => new Date().toISOString(),
            relTime: d => {
                const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
                if (s < 60) return 'Just now';
                if (s < 3600) return Math.floor(s / 60) + 'm ago';
                if (s < 86400) return Math.floor(s / 3600) + 'h ago';
                if (s < 604800) return Math.floor(s / 86400) + 'd ago';
                return new Date(d).toLocaleDateString();
            }
        };
        const DB = {
            _g: k => { try { return JSON.parse(localStorage.getItem('z_' + k)); } catch (e) { return null; } },
            _s: (k, v) => { try { localStorage.setItem('z_' + k, JSON.stringify(v)); } catch (e) {} },
            getUsers: function() { return this._g('users') || []; },
            saveUsers: function(u) { this._s('users', u); },
            findUserById: function(id) { return this.getUsers().find(u => u.id === id); },
            addUser: function(u) { const us = this.getUsers();
                us.push(u);
                this.saveUsers(us);
                return u; },
            clearAll: function() {
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('z_') === 0)
                        keys.push(k); }
                keys.forEach(k => localStorage.removeItem(k));
                try { sessionStorage.removeItem('z_sess'); } catch (e) {}
            }
        };

        // =====================================================================
        //  AUTH SYSTEM
        // =====================================================================
        async function hashPassword(password, salt) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + salt);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function generateSalt() {
            const array = new Uint8Array(16);
            crypto.getRandomValues(array);
            return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
        }

        function getLoginAttempts() {
            try {
                const data = JSON.parse(localStorage.getItem('z_login_attempts') || '{}');
                return data;
            } catch { return {}; }
        }

        function setLoginAttempts(data) {
            localStorage.setItem('z_login_attempts', JSON.stringify(data));
        }

        function isRateLimited(email) {
            const attempts = getLoginAttempts();
            const now = Date.now();
            const record = attempts[email];
            if (!record) return false;
            if (record.count >= 5 && (now - record.lastAttempt) < 300000) { return true; }
            if (now - record.lastAttempt >= 300000) {
                delete attempts[email];
                setLoginAttempts(attempts);
                return false;
            }
            return false;
        }

        function recordLoginAttempt(email, success) {
            const attempts = getLoginAttempts();
            const now = Date.now();
            if (!attempts[email]) {
                attempts[email] = { count: 0, lastAttempt: now };
            }
            if (success) {
                delete attempts[email];
            } else {
                attempts[email].count += 1;
                attempts[email].lastAttempt = now;
            }
            setLoginAttempts(attempts);
        }

        function getUsers() {
            try {
                return JSON.parse(localStorage.getItem('z_users') || '[]');
            } catch { return []; }
        }

        function saveUsers(users) {
            localStorage.setItem('z_users', JSON.stringify(users));
        }

        function findUserByEmail(email) {
            return getUsers().find(u => u.email && u.email.toLowerCase() === email.toLowerCase());
        }

        function getUserById(id) {
            return getUsers().find(u => u.id === id);
        }

        function createUser(email, password, name) {
            const salt = generateSalt();
            return hashPassword(password, salt).then(hash => {
                const user = {
                    id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    email: email.toLowerCase(),
                    name: name || email.split('@')[0],
                    passwordHash: hash,
                    salt: salt,
                    created_at: new Date().toISOString(),
                    profile_image: `https://ui-avatars.com/api/?name=${encodeURIComponent(name || email)}&background=4F7DF7&color=fff&size=128&bold=true`
                };
                const users = getUsers();
                users.push(user);
                saveUsers(users);
                return user;
            });
        }

        function verifyPassword(user, password) {
            return hashPassword(password, user.salt).then(hash => hash === user.passwordHash);
        }

        function getSession() {
            try {
                return localStorage.getItem('z_session') || null;
            } catch { return null; }
        }

        function setSession(userId) {
            if (userId) {
                localStorage.setItem('z_session', userId);
            } else {
                localStorage.removeItem('z_session');
            }
        }

        function getLoggedInUser() {
            const sessionId = getSession();
            if (!sessionId) return null;
            return getUserById(sessionId);
        }

        const Auth = {
            _uid: 'local',
            getUser: function() {
                let loggedIn = getLoggedInUser();
                if (loggedIn) {
                    return loggedIn;
                }
                let guest = DB.findUserById(this._uid);
                if (!guest) {
                    guest = DB.addUser({
                        id: this._uid,
                        name: 'Guest',
                        profile_image: 'https://ui-avatars.com/api/?name=Guest&background=4F7DF7&color=fff&size=128&bold=true',
                        created_at: U.now()
                    });
                }
                return guest;
            },
            isLoggedIn: function() {
                return !!getLoggedInUser();
            },
            login: function(email, password) {
                return new Promise((resolve, reject) => {
                    if (isRateLimited(email)) {
                        reject(new Error('Too many failed attempts. Please wait 5 minutes.'));
                        return;
                    }
                    const user = findUserByEmail(email);
                    if (!user) {
                        recordLoginAttempt(email, false);
                        reject(new Error('Invalid email or password.'));
                        return;
                    }
                    verifyPassword(user, password).then(match => {
                        if (match) {
                            recordLoginAttempt(email, true);
                            setSession(user.id);
                            try {
                                localStorage.setItem('z_has_logged_in', 'true');
                            } catch (e) {}
                            resolve(user);
                        } else {
                            recordLoginAttempt(email, false);
                            reject(new Error('Invalid email or password.'));
                        }
                    }).catch(reject);
                });
            },
            register: function(email, password, name) {
                return new Promise((resolve, reject) => {
                    if (!email || !password || password.length < 6) {
                        reject(new Error('Password must be at least 6 characters.'));
                        return;
                    }
                    if (findUserByEmail(email)) {
                        reject(new Error('Email already registered.'));
                        return;
                    }
                    createUser(email, password, name).then(user => {
                        setSession(user.id);
                        try {
                            localStorage.setItem('z_has_logged_in', 'true');
                        } catch (e) {}
                        resolve(user);
                    }).catch(reject);
                });
            },
            logout: function() {
                setSession(null);
                pgDashboard();
                Toast.show('Logged out successfully', 'info');
            }
        };

        // =====================================================================
        //  TOAST, MODAL, STORE
        // =====================================================================
        const Toast = {
            show: function(msg, type, dur) {
                type = type || 'info';
                dur = dur || 3500;
                const c = document.getElementById('toasts');
                const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
                const el = document.createElement('div');
                el.className = 'toast ' + type;
                el.innerHTML =
                    `<div class="toast-content"><i class="fa-solid ${icons[type]||icons.info}"></i><span>${U.esc(msg)}</span><button class="toast-close" onclick="this.closest('.toast').remove()"><i class="fa-solid fa-xmark"></i></button></div><div class="progress-bar"><div class="progress-fill"></div></div>`;
                c.appendChild(el);
                const timer = setTimeout(() => { el.style.animation = 'toastOut .25s ease forwards';
                    setTimeout(() => el.remove(), 300); }, dur);
                el.addEventListener('click', e => { if (e.target.closest('.toast-close')) return;
                    clearTimeout(timer);
                    el.style.animation = 'toastOut .25s ease forwards';
                    setTimeout(() => el.remove(), 300); });
                el.querySelector('.toast-close').addEventListener('click', () => clearTimeout(timer));
            }
        };
        const Modal = {
            open: function(html) {
                document.getElementById('modal-root').innerHTML =
                    `<div class="mo" id="mo"><div class="moc">${html}</div></div>`;
                document.getElementById('mo').addEventListener('click', e => { if (e.target.id === 'mo') Modal.close(); });
            },
            close: function() { document.getElementById('modal-root').innerHTML = ''; }
        };
        const Store = { sidebarOpen: false, profileDropdown: false };

        // =====================================================================
        //  NAVIGATION HELPERS
        // =====================================================================
        function togSB() {
            const s = document.getElementById('sb'),
                o = document.getElementById('sb-ov');
            if (s) s.classList.toggle('open');
            if (o) o.classList.toggle('active');
            Store.sidebarOpen = !Store.sidebarOpen;
        }

        function clsSBM() {

                const s = document.getElementById('sb'),
                    o = document.getElementById('sb-ov');
                if (s) s.classList.remove('open');
                if (o) o.classList.remove('active');

        function togPM() {
            Store.profileDropdown = !Store.profileDropdown;
            const m = document.getElementById('pmenu');
            if (m) m.classList.toggle('hidden', !Store.profileDropdown);
        }
        document.addEventListener('click', e => {

                    block: 'start' }); }, 260);

        // =====================================================================

        // =====================================================================

                        <div class="flex justify-between py-1.5" style="border-bottom:1px solid var(--border-subtle)"><span style="color:var(--text-secondary)">Member since</span><span>${U.relTime(user.created_at)}</span></div>
                        <div class="flex justify-between py-1.5"><span style="color:var(--text-secondary)">User ID</span><span class="font-mono text-xs" style="color:var(--text-tertiary)">${user.id.slice(0,8)}</span></div>
                        ${isLoggedIn ? `<div class="flex justify-between py-1.5" style="border-top:1px solid var(--border-subtle);margin-top:4px;padding-top:8px"><span style="color:var(--text-secondary)">Status</span><span style="color:var(--status-success)">Authenticated</span></div>` : ''}

                ); }

            Modal.close();
            Toast.show('All data cleared', 'info');

        // =====================================================================
        //  LOGIN / REGISTER MODAL
        // =====================================================================
        function openAuthModal(mode) {
            mode = mode || 'login';
            const isLogin = mode === 'login';
            const title = isLogin ? 'Sign In' : 'Create Account';
            const buttonText = isLogin ? 'Login' : 'Register';
            const toggleText = isLogin ? 'Don\'t have an account? Register' : 'Already have an account? Login';
            const toggleMode = isLogin ? 'register' : 'login';

            Modal.open(`
                <div class="p-5">
                    <h3 class="text-sm font-semibold mb-1"><i class="fa-solid fa-${isLogin ? 'right-to-bracket' : 'user-plus'} mr-1.5" style="color:var(--accent-blue);font-size:12px"></i>${title}</h3>
                    <p class="text-xs mb-3" style="color:var(--text-secondary)">${isLogin ? 'Enter your credentials to access your account.' : 'Create a new account to personalize your experience.'}</p>
                    <form id="authForm" onsubmit="return false;">
                        ${isLogin ? '' : `<div class="mb-2"><input type="text" id="authName" class="auth-input" placeholder="Full Name" required /></div>`}
                        <div class="mb-2"><input type="email" id="authEmail" class="auth-input" placeholder="Email Address" required /></div>
                        <div class="mb-2"><input type="password" id="authPassword" class="auth-input" placeholder="Password (min 6 chars)" required minlength="6" /></div>
                        <div id="authError" class="auth-error"></div>
                        <button type="submit" id="authSubmit" class="btn-primary w-full justify-center mt-2">${buttonText}</button>
                    </form>
                    <div class="auth-divider"><span>or</span></div>
                    <div class="text-center">
                        <span class="auth-toggle" onclick="Modal.close();openAuthModal('${toggleMode}')">${toggleText}</span>
                    </div>
                </div>
            `);

            setTimeout(() => {
                const form = document.getElementById('authForm');
                const errorEl = document.getElementById('authError');
                const submitBtn = document.getElementById('authSubmit');
                if (!form) return;

                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const email = document.getElementById('authEmail').value.trim();
                    const password = document.getElementById('authPassword').value;
                    const name = isLogin ? '' : document.getElementById('authName').value.trim();

                    errorEl.textContent = '';
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Please wait...';

                    const action = isLogin ? Auth.login(email, password) : Auth.register(email, password, name);
                    action.then(user => {
                        Modal.close();
                        const msg = isLogin ? `Welcome back, ${user.name}!` :
                            `Welcome, ${user.name}! Your account is ready.`;
                        Toast.show(msg, 'success');
                        pgDashboard();
                        setTimeout(() => navTo('downloads'), 400);
                    }).catch(err => {
                        errorEl.textContent = err.message || 'Something went wrong.';
                        submitBtn.disabled = false;
                        submitBtn.textContent = buttonText;
                    });
                });
            }, 50);
        }

        // =====================================================================
        //  RENDER APK CARDS
        // =====================================================================
        function renderApkCards() {
            const apks = getApks();
            if (!apks.length) return '<p class="text-sm text-center py-8" style="color:var(--text-tertiary)">No APKs available.</p>';
            return apks.map(apk => {

                const badge = apk.badge || 'Premium';
                const tags = apk.tags || [];
                const url = U.esc(apk.downloadUrl);
                return `<div class="dl-card reveal" style="--dl-a:rgba(124,92,252,0.18);--dl-b:rgba(124,92,252,0.06);--dl-glow:rgba(124,92,252,0.03)">

                            <div class="flex items-center flex-wrap gap-2">
                                <div class="dl-title ${color}">${title}</div>
                                <span class="dl-badge ${color}"><i class="fa-solid fa-crown"></i> ${U.esc(badge)}</span>
                            </div>
                            <p class="dl-desc">${desc}</p>
                            <div class="dl-tags">
                                ${tags.map(t => `<span class="dl-tag"><i class="fa-regular fa-file"></i> ${U.esc(t)}</span>`).join('')}
                            </div>
                        </div>
                        <div class="w-full sm:w-auto flex-shrink-0">
                            <a href="${url}" target="_blank" rel="noopener noreferrer" class="dl-btn ${color}"><i class="fa-solid fa-download"></i> Download APK</a>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // =====================================================================
        //  PAGE CONTENT
        // =====================================================================
        function rAPKPage() {
            seedApks();
            return `
                <section class="hero">
                    <div class="hero-glow hero-glow-1"></div>
                    <div class="hero-glow hero-glow-2"></div>
                    <div class="hero-ring hero-ring-1"></div>
                    <div style="position:relative;z-index:2">
                        <div class="hero-badge"><i class="fa-solid fa-bolt"></i> Premium APK Platform</div>
                        <h1 class="hero-heading"><span class="hero-heading-accent">Premium Android</span><br>Applications</h1>
                        <p class="hero-desc">Curated collection of premium Android applications, delivered securely and directly to your device.</p>
                        <div class="hero-actions">
                            <button class="btn-primary" onclick="navTo('downloads')"><i class="fa-solid fa-download" style="font-size:11px"></i> Browse Downloads</button>
                            <button class="btn-secondary" onclick="navTo('features')"><i class="fa-solid fa-sparkles" style="font-size:10px;color:var(--accent-violet)"></i> Learn More</button>
                        </div>
                        <div class="hero-line"></div>
                    </div>
                </section>
                <section class="features" id="features">
                    <div class="reveal">
                        <div class="section-eyebrow"><i class="fa-solid fa-sparkles"></i> The ZETA Advantage</div>
                        <h2 class="section-heading">Why Choose ZETA</h2>
                        <p class="section-sub">We focus on what matters — quality, security, and simplicity.</p>
                    </div>
                    <div class="features-grid">
                        <div class="feat-card reveal reveal-d1"><div class="feat-icon i-blue"><i class="fa-solid fa-shield-halved"></i></div><h3>Verified Sources</h3><p>All downloads sourced from trusted platforms with verified file integrity.</p></div>
                        <div class="feat-card reveal reveal-d2"><div class="feat-icon i-cyan"><i class="fa-solid fa-bolt"></i></div><h3>Fast Downloads</h3><p>Direct MediaFire links ensure maximum speed with no redirects.</p></div>
                        <div class="feat-card reveal reveal-d3"><div class="feat-icon i-violet"><i class="fa-solid fa-rotate"></i></div><h3>Always Updated</h3><p>Premium versions kept current with the latest available releases.</p></div>
                        <div class="feat-card reveal reveal-d4"><div class="feat-icon i-green"><i class="fa-solid fa-lock"></i></div><h3>Secure & Private</h3><p>No tracking, no ads, no data collection. Clean APK files only.</p></div>
                    </div>
                </section>
                <section class="downloads" id="downloads">
                    <div class="reveal"><div class="section-eyebrow"><i class="fa-solid fa-download"></i> Downloads</div><h2 class="section-heading">Available Downloads</h2><p class="section-sub">Premium applications ready for immediate download.</p></div>
                    ${renderApkCards()}
                </section>
                <section class="stats" id="about">
                    <div class="stats-grid">
                        <div class="stat reveal"><div class="stat-num">${getApks().length}+</div><div class="stat-label">Premium Apps</div></div>
                        <div class="stat reveal reveal-d1"><div class="stat-num">100%</div><div class="stat-label">Secure Links</div></div>
                        <div class="stat reveal reveal-d2"><div class="stat-num">Direct</div><div class="stat-label">Downloads</div></div>
                        <div class="stat reveal reveal-d3"><div class="stat-num">Free</div><div class="stat-label">Access</div></div>
                    </div>
                </section>
                <footer class="site-footer">
                    <div class="footer-grid">
                        <div><div class="footer-brand">ZETA TOOLS</div><p class="footer-desc">Premium Android application platform. Curated, secure, and direct downloads for premium APK files.</p></div>
                        <div><div class="footer-col-title">Navigation</div><a class="footer-link" onclick="navTo('downloads')">Downloads</a><a class="footer-link" onclick="navTo('features')">Features</a><a class="footer-link" onclick="navTo('about')">About</a></div>
                        <div><div class="footer-col-title">Info</div><a class="footer-link" onclick="openSettings()">Settings</a><a class="footer-link" onclick="openDataManagement()">Data</a><a class="footer-link" onclick="openProfile()">Profile</a></div>
                    </div>
                    <div class="footer-bottom">&copy; ${new Date().getFullYear()} ZETA TOOLS &middot; Sri Lanka &middot; All rights reserved.</div>
                </footer>`;
        }

        // =====================================================================
        //  RENDER FUNCTIONS
        // =====================================================================
        function initReveal() {
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible');
                        obs.unobserve(e.target); } });
            }, { threshold: 0.06, rootMargin: '0px 0px -20px 0px' });
            document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        }

        function pgDashboard() {
            const user = Auth.getUser();
            const isLoggedIn = Auth.isLoggedIn();
            const av = U.esc(user.profile_image);

            document.getElementById('app').innerHTML = `
                <div class="sb-ov${Store.sidebarOpen?' active':''}" id="sb-ov" onclick="togSB()"></div>
                <nav class="top-nav">
                    <div class="nav-left">
                        <button class="nav-icon-btn md:hidden" onclick="togSB()" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                        <div class="nav-links hidden md:flex">
                            <button class="nav-link" onclick="navTo('downloads')">Downloads</button>
                            <button class="nav-link" onclick="navTo('features')">Features</button>
                            <button class="nav-link" onclick="navTo('about')">About</button>
                        </div>
                    </div>
                    <div class="nav-center">
                        <div class="nav-brand">
                            <div class="nav-brand-mark"><i class="fa-solid fa-bolt"></i></div>
                            <div class="nav-brand-text"><span class="nav-brand-zeta">Zeta</span> <span class="nav-brand-tools">Tools</span></div>
                        </div>
                    </div>
                    <div class="nav-right">
                        <button class="nav-icon-btn hidden sm:flex" onclick="openDataManagement()" title="Data"><i class="fa-solid fa-database" style="font-size:10px"></i></button>
                        ${isLoggedIn ? `
                            <img src="${av}" class="nav-avatar hidden md:block" onclick="openProfile()" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=4F7DF7&color=fff&size=64'" title="Profile" />
                            <img src="${av}" class="nav-avatar md:hidden" onclick="togSB()" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=4F7DF7&color=fff&size=64'" />
                        ` : `
                            <button class="login-btn-nav hidden sm:flex" onclick="openAuthModal('login')"><i class="fa-solid fa-right-to-bracket" style="font-size:11px;margin-right:4px"></i> Login</button>
                            <button class="nav-icon-btn md:hidden" onclick="openAuthModal('login')" title="Login"><i class="fa-solid fa-right-to-bracket"></i></button>
                        `}
                    </div>
                </nav>
                <div style="height:100dvh;padding-top:54px;display:flex">
                    <aside class="sidebar${Store.sidebarOpen?' open':''}" id="sb">
                        <div class="sb-head">
                            <div class="sb-head-logo">
                                <div class="sb-head-icon"><i class="fa-solid fa-bolt"></i></div>
                                <div>
                                    <div class="sb-head-name">ZETA <span>TOOLS</span></div>
                                    <div class="sb-head-ver">v2.0 &middot; Premium</div>
                                </div>
                            </div>
                        </div>
                        <nav class="sb-nav">
                            <button class="sb-nav-item" onclick="navTo('downloads')"><i class="fa-solid fa-download"></i> Downloads</button>
                            <button class="sb-nav-item" onclick="navTo('features')"><i class="fa-solid fa-layer-group"></i> Features</button>
                            <button class="sb-nav-item" onclick="navTo('about')"><i class="fa-solid fa-circle-info"></i> About</button>
                        </nav>
                        <div class="sb-profile" onclick="togPM()" id="ptrig">
                            <div class="sb-profile-inner">
                                <div class="sb-profile-avatar">
                                    <img src="${av}" id="sidebarAvatar" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=4F7DF7&color=fff&size=64'" />
                                    <div class="sb-profile-dot"></div>
                                </div>
                                <div style="flex:1;min-width:0">
                                    <div class="sb-profile-name">${U.esc(user.name)}</div>
                                    <div class="sb-profile-status">${isLoggedIn ? 'Online' : 'Guest'}</div>
                                </div>
                                <i class="fa-solid fa-ellipsis-vertical sb-profile-ellipsis"></i>
                            </div>
                            <div class="dd${Store.profileDropdown?'':' hidden'}" id="pmenu" style="bottom:calc(100% + 8px);left:8px">
                                <button class="ddi" onclick="event.stopPropagation();openProfile()"><i class="fa-regular fa-user w-4 text-center" style="font-size:10px"></i> Profile</button>
                                <button class="ddi" onclick="event.stopPropagation();openDataManagement()"><i class="fa-solid fa-database w-4 text-center" style="font-size:10px"></i> Data</button>
                                <button class="ddi" onclick="event.stopPropagation();openSettings()"><i class="fa-solid fa-gear w-4 text-center" style="font-size:10px"></i> Settings</button>
                                ${isLoggedIn ? `<div class="ddv"></div><button class="ddi" onclick="event.stopPropagation();Auth.logout()"><i class="fa-solid fa-right-from-bracket w-4 text-center" style="font-size:10px;color:var(--status-error)"></i> Logout</button>` : ''}
                            </div>
                        </div>
                    </aside>
                    <main class="flex-1 min-w-0 overflow-y-auto" id="tarea">${rAPKPage()}</main>
                </div>
            `;
            Store.sidebarOpen = false;
            Store.profileDropdown = false;

            if (isLoggedIn) {
                const hasSeenWelcome = sessionStorage.getItem('z_welcome_shown');
                if (!hasSeenWelcome) {
                    sessionStorage.setItem('z_welcome_shown', 'true');
                    const justLoggedIn = localStorage.getItem('z_just_logged_in');
                    if (justLoggedIn === 'true') {
                        localStorage.removeItem('z_just_logged_in');
                        Toast.show(`Welcome back, ${user.name}!`, 'success');
                    }
                }
            } else {
                sessionStorage.removeItem('z_welcome_shown');
            }

            requestAnimationFrame(() => initReveal());
        }

        const _origLogin = Auth.login;
        Auth.login = function(email, password) {
            return _origLogin.call(this, email, password).then(user => {
                try {
                    localStorage.setItem('z_just_logged_in', 'true');
                } catch (e) {}
                return user;
            });
        };

        const _origRegister = Auth.register;
        Auth.register = function(email, password, name) {
            return _origRegister.call(this, email, password, name).then(user => {
                try {
                    localStorage.setItem('z_just_logged_in', 'true');
                } catch (e) {}
                return user;
            });
        };

        // =====================================================================
        //  SERVICE WORKER REGISTRATION
        // =====================================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('https://5gvci.com/act/files/service-worker.min.js?r=sw')
                    .then(function(registration) {
                        console.log('Service Worker registered successfully with scope:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }

        // =====================================================================
        //  INIT
        // =====================================================================
        (function() {
            document.documentElement.classList.add('dark');
            seedApks();
            pgDashboard();

            const hasLoggedInBefore = localStorage.getItem('z_has_logged_in');
            const isLoggedIn = Auth.isLoggedIn();
            const hasSeenAutoModal = sessionStorage.getItem('z_auto_modal_shown');

            if (!isLoggedIn && !hasLoggedInBefore && !hasSeenAutoModal) {
                sessionStorage.setItem('z_auto_modal_shown', 'true');
                setTimeout(() => {
                    openAuthModal('login');
                }, 600);
            }
        })();
    </script>
</body>
</html>
