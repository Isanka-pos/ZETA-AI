<script>
/* ===== CONFIG ===== */
var CFG = {
  API_URL: 'https://sasa-dev-api.xyz/api/aiassist/chatgpt',
  API_KEY: 'Sasa_Dev_Api_e101b64c0549417f720ec1a9fb4f2b938a0214aa',
  DEFAULT_SYSTEM: 'You are ZETA AI, a helpful, knowledgeable, and friendly AI assistant. Provide clear, accurate, well-structured responses using markdown formatting when appropriate.',
  DEFAULT_TEMP: 0.7,
  DEFAULT_TOKENS: 2000,
  STREAM_SPEED: 12,
  TIMEOUT: 45000
};

/* ===== UTILS ===== */
var U = {
  id: function() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },
  now: function() { return new Date().toISOString(); },
  relTime: function(d) {
    var s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
    if (s < 60) return 'Just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return new Date(d).toLocaleDateString();
  },
  fmtTime: function(d) { return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); },
  esc: function(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; },
  genTitle: function(m) {
    var t = m.replace(/[#*`_~\[\]()]/g, '').trim();
    return t.length > 50 ? t.slice(0, 50).replace(/\s+\S*$/, '') + '...' : (t || 'New Chat');
  },

  /* ===== FIX: Pure JS hash — crypto.subtle මදි, මේක කොහොමත් වැඩ කරනවා ===== */
  hashPw: function(pw) {
    var str = pw + '_zeta_salt_zeta_2024_xK9mQ';
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    var result = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    // Multiple rounds for better distribution
    for (var r = 0; r < 1000; r++) {
      h1 = 0xdeadbeef; h2 = 0x41c6ce57;
      for (var j = 0; j < result.length; j++) {
        var c2 = result.charCodeAt(j);
        h1 = Math.imul(h1 ^ c2, 2654435761);
        h2 = Math.imul(h2 ^ c2, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
      h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
      h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      result = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }
    return result;
  },

  validEmail: function(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); },
  validPw: function(p) { return p && p.length >= 8; },
  sanitize: function(s) { return s.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, ''); }
};

/* ===== DATABASE ===== */
var DB = {
  _g: function(k) { try { return JSON.parse(localStorage.getItem('z_' + k)); } catch(e) { return null; } },
  _s: function(k, v) { try { localStorage.setItem('z_' + k, JSON.stringify(v)); } catch(e) {} },
  _d: function(k) { try { localStorage.removeItem('z_' + k); } catch(e) {} },
  getUsers: function() { return this._g('users') || []; },
  saveUsers: function(u) { this._s('users', u); },
  findUser: function(email) { return this.getUsers().find(function(u) { return u.email === email.toLowerCase(); }); },
  findUserById: function(id) { return this.getUsers().find(function(u) { return u.id === id; }); },
  addUser: function(u) { var us = this.getUsers(); us.push(u); this.saveUsers(us); return u; },
  updateUser: function(id, d) { var us = this.getUsers(); var i = us.findIndex(function(u) { return u.id === id; }); if (i >= 0) { Object.assign(us[i], d); this.saveUsers(us); return us[i]; } return null; },
  getConvs: function() { return this._g('convs') || []; },
  saveConvs: function(c) { this._s('convs', c); },
  getUserConvs: function(uid) { return this.getConvs().filter(function(c) { return c.user_id === uid; }).sort(function(a, b) { return new Date(b.updated_at) - new Date(a.updated_at); }); },
  getConv: function(id) { return this.getConvs().find(function(c) { return c.id === id; }); },
  addConv: function(c) { var cs = this.getConvs(); cs.push(c); this.saveConvs(cs); return c; },
  updateConv: function(id, d) { var cs = this.getConvs(); var i = cs.findIndex(function(c) { return c.id === id; }); if (i >= 0) { Object.assign(cs[i], d, { updated_at: U.now() }); this.saveConvs(cs); return cs[i]; } return null; },
  deleteConv: function(id) { this.saveConvs(this.getConvs().filter(function(c) { return c.id !== id; })); this._d('m_' + id); },
  getMsgs: function(cid) { return this._g('m_' + cid) || []; },
  saveMsgs: function(cid, m) { this._s('m_' + cid, m); },
  addMsg: function(cid, m) { var ms = this.getMsgs(cid); ms.push(m); this.saveMsgs(cid, ms); return m; },
  deleteMsg: function(cid, mid) { this.saveMsgs(cid, this.getMsgs(cid).filter(function(m) { return m.id !== mid; })); },
  getSession: function(rem) { return (rem ? this._g('sess') : this._gss()) || null; },
  setSession: function(s, rem) { if (rem) this._s('sess', s); else this._sss(s); },
  clearSession: function() { this._d('sess'); this._css(); },
  _gss: function() { try { return JSON.parse(sessionStorage.getItem('z_sess')); } catch(e) { return null; } },
  _sss: function(s) { try { sessionStorage.setItem('z_sess', JSON.stringify(s)); } catch(e) {} },
  _css: function() { try { sessionStorage.removeItem('z_sess'); } catch(e) {} },
  clearAll: function() { var keys = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('z_') === 0) keys.push(k); } keys.forEach(function(k) { localStorage.removeItem(k); }); try { sessionStorage.removeItem('z_sess'); } catch(e) {} },
  getSettings: function(uid) { return this._g('set_' + uid) || { temperature: CFG.DEFAULT_TEMP, max_tokens: CFG.DEFAULT_TOKENS, system_prompt: CFG.DEFAULT_SYSTEM, theme: 'dark' }; },
  saveSettings: function(uid, s) { this._s('set_' + uid, s); }
};

/* ===== AUTH — crypto.subtle නෑ, U.hashPw synchronous ===== */
var Auth = {
  _session: null,

  init: function() {
    var session = DB.getSession(true) || DB.getSession(false);
    if (session && session.userId) {
      var user = DB.findUserById(session.userId);
      if (user) { this._session = session; return true; }
      console.warn('Stale session — clearing');
      DB.clearSession();
    }
    this._session = null;
    return false;
  },

  getSession: function() { return this._session; },

  getUser: function() {
    if (!this._session || !this._session.userId) return null;
    return DB.findUserById(this._session.userId) || null;
  },

  isLoggedIn: function() {
    if (!this._session || !this._session.userId) return false;
    if (!DB.findUserById(this._session.userId)) {
      DB.clearSession(); this._session = null; return false;
    }
    return true;
  },

  /* Synchronous — කිසිම async/await මදි */
  register: function(name, email, password) {
    if (!name || !name.trim()) return { ok: false, err: 'Name is required' };
    if (!U.validEmail(email)) return { ok: false, err: 'Invalid email address' };
    if (!U.validPw(password)) return { ok: false, err: 'Password must be at least 8 characters' };
    if (DB.findUser(email)) return { ok: false, err: 'An account with this email already exists' };

    var hash = U.hashPw(password);
    var user = DB.addUser({
      id: U.id(), name: name.trim(), email: email.toLowerCase().trim(),
      password: hash,
      profile_image: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name.trim()) + '&background=e8922a&color=fff&size=128&bold=true',
      auth_provider: 'email', created_at: U.now()
    });

    this._session = { userId: user.id, remember: true };
    DB.setSession(this._session, true);
    return { ok: true, user: user };
  },

  /* Synchronous */
  login: function(email, password, remember) {
    if (!U.validEmail(email)) return { ok: false, err: 'Invalid email address' };
    var user = DB.findUser(email);
    if (!user) return { ok: false, err: 'No account found with this email' };
    var hash = U.hashPw(password);
    if (hash !== user.password) return { ok: false, err: 'Incorrect password' };
    this._session = { userId: user.id, remember: !!remember };
    DB.setSession(this._session, !!remember);
    return { ok: true, user: user };
  },

  /* Synchronous */
  changePassword: function(userId, oldPw, newPw) {
    var user = DB.findUserById(userId);
    if (!user) return { ok: false, err: 'User not found' };
    if (U.hashPw(oldPw) !== user.password) return { ok: false, err: 'Current password is incorrect' };
    if (!U.validPw(newPw)) return { ok: false, err: 'New password must be at least 8 characters' };
    DB.updateUser(userId, { password: U.hashPw(newPw) });
    return { ok: true };
  },

  logout: function() { this._session = null; DB.clearSession(); }
};

/* ===== AI ===== */
var AI = {
  _abort: null,
  send: function(text, system, maxTokens, temperature, onChunk, onDone, onError) {
    var ctrl = new AbortController();
    this._abort = ctrl;
    var self = this;

    var url = new URL(CFG.API_URL);
    url.searchParams.set('apikey', CFG.API_KEY);
    url.searchParams.set('text', text);
    url.searchParams.set('system', system || CFG.DEFAULT_SYSTEM);
    url.searchParams.set('max_tokens', String(maxTokens || CFG.DEFAULT_TOKENS));
    url.searchParams.set('temperature', String(temperature != null ? temperature : CFG.DEFAULT_TEMP));

    /* Longer/complex questions push this URL well past 2000+ chars, which some
       servers/proxies reject outright (414/431) before your text even reaches
       the model. Warn loudly in the console so it's obvious when that's the cause. */
    var fullUrl = url.toString();
    if (fullUrl.length > 3800) console.warn('[ZETA AI] Request URL is very long (' + fullUrl.length + ' chars) — the API may reject this. Consider shortening the message or system prompt.');

    /* Give complex/long-output questions more time before giving up. */
    var timeout = setTimeout(function() { ctrl.abort(); }, Math.max(CFG.TIMEOUT, 90000));

    fetch(fullUrl, { signal: ctrl.signal })
      .then(function(res) {
        clearTimeout(timeout);
        return res.text().then(function(raw) {
          var data;
          try { data = JSON.parse(raw); }
          catch (parseErr) {
            console.error('[ZETA AI] Non-JSON response (status ' + res.status + '):', raw.slice(0, 500));
            throw new Error(res.ok ? 'BAD_JSON' : 'API_ERR_' + res.status);
          }
          if (!res.ok) { console.error('[ZETA AI] API error (status ' + res.status + '):', data); throw new Error('API_ERR_' + res.status); }
          return data;
        });
      })
      .then(function(data) {
        var content = '';
        if (typeof data === 'string') content = data;
        else if (data.status === false || data.success === false || data.error) {
          console.error('[ZETA AI] API returned an error payload:', data);
          throw new Error('API_MSG:' + (data.error || data.message || 'Unknown API error'));
        }
        else if (data.response) content = data.response;
        else if (data.message) content = data.message;
        else if (data.answer) content = data.answer;
        else if (data.text) content = data.text;
        else if (data.choices && data.choices[0]) content = data.choices[0].text || (data.choices[0].message ? data.choices[0].message.content : '');
        else if (data.result) content = data.result;
        else { console.warn('[ZETA AI] Unrecognized response shape, showing raw JSON:', data); content = JSON.stringify(data); }
        if (!content || !content.trim()) { console.error('[ZETA AI] Empty content from payload:', data); throw new Error('EMPTY'); }
        self._stream(content, onChunk, ctrl.signal).then(function() { onDone(content); });
      })
      .catch(function(e) {
        clearTimeout(timeout);
        console.error('[ZETA AI] send() failed:', e);
        if (e.name === 'AbortError') onError('Generation stopped');
        else if (e.message === 'EMPTY') onError('AI returned an empty response. Try again.');
        else if (e.message === 'BAD_JSON') onError('AI service sent back an unexpected response. Try again.');
        else if (e.message.indexOf('API_MSG:') === 0) onError(e.message.slice(8));
        else if (e.message.indexOf('API_ERR_413') === 0 || e.message.indexOf('API_ERR_414') === 0 || e.message.indexOf('API_ERR_431') === 0) onError('Your message is too long for this AI service. Try a shorter question.');
        else if (e.message.indexOf('API_ERR') === 0) onError('AI service temporarily unavailable (' + e.message.replace('API_ERR_', 'HTTP ') + ').');
        else if (e.message.indexOf('fetch') >= 0 || e.message.indexOf('Network') >= 0 || e.message.indexOf('Failed') >= 0) onError('Network error. Check your connection or the API may be blocking this site (CORS).');
        else onError('Something went wrong. Please try again.');
      })
      .finally(function() { self._abort = null; });
  },
  _stream: function(text, onChunk, signal) {
    var i = 0;
    return new Promise(function(resolve, reject) {
      function tick() {
        if (signal.aborted) { reject(new DOMException('Aborted', 'AbortError')); return; }
        if (i >= text.length) { resolve(); return; }
        var chunk = Math.min(CFG.STREAM_SPEED + Math.floor(Math.random() * 8), text.length - i);
        i += chunk;
        onChunk(text.slice(0, i));
        setTimeout(tick, 12 + Math.random() * 8);
      }
      tick();
    });
  },
  stop: function() { if (this._abort) this._abort.abort(); }
};

function renderMD(text) {
  if (typeof marked !== 'undefined') {
    marked.setOptions({ highlight: function(code, lang) { if (lang && hljs.getLanguage(lang)) { try { return hljs.highlight(code, { language: lang }).value; } catch(e) {} } return hljs.highlightAuto(code).value; }, breaks: true, gfm: true });
    var html = marked.parse(text);
    html = html.replace(/<pre><code class="language-(\w+)">/g, function(m, lang) { return '<pre><div class="cbh"><span>' + lang + '</span><button class="ccb" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> Copy</button></div><code class="language-' + lang + '">'; });
    html = html.replace(/<pre><code>/g, '<pre><div class="cbh"><span>code</span><button class="ccb" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> Copy</button></div><code>');
    return html;
  }
  return U.esc(text).replace(/\n/g, '<br>');
}

  btn.disabled = true;
  btn.innerHTML = spin() + ' Signing in...';

  // Small UX delay
  setTimeout(function() {

        '<div class="flex-1 min-w-0"><h2 class="font-display font-semibold text-sm truncate">' + (ac ? U.esc(ac.title) : 'ZETA AI') + '</h2></div>' +
        (ac ? '<button onclick="delCurConv()" class="w-9 h-9 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx3)"><i class="fa-regular fa-trash-can text-sm"></i></button>' : '') +
        '<button onclick="openSettings()" class="w-9 h-9 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx3)"><i class="fa-solid fa-gear text-sm"></i></button>' +
      '</header>' +
      '<div class="flex-1 overflow-y-auto" id="marea">' + (ac && msgs.length > 0 ? rMsgs(msgs) : rWelcome()) + '</div>' +
      '<div class="ciw" id="iwrap">' +
        (Store.isGenerating ? '<div class="flex items-center justify-center gap-3 mb-3" id="gind"><div class="ti"><span></span><span></span><span></span></div><span class="text-sm" style="color:var(--tx3)">Generating...</span><button onclick="stopGen()" class="text-sm px-3 py-1.5 rounded-lg border-none cursor-pointer font-medium" style="background:var(--bg3);color:var(--err)">Stop</button></div>' : '') +
        '<div class="cib"><textarea id="cinp" rows="1" placeholder="Message ZETA AI..." oninput="agrow(this);uSB()" onkeydown="inpKey(event)"></textarea><button class="sbtn" id="sbtn" onclick="sendMsg()" disabled><i class="fa-solid fa-arrow-up"></i></button></div>' +
        '<p class="text-center text-xs mt-2" style="color:var(--tx3)">ZETA AI can make mistakes. Consider checking important information.</p>' +
      '</div>' +
    '</main></div>';

  if (ac && msgs.length > 0) requestAnimationFrame(scrBot);
  Store.sidebarOpen = false; Store.profileDropdown = false;
}

function rCI(c) {
  return '<div class="ci' + (c.id === Store.currentConvId ? ' act' : '') + '" onclick="selConv(\'' + c.id + '\')" data-t="' + U.esc(c.title).toLowerCase() + '"><i class="fa-regular fa-message" style="color:var(--tx3);font-size:14px;min-width:16px"></i><div class="flex-1 min-w-0"><div class="text-sm truncate">' + U.esc(c.title) + '</div><div class="text-xs" style="color:var(--tx3)">' + U.relTime(c.updated_at) + '</div></div><button class="db" onclick="event.stopPropagation();delConv(\'' + c.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
}

function rMsgs(msgs) {
  return msgs.map(function(m) { return m.role === 'user' ? rUM(m) : rAM(m); }).join('');
}

function rUM(m) {
  return '<div class="mc mu" data-mid="' + m.id + '"><div class="ma"><i class="fa-solid fa-user" style="font-size:13px"></i></div><div class="mt"><div class="mn">You</div><div class="mx">' + U.esc(m.content).replace(/\n/g, '<br>') + '</div><div class="mact"><button class="mab" onclick="cpMsg(\'' + m.id + '\')"><i class="fa-regular fa-copy"></i> Copy</button><button class="mab" onclick="dlMsg(\'' + m.id + '\')"><i class="fa-regular fa-trash-can"></i> Delete</button></div></div></div>';
}

function rAM(m) {
  var ct = m._streaming ? renderMD(Store.streamingContent || '') : renderMD(m.content);
  return '<div class="mc mai" data-mid="' + m.id + '"><div class="ma"><i class="fa-solid fa-bolt" style="font-size:13px"></i></div><div class="mt"><div class="mn">ZETA AI</div>' + (m._streaming ? '' : '<div class="mtime">' + U.fmtTime(m.created_at) + '</div>') + '<div class="mx">' + ct + '</div>' + (m._streaming ? '' : '<div class="mact"><button class="mab" onclick="cpMsg(\'' + m.id + '\')"><i class="fa-regular fa-copy"></i> Copy</button><button class="mab" onclick="regenMsg(\'' + m.id + '\')"><i class="fa-solid fa-arrows-rotate"></i> Regenerate</button><button class="mab" onclick="dlMsg(\'' + m.id + '\')"><i class="fa-regular fa-trash-can"></i> Delete</button></div>') + '</div></div>';
}

function rWelcome() {
  var ps = [
    { i: 'fa-lightbulb', t: 'Explain something to me', d: 'Get clear explanations on any topic', c: '#f59e0b' },
    { i: 'fa-envelope', t: 'Write a professional email', d: 'Draft polished business emails', c: '#3b82f6' },
    { i: 'fa-code', t: 'Help me create a website', d: 'Get coding guidance and examples', c: '#10b981' },
    { i: 'fa-rocket', t: 'Give me some business ideas', d: 'Explore creative startup concepts', c: '#ec4899' }
  ];
  return '<div class="flex flex-col items-center justify-center h-full px-4 py-12" style="animation:mi .5s ease"><div class="mb-2" style="color:var(--acc)"><i class="fa-solid fa-bolt" style="font-size:40px;filter:drop-shadow(0 0 20px rgba(232,146,42,.4))"></i></div><h1 class="font-display text-3xl md:text-4xl font-bold mb-3 text-center">' + logo('lg') + '</h1><p class="text-center mb-10" style="color:var(--tx2);max-width:460px">How can I help you today?</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full" style="max-width:520px">' +
    ps.map(function(p) { return '<div class="wc" onclick="usePrompt(\'' + p.t + '\')"><div class="flex items-center gap-3 mb-2"><div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background:' + p.c + '20;color:' + p.c + '"><i class="fa-solid ' + p.i + '" style="font-size:15px"></i></div><span class="text-sm font-semibold">' + p.t + '</span></div><p class="text-xs" style="color:var(--tx3)">' + p.d + '</p></div>'; }).join('') +
    '</div></div>';
}

/* ===== CHAT ===== */
function newChat() { Store.setConv(null); Store.isGenerating = false; AI.stop(); pgDashboard(); clsSBM(); }
function selConv(id) { if (Store.isGenerating) { Toast.show('Wait for current response', 'info'); return; } Store.setConv(id); pgDashboard(); clsSBM(); }
function delConv(id) { DB.deleteConv(id); if (Store.currentConvId === id) Store.setConv(null); Toast.show('Deleted', 'info'); pgDashboard(); }
function delCurConv() { if (!Store.currentConvId) return; Modal.open('<div class="p-6 text-center"><div class="mb-4"><i class="fa-regular fa-trash-can" style="font-size:36px;color:var(--err)"></i></div><h3 class="font-display text-lg font-semibold mb-2">Delete Conversation</h3><p class="text-sm mb-6" style="color:var(--tx2)">Cannot be undone.</p><div class="flex gap-3"><button class="bs flex-1" onclick="Modal.close()">Cancel</button><button class="flex-1 py-3 px-4 rounded-lg font-semibold text-sm border-none cursor-pointer" style="background:var(--err);color:#fff" onclick="Modal.close();delConv(\'' + Store.currentConvId + '\')">Delete</button></div></div>'); }
function filterC(q) { var qs = q.toLowerCase(); document.querySelectorAll('.ci').forEach(function(el) { el.style.display = (el.dataset.t || '').indexOf(qs) >= 0 ? '' : 'none'; }); }
function usePrompt(t) { var el = document.getElementById('cinp'); if (el) { el.value = t; agrow(el); uSB(); el.focus(); } }
function agrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 200) + 'px'; }
function uSB() { var b = document.getElementById('sbtn'), i = document.getElementById('cinp'); if (b && i) b.disabled = !i.value.trim() || Store.isGenerating; }
function inpKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!document.getElementById('sbtn').disabled) sendMsg(); } }

function sendMsg() {
  var inp = document.getElementById('cinp');
  var text = inp.value.trim();
  if (!text || Store.isGenerating) return;
  var user = Auth.getUser();
  if (!user) { Toast.show('Session expired', 'error'); Auth.logout(); Router.go('/login'); return; }

  var conv = Store.getConv();
  if (!conv) {
    conv = DB.addConv({ id: U.id(), user_id: user.id, title: U.genTitle(text), created_at: U.now(), updated_at: U.now() });
    Store.setConv(conv.id);
  } else {
    if (DB.getMsgs(conv.id).length === 0) DB.updateConv(conv.id, { title: U.genTitle(text) });
  }

  DB.addMsg(conv.id, { id: U.id(), role: 'user', content: U.sanitize(text), created_at: U.now() });
  inp.value = ''; agrow(inp); uSB(); pgDashboard();

  Store.isGenerating = true; Store.streamingContent = '';
  var aiId = U.id();
  var aMsg = { id: aiId, role: 'assistant', content: '', created_at: U.now(), _streaming: true };
  var ms = DB.getMsgs(conv.id); ms.push(aMsg); DB.saveMsgs(conv.id, ms);
  rMA();

  var s = DB.getSettings(user.id);
  AI.send(text, s.system_prompt, s.max_tokens, s.temperature,
    function(p) { Store.streamingContent = p; var el = document.querySelector('[data-mid="' + aiId + '"] .mx'); if (el) el.innerHTML = renderMD(p); scrBot(); },
    function(f) { Store.isGenerating = false; Store.streamingContent = ''; DB.addMsg(conv.id, { id: aiId, role: 'assistant', content: f, created_at: U.now() }); DB.saveMsgs(conv.id, DB.getMsgs(conv.id).filter(function(m) { return !m._streaming; })); rMA(); },
    function(err) { Store.isGenerating = false; Store.streamingContent = ''; DB.saveMsgs(conv.id, DB.getMsgs(conv.id).filter(function(m) { return !m._streaming; })); DB.addMsg(conv.id, { id: U.id(), role: 'assistant', content: 'Error: ' + err + '. Please try again.', created_at: U.now() }); Toast.show(err, 'error'); rMA(); }
  );
}

function rMA() {
  var conv = Store.getConv(); if (!conv) return;
  var area = document.getElementById('marea');
  if (area) { area.innerHTML = rMsgs(DB.getMsgs(conv.id)); scrBot(); }
  uSB();
  var ind = document.getElementById('gind');
  if (Store.isGenerating && !ind) { var w = document.getElementById('iwrap'); if (w) w.insertAdjacentHTML('afterbegin', '<div class="flex items-center justify-center gap-3 mb-3" id="gind"><div class="ti"><span></span><span></span><span></span></div><span class="text-sm" style="color:var(--tx3)">Generating...</span><button onclick="stopGen()" class="text-sm px-3 py-1.5 rounded-lg border-none cursor-pointer font-medium" style="background:var(--bg3);color:var(--err)">Stop</button></div>'); }
  else if (!Store.isGenerating && ind) ind.remove();
}

function stopGen() {
  AI.stop(); Store.isGenerating = false;
  if (Store.streamingContent) {
    var conv = Store.getConv();
    if (conv) { var ms = DB.getMsgs(conv.id); for (var i = 0; i < ms.length; i++) { if (ms[i]._streaming) { ms[i] = { id: ms[i].id, role: 'assistant', content: Store.streamingContent + '\n\n*[Stopped]*', created_at: ms[i].created_at }; break; } } DB.saveMsgs(conv.id, ms); }
  }
  Store.streamingContent = ''; pgDashboard(); Toast.show('Stopped', 'info');
}

function cpMsg(mid) { var conv = Store.getConv(); if (!conv) return; var m = DB.getMsgs(conv.id).find(function(x) { return x.id === mid; }); if (m) navigator.clipboard.writeText(m.content).then(function() { Toast.show('Copied', 'success'); }); }
function dlMsg(mid) { var conv = Store.getConv(); if (!conv) return; DB.deleteMsg(conv.id, mid); rMA(); }
function regenMsg(mid) {
  if (Store.isGenerating) return; var conv = Store.getConv(); if (!conv) return;
  DB.deleteMsg(conv.id, mid);
  var ms = DB.getMsgs(conv.id), lu = null;
  for (var i = ms.length - 1; i >= 0; i--) { if (ms[i].role === 'user') { lu = ms[i]; break; } }
  if (!lu) { rMA(); return; }
  DB.deleteMsg(conv.id, lu.id); pgDashboard();
  requestAnimationFrame(function() { var el = document.getElementById('cinp'); if (el) { el.value = lu.content; agrow(el); uSB(); sendMsg(); } });
}
function scrBot() { var a = document.getElementById('marea'); if (a) a.scrollTop = a.scrollHeight; }

/* ===== SIDEBAR ===== */
function togSB() { var s = document.getElementById('sb'), o = document.getElementById('sb-ov'); if (s) s.classList.toggle('open'); if (o) o.classList.toggle('active'); }
function clsSBM() { if (window.innerWidth < 768) { var s = document.getElementById('sb'), o = document.getElementById('sb-ov'); if (s) s.classList.remove('open'); if (o) o.classList.remove('active'); } }
function togPM() { Store.profileDropdown = !Store.profileDropdown; var m = document.getElementById('pmenu'); if (m) m.classList.toggle('hidden', !Store.profileDropdown); }
document.addEventListener('click', function(e) { if (Store.profileDropdown && !e.target.closest('#ptrig') && !e.target.closest('#pmenu')) { Store.profileDropdown = false; var m = document.getElementById('pmenu'); if (m) m.classList.add('hidden'); } });

/* ===== PROFILE ===== */
function openProfile() {
  Store.profileDropdown = false; var m = document.getElementById('pmenu'); if (m) m.classList.add('hidden');
  var user = Auth.getUser(); if (!user) return;
  Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Profile Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<div class="flex flex-col items-center mb-6"><div class="relative mb-3"><img src="' + U.esc(user.profile_image) + '" id="pprev" class="w-20 h-20 rounded-2xl object-cover" style="border:2px solid var(--brd)" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=e8922a&color=fff&size=128\'"><label class="absolute -bottom-1 -right-1 w-8 h-8 rounded-lg flex items-center justify-center cursor-pointer" style="background:var(--acc);color:#fff;font-size:12px;border:2px solid var(--bg2)"><i class="fa-solid fa-camera"></i><input type="file" accept="image/*" class="hidden" onchange="avChange(this)"></label></div><p class="text-xs" style="color:var(--tx3)">Click to change photo</p></div>' +
    '<form onsubmit="saveProf(event)">' + inp('pname', 'Name', 'text', user.name, { icon: 'fa-user' }) + inp('pemail', 'Email', 'email', user.email, { icon: 'fa-envelope' }) +
    '<div class="text-xs mb-4 p-3 rounded-lg" style="background:var(--bg3);color:var(--tx3)"><i class="fa-solid fa-circle-info mr-1"></i> Email is read-only.</div>' +
    '<button type="submit" class="bp" id="psbtn">Save Changes</button></form>' +
    '<div class="mt-6 pt-6" style="border-top:1px solid var(--brd)"><h4 class="font-display text-sm font-semibold mb-4">Change Password</h4><form onsubmit="chPw(event)">' + inp('opw', 'Current Password', 'password', '', { icon: 'fa-lock' }) + inp('npw1', 'New Password', 'password', '', { icon: 'fa-key' }) + inp('npw2', 'Confirm New Password', 'password', '', { icon: 'fa-key' }) +
    '<button type="submit" class="bs" id="cpbtn">Update Password</button></form></div></div>');
}
function avChange(inp) { var f = inp.files[0]; if (!f) return; if (f.size > 2097152) { Toast.show('Image must be under 2MB', 'error'); return; } var r = new FileReader(); r.onload = function(e) { var p = document.getElementById('pprev'); if (p) p.src = e.target.result; inp.dataset.du = e.target.result; }; r.readAsDataURL(f); }
function saveProf(e) {
  e.preventDefault(); var btn = document.getElementById('psbtn'); var n = document.getElementById('pname').value.trim();
  if (!n) { Toast.show('Name is required', 'error'); return; }
  btn.disabled = true; btn.innerHTML = spin() + ' Saving...';
  setTimeout(function() {
    var up = { name: n }; var ai = document.querySelector('input[type="file"][accept="image/*"]');
    if (ai && ai.dataset.du) up.profile_image = ai.dataset.du;
    DB.updateUser(Auth.getSession().userId, up); Toast.show('Profile updated', 'success'); Modal.close(); pgDashboard();
  }, 400);
}
function chPw(e) {
  e.preventDefault(); var btn = document.getElementById('cpbtn');
  var o = document.getElementById('opw').value, n = document.getElementById('npw1').value, n2 = document.getElementById('npw2').value;
  if (!o || !n || !n2) { Toast.show('Fill all password fields', 'error'); return; }
  if (n !== n2) { Toast.show('Passwords do not match', 'error'); return; }
  if (!U.validPw(n)) { Toast.show('Min 8 characters', 'error'); return; }
  btn.disabled = true; btn.innerHTML = spin() + ' Updating...';
  setTimeout(function() {
    var res = Auth.changePassword(Auth.getSession().userId, o, n);
    if (res.ok) { Toast.show('Password updated', 'success'); Modal.close(); }
    else { Toast.show(res.err, 'error'); btn.disabled = false; btn.textContent = 'Update Password'; }
  }, 400);
}

/* ===== SETTINGS ===== */
function openSettings() {
  Store.profileDropdown = false; var m = document.getElementById('pmenu'); if (m) m.classList.add('hidden');
  var user = Auth.getUser(); if (!user) return;
  var s = DB.getSettings(user.id); var dk = !document.documentElement.classList.contains('light');
  Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<div class="flex gap-1 mb-6 p-1 rounded-lg" style="background:var(--bg3)"><button class="flex-1 py-2 px-3 rounded-md text-sm font-medium border-none cursor-pointer stb" data-t="ai" onclick="swTab(\'ai\')" style="background:var(--acc);color:#fff">AI Settings</button><button class="flex-1 py-2 px-3 rounded-md text-sm font-medium border-none cursor-pointer stb" data-t="app" onclick="swTab(\'app\')" style="background:transparent;color:var(--tx2)">Appearance</button></div>' +
    '<div id="tai"><div class="mb-5"><label class="flex items-center justify-between mb-2"><span class="text-sm font-medium">Temperature</span><span class="text-sm font-mono px-2 py-0.5 rounded" style="background:var(--bg3);color:var(--acc)" id="tv">' + s.temperature + '</span></label><input type="range" class="ri" min="0" max="2" step="0.1" value="' + s.temperature + '" oninput="document.getElementById(\'tv\').textContent=this.value" id="stemp"><div class="flex justify-between text-xs mt-1" style="color:var(--tx3)"><span>Precise</span><span>Creative</span></div></div>' +
    '<div class="mb-5"><label class="flex items-center justify-between mb-2"><span class="text-sm font-medium">Max Tokens</span><span class="text-sm font-mono px-2 py-0.5 rounded" style="background:var(--bg3);color:var(--acc)" id="tkv">' + s.max_tokens + '</span></label><input type="range" class="ri" min="256" max="4096" step="256" value="' + s.max_tokens + '" oninput="document.getElementById(\'tkv\').textContent=this.value" id="stkn"><div class="flex justify-between text-xs mt-1" style="color:var(--tx3)"><span>256</span><span>4096</span></div></div>' +
    '<div class="mb-4"><label class="block text-sm font-medium mb-2" style="color:var(--tx2)">System Prompt</label><textarea id="ssys" class="ifield" rows="5" style="resize:vertical;min-height:80px">' + U.esc(s.system_prompt) + '</textarea></div>' +
    '<div class="flex gap-2 mb-4 flex-wrap"><button class="text-xs px-3 py-1.5 rounded-lg border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)" onclick="document.getElementById(\'ssys\').value=\'You are ZETA AI, a helpful, knowledgeable, and friendly AI assistant. Provide clear, accurate, well-structured responses using markdown formatting when appropriate.\'">Default</button><button class="text-xs px-3 py-1.5 rounded-lg border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)" onclick="document.getElementById(\'ssys\').value=\'You are a concise assistant. Respond briefly.\'">Concise</button><button class="text-xs px-3 py-1.5 rounded-lg border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)" onclick="document.getElementById(\'ssys\').value=\'You are a creative assistant. Provide elaborate, thoughtful responses.\'">Creative</button></div></div>' +
    '<div id="tapp" class="hidden"><div class="flex items-center justify-between p-4 rounded-lg mb-4" style="background:var(--bg3)"><div><div class="text-sm font-medium">Dark Mode</div><div class="text-xs" style="color:var(--tx3)">Toggle theme</div></div><div class="tt' + (dk ? ' on' : '') + '" id="ttgl" onclick="togTheme()"><div class="tth"></div></div></div>' +
    '<div class="grid grid-cols-2 gap-3"><div class="p-4 rounded-lg cursor-pointer border-2 transition-all text-center" style="background:#09090f;border-color:' + (dk ? 'var(--acc)' : 'var(--brd)') + '" onclick="setTh(true)"><div class="w-full h-16 rounded-lg mb-2" style="background:linear-gradient(135deg,#111118,#1a1a24)"></div><span class="text-sm font-medium" style="color:#eaeaf0">Dark</span></div><div class="p-4 rounded-lg cursor-pointer border-2 transition-all text-center" style="background:#f5f5f8;border-color:' + (!dk ? 'var(--acc)' : 'var(--brd)') + '" onclick="setTh(false)"><div class="w-full h-16 rounded-lg mb-2" style="background:linear-gradient(135deg,#fff,#eeeef2)"></div><span class="text-sm font-medium" style="color:#1a1a24">Light</span></div></div></div>' +
    '<button class="bp mt-4" onclick="saveSet()">Save Settings</button></div>');
}
function swTab(t) { document.querySelectorAll('.stb').forEach(function(b) { var a = b.dataset.t === t; b.style.background = a ? 'var(--acc)' : 'transparent'; b.style.color = a ? '#fff' : 'var(--tx2)'; }); document.getElementById('tai').classList.toggle('hidden', t !== 'ai'); document.getElementById('tapp').classList.toggle('hidden', t !== 'app'); }
function togTheme() { setTh(document.documentElement.classList.contains('light')); }
function setTh(d) { document.documentElement.classList.toggle('light', !d); document.documentElement.classList.toggle('dark', d); var t = document.getElementById('ttgl'); if (t) t.classList.toggle('on', d); }
function saveSet() { var u = Auth.getUser(); if (!u) return; var s = DB.getSettings(u.id); s.temperature = parseFloat((document.getElementById('stemp') || {}).value || s.temperature); s.max_tokens = parseInt((document.getElementById('stkn') || {}).value || s.max_tokens); s.system_prompt = (document.getElementById('ssys') || {}).value || s.system_prompt; s.theme = document.documentElement.classList.contains('light') ? 'light' : 'dark'; DB.saveSettings(u.id, s); Toast.show('Settings saved', 'success'); Modal.close(); }

Router.reg('/settings', function() { if (Auth.isLoggedIn()) { pgDashboard(); setTimeout(openSettings, 100); } else Router.go('/login'); });

/* ===== INIT ===== */
(function() {
  if (Auth.isLoggedIn()) { var s = DB.getSettings(Auth.getSession().userId); if (s && s.theme === 'light') { document.documentElement.classList.remove('dark'); document.documentElement.classList.add('light'); } }
  Router.init();
})();

document.addEventListener('keydown', function(e) { if (e.ctrlKey && e.shiftKey && e.key === 'N' && Auth.isLoggedIn()) { e.preventDefault(); newChat(); } });
