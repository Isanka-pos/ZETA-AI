<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZETA TOOLS — Sri Lankan Utility Suite</title>
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://hashu-apis-production.up.railway.app" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { display: ['Space Grotesk', 'sans-serif'], body: ['DM Sans', 'sans-serif'] } } } }
    </script>

    <style>
        /* ===== ORIGINAL STYLES ===== */
        :root {
            --bg: #07070e;
            --bg2: #0b0b14;
            --bg3: #11111e;
            --bg4: #1a1a2e;
            --brd: #1a1a2e;
            --brd2: #282844;
            --tx: #eaeaf0;
            --tx2: #9494b8;
            --tx3: #5a5a7a;
            --acc: #e8922a;
            --acc-l: #f0a848;
            --acc-g: rgba(232, 146, 42, 0.08);
            --acc-glow: rgba(232, 146, 42, 0.15);
            --ok: #4ade80;
            --err: #f87171;
            --wrn: #fbbf24;
            --card-radius: 16px;
            --glass-bg: rgba(17, 17, 30, 0.7);
            --shadow-glow: 0 8px 40px rgba(232, 146, 42, 0.06);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--tx);
            overflow: hidden;
            height: 100dvh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 20% 50%, rgba(232, 146, 42, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(232, 146, 42, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(232, 146, 42, 0.02) 0%, transparent 50%);
            animation: bgFloat 14s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }
        @keyframes bgFloat {
            0% { transform: scale(1) rotate(0deg); opacity: .7 }
            50% { transform: scale(1.08) rotate(2deg); opacity: 1 }
            100% { transform: scale(.96) rotate(-1deg); opacity: .8 }
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 10% 80%, rgba(232, 146, 42, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 70%, rgba(232, 146, 42, 0.03) 0%, transparent 35%);
            animation: orbFloat 18s ease-in-out infinite alternate;
            will-change: transform;
        }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1) }
            50% { transform: translate(-20px, 30px) scale(1.05) }
            100% { transform: translate(20px, -20px) scale(.95) }
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brd2);
            border-radius: 10px;
            transition: background .3s;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--acc);
        }
        input,
        textarea,
        button,
        select {
            font-family: inherit;
        }
        .sr-file {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100dvh;
            background: linear-gradient(180deg, rgba(11, 11, 20, 0.98), rgba(7, 7, 14, 0.99));
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            transition: transform .25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 40;
            position: relative;
            overflow: hidden;
            box-shadow: 4px 0 40px rgba(0, 0, 0, 0.3);
            will-change: transform;
        }
        .sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(232, 146, 42, 0.15), transparent);
        }
        @media(max-width:768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%);
                width: 280px;
                min-width: 280px;
                border-radius: 0 20px 20px 0;
            }
            .sidebar.open {
                transform: translateX(0)
            }
        }
        .sb-brand {
            padding: 22px 22px 18px;
            position: relative;
        }
        .sb-brand::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232, 146, 42, 0.15), transparent);
        }
        .sb-brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sb-brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--acc), #d4781a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(232, 146, 42, 0.3);
            position: relative;
            transition: transform .3s;
        }
        .sb-brand-icon:hover {
            transform: scale(1.05) rotate(-2deg);
        }
        .sb-brand-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--acc), transparent, var(--acc-l));
            opacity: 0.3;
            z-index: -1;
            filter: blur(6px);
        }
        .sb-brand-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--tx), var(--tx));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .sb-brand-name span {
            background: linear-gradient(135deg, var(--acc), var(--acc-l));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sb-brand-sub {
            font-size: 10px;
            font-weight: 500;
            color: var(--tx3);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            -webkit-text-fill-color: var(--tx3);
        }
        .sb-version-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(232, 146, 42, 0.08);
            border: 1px solid rgba(232, 146, 42, 0.12);
            color: var(--acc-l);
            backdrop-filter: blur(4px);
            transition: all .3s;
        }
        .sb-version-badge:hover {
            border-color: rgba(232, 146, 42, 0.3);
            background: rgba(232, 146, 42, 0.14);
        }
        .sb-search {
            padding: 14px 18px 10px;
        }
        .sb-search-wrap {
            position: relative;
        }
        .sb-search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tx3);
            font-size: 13px;
            pointer-events: none;
            transition: color .3s;
        }
        .sb-search-wrap input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--brd);
            border-radius: 12px;
            padding: 10px 40px 10px 40px;
            font-size: 13px;
            color: var(--tx);
            outline: none;
            transition: border-color .3s, box-shadow .3s, background .3s;
        }
        .sb-search-wrap input::placeholder {
            color: var(--tx3);
        }
        .sb-search-wrap input:focus {
            border-color: rgba(232, 146, 42, 0.3);
            background: rgba(232, 146, 42, 0.04);
            box-shadow: 0 0 0 4px var(--acc-g);
        }
        .sb-search-wrap input:focus+i {
            color: var(--acc);
        }
        .sb-search-wrap .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--tx3);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            font-size: 14px;
            display: none;
            transition: all .2s;
        }
        .sb-search-wrap .clear-btn:hover {
            color: var(--tx);
            background: rgba(255, 255, 255, 0.05);
        }
        .sb-search-wrap .clear-btn.visible {
            display: block;
        }
        .sb-section-label {
            padding: 16px 22px 8px;
            font-size: 10px;
            font-weight: 700;
            color: var(--tx3);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            opacity: 0.6;
        }
        .sb-cat {
            margin: 2px 14px;
            padding: 0;
            border-radius: 12px;
            cursor: pointer;
            transition: background .2s, transform .2s;
            position: relative;
        }
        .sb-cat:hover {
            background: rgba(255, 255, 255, 0.035);
            transform: translateX(4px);
        }
        .sb-cat-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
        }
        .sb-cat-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            transition: transform .2s;
        }
        .sb-cat:hover .sb-cat-icon {
            transform: scale(1.05);
        }
        .sb-cat-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--tx);
            line-height: 1.2;
        }
        .sb-cat-count {
            font-size: 11px;
            color: var(--tx3);
            margin-top: 1px;
        }
        .sb-profile {
            margin: auto 14px 16px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(232, 146, 42, 0.04);
            border: 1px solid rgba(232, 146, 42, 0.06);
            cursor: pointer;
            transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            backdrop-filter: blur(4px);
        }
        .sb-profile::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(232, 146, 42, 0.1), transparent, rgba(232, 146, 42, 0.05));
            opacity: 0;
            transition: opacity .3s;
            z-index: 0;
        }
        .sb-profile:hover {
            border-color: rgba(232, 146, 42, 0.2);
            background: rgba(232, 146, 42, 0.08);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(232, 146, 42, 0.05);
        }
        .sb-profile:hover::before {
            opacity: 1;
        }
        .sb-profile-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .sb-profile-avatar {
            position: relative;
            flex-shrink: 0;
        }
        .sb-profile-avatar img {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(232, 146, 42, 0.15);
            transition: border-color .3s;
        }
        .sb-profile:hover .sb-profile-avatar img {
            border-color: rgba(232, 146, 42, 0.35);
        }
        .sb-profile-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--ok);
            border: 2.5px solid #0b0b14;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            50% { box-shadow: 0 0 0 4px rgba(74, 222, 128, 0); }
        }
        .sb-profile-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--tx);
            line-height: 1.2;
        }
        .sb-profile-status {
            font-size: 11px;
            color: var(--ok);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sb-profile-status::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--ok);
            animation: dotPulse 2s ease-in-out infinite;
        }
        .sb-profile-ellipsis {
            margin-left: auto;
            color: var(--tx3);
            font-size: 14px;
            transition: color .3s, transform .3s;
        }
        .sb-profile:hover .sb-profile-ellipsis {
            color: var(--tx2);
            transform: rotate(90deg);
        }
        .zeta-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 24px;
            height: 64px;
            min-height: 64px;
            background: rgba(7, 7, 14, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
        }
        .zeta-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--acc), var(--acc-l), var(--acc), transparent);
            background-size: 200% 100%;
            animation: headerLine 5s ease-in-out infinite;
            z-index: 2;
            filter: blur(0.5px);
        }
        @keyframes headerLine {
            0%,
            100% { background-position: 200% 0 }
            50% { background-position: -100% 0 }
        }
        .header-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0a848, #e8922a, #f5c76e, #e8922a);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShine 6s ease-in-out infinite;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(0 0 20px rgba(232, 146, 42, 0.05));
        }
        @keyframes titleShine {
            0%,
            100% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
        }
        .header-subtitle {
            font-size: 10px;
            font-weight: 500;
            color: var(--tx3);
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1;
            margin-top: 2px;
            opacity: 0.7;
        }
        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.03);
            color: var(--tx2);
            cursor: pointer;
            transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 15px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
            position: relative;
        }
        .header-btn:hover {
            border-color: rgba(232, 146, 42, 0.3);
            color: var(--acc-l);
            background: var(--acc-g);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 20px rgba(232, 146, 42, 0.08);
        }
        .header-btn:active {
            transform: scale(0.95);
        }
        .header-divider {
            width: 1px;
            height: 28px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.06), transparent);
            flex-shrink: 0;
        }
        .hero-wrap {
            position: relative;
            padding: 36px 28px 32px;
            text-align: center;
            z-index: 1;
        }
        .hero-wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 100%;
            background: radial-gradient(ellipse at center top, rgba(232, 146, 42, 0.04), transparent 70%);
            pointer-events: none;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            background: rgba(232, 146, 42, 0.07);
            border: 1px solid rgba(232, 146, 42, 0.12);
            color: var(--acc-l);
            margin-bottom: 18px;
            backdrop-filter: blur(4px);
            transition: all .3s;
        }
        .hero-badge:hover {
            background: rgba(232, 146, 42, 0.12);
            border-color: rgba(232, 146, 42, 0.25);
            transform: translateY(-1px);
        }
        .hero-bolt-wrap {
            margin-bottom: 14px;
        }
        .hero-bolt-wrap>div {
            color: var(--acc);
            font-size: 32px;
            position: relative;
            z-index: 1;
            display: inline-block;
            animation: boltFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(232, 146, 42, 0.15));
            will-change: transform;
        }
        @keyframes boltFloat {
            0%,
            100% { transform: translateY(0) scale(1) }
            50% { transform: translateY(-6px) scale(1.05) }
        }
        .hero-title-main {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(28px, 5.5vw, 50px);
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 4px;
            display: inline-block;
            animation: fadeInUp .8s ease both;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) }
            to { opacity: 1; transform: translateY(0) }
        }
        .hero-title-zeta {
            background: linear-gradient(135deg, #f0a848, #e8922a, #f5c76e, #e8922a);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGrad 5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(232, 146, 42, 0.05));
            display: inline-block;
        }
        @keyframes titleGrad {
            0%,
            100% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
        }
        .hero-title-tools {
            color: var(--tx);
            font-weight: 300;
            -webkit-text-fill-color: var(--tx);
            display: inline-block;
        }
        .hero-tagline {
            font-size: 12px;
            font-weight: 500;
            color: var(--tx3);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.7;
        }
        .hero-greeting {
            font-size: 15px;
            color: var(--tx2);
            margin-bottom: 22px;
        }
        .hero-greeting strong {
            color: var(--acc-l);
            font-weight: 600;
        }
        .hero-stats {
            display: inline-flex;
            gap: 3px;
            background: rgba(17, 17, 30, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 4px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        .hero-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 22px;
            border-radius: 12px;
            min-width: 72px;
            transition: background .3s;
        }
        .hero-stat:hover {
            background: rgba(232, 146, 42, 0.04);
        }
        .hero-stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--acc-l);
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .hero-stat-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--tx3);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .hero-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--acc), transparent);
            margin: 28px auto 0;
            border-radius: 2px;
            opacity: 0.5;
        }
        .wc {
            background: linear-gradient(145deg, rgba(17, 17, 30, 0.7), rgba(11, 11, 20, 0.85));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--card-radius);
            padding: 22px 20px;
            cursor: pointer;
            transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .3s, border-color .3s;
            position: relative;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            will-change: transform;
        }
        .wc::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--card-radius);
            background: linear-gradient(135deg, rgba(232, 146, 42, 0.02), transparent 60%);
            opacity: 0;
            transition: opacity .4s;
            pointer-events: none;
        }
        .wc:hover::before {
            opacity: 1;
        }
        .wc::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232, 146, 42, 0.15), transparent);
            opacity: 0;
            transition: opacity .4s;
        }
        .wc:hover::after {

        // API helpers
        function apiFetch(url, onDone, onError) {
            const ctrl = new AbortController();
            const timeout = setTimeout(() => ctrl.abort(), 15000);
            fetch(url, { signal: ctrl.signal })
                .then(res => {
                    clearTimeout(timeout);
                    return res.text().then(raw => {
                        let data;
                        try { data = JSON.parse(raw); } catch (e) { throw new Error(res.ok ? 'BAD_JSON' :
                                'API_ERR_' + res.status); }
                        if (!res.ok) throw new Error('API_ERR_' + res.status);
                        return data;
                    });
                })
                .then(data => {
                    if (data.success === false || data.status === false) throw new Error('API_MSG:' + (data.message ||
                        data.error || 'Request failed'));
                    const r = data.results || data.result || data.data || data;
                    if (!r) throw new Error('EMPTY');
                    onDone(r);
                })
                .catch(e => {
                    clearTimeout(timeout);
                    if (e.name === 'AbortError') onError('Request timed out.');
                    else if (e.message === 'EMPTY') onError('Empty response from service.');
                    else if (e.message === 'BAD_JSON') onError('Unexpected response format.');
                    else if (e.message.indexOf('API_MSG:') === 0) onError(e.message.slice(8));
                    else if (e.message.indexOf('API_ERR_402') === 0) onError('Service quota exhausted.');
                    else if (e.message.indexOf('API_ERR_401') === 0 || e.message.indexOf('API_ERR_403') === 0) onError(
                        'API key rejected.');
                    else if (e.message.indexOf('API_ERR_429') === 0) onError('Rate limited. Try again.');
                    else if (e.message.indexOf('API_ERR') === 0) onError('Service unavailable.');
                    else if (e.message.indexOf('fetch') >= 0 || e.message.indexOf('Network') >= 0 || e.message.indexOf(
                            'Failed') >= 0) onError('Network error.');
                    else onError('Something went wrong.');
                });
        }

            return `<div class="wc" data-t="${U.esc(t.title).toLowerCase()}" onclick="${t.action}()" style="animation-delay:${delay}s">${badge}<div class="wc-arrow"><i class="fa-solid fa-arrow-right"></i></div><div class="flex items-center gap-3 mb-3"><div class="wc-icon-wrap" style="background:linear-gradient(135deg,${cLight},${cMid});color:${c};border:1px solid ${c}25"><i class="fa-solid ${t.icon}" style="font-size:15px"></i></div><span class="wc-title">${U.esc(t.title)}</span></div><p class="wc-desc">${U.esc(t.desc)}</p></div>`;

        // ===== FILTER =====
        let _filterTimeout = 0;

        function filterTools(q) {
            clearTimeout(_filterTimeout);
            _filterTimeout = setTimeout(() => {
                const qs = q.toLowerCase();
                const wcs = document.querySelectorAll('#toolsList .wc');
                const secs = document.querySelectorAll('#toolsList [data-cat]');
                const visible = {};
                for (let i = 0; i < wcs.length; i++) {
                    const w = wcs[i];
                    const show = (w.dataset.t || '').indexOf(qs) >= 0;
                    w.style.display = show ? '' : 'none';
                    const sec = w.closest('[data-cat]');
                    if (sec) visible[sec.id] = visible[sec.id] || show;
                }
                for (let j = 0; j < secs.length; j++) {
                    secs[j].style.display = visible[secs[j].id] ? '' : 'none';
                }
                toggleClearBtn();
            }, 80);
        }

        // ================================================================
        //  TOOL FUNCTIONS (stubs — full implementations in original)
        // ================================================================
        function openNicChecker() { Toast.show('NIC Checker opened', 'info'); }

        function openCurrency() { Toast.show('Currency Converter opened', 'info'); }

        function openLotteryChecker() { Toast.show('Lottery Checker opened', 'info'); }

        function openPasswordGenerator() { Toast.show('Password Generator opened', 'info'); }

        function openNpmChecker() { Toast.show('NPM Checker opened', 'info'); }

        function openMimeChecker() { Toast.show('MIME Detector opened', 'info'); }

        function openProfile() {
            const user = Auth.getUser();
            Modal.open(
                `<div class="p-6"><div class="flex items-center gap-4 mb-4"><div class="relative"><img src="${U.esc(user.profile_image)}" class="w-16 h-16 rounded-xl object-cover border-2" style="border-color:rgba(232,146,42,0.2)" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=e8922a&color=fff&size=64'"><div class="absolute bottom-0 right-0 w-4 h-4 rounded-full bg-green-500 border-2 border-[#0b0b14]"></div></div><div><h3 class="font-display text-xl font-semibold">${U.esc(user.name)}</h3><p class="text-sm" style="color:var(--tx3)}">${U.esc(user.email||'guest@zeta.tools')}</p></div></div><div class="bg-white/5 rounded-xl p-4 text-sm" style="color:var(--tx2)"><div class="flex justify-between py-1 border-b border-white/5"><span>Member since</span><span>${U.relTime(user.created_at)}</span></div><div class="flex justify-between py-1"><span>User ID</span><span class="font-mono text-xs" style="color:var(--tx3)">${user.id.slice(0,8)}</span></div></div><div class="flex gap-3 mt-4"><button class="bs flex-1" onclick="Modal.close()">Close</button></div></div>`
            );
        }

        function openDataManagement() {
            Modal.open(
                `<div class="p-6"><h3 class="font-display text-lg font-semibold mb-2"><i class="fa-solid fa-database mr-2" style="color:var(--acc)"></i>Data Management</h3><p class="text-sm mb-4" style="color:var(--tx2)">Manage your stored data and history.</p><div class="data-mgmt"><button class="bs flex-1" onclick="clearAll()"><i class="fa-solid fa-trash-can mr-1" style="color:var(--err)"></i>Clear All</button><button class="bs flex-1" onclick="Modal.close();Toast.show('Data refreshed','success')"><i class="fa-solid fa-rotate mr-1"></i>Refresh</button></div></div>`
            );
        }

        function openSettings() {
            Modal.open(
                `<div class="p-6"><h3 class="font-display text-lg font-semibold mb-2"><i class="fa-solid fa-gear mr-2" style="color:var(--acc)"></i>Settings</h3><p class="text-sm mb-4" style="color:var(--tx2)">App preferences and configuration.</p><div class="bg-white/5 rounded-xl p-4"><div class="flex items-center justify-between py-2"><span style="color:var(--tx2)">Theme</span><span style="color:var(--tx)">Dark</span></div><div class="flex items-center justify-between py-2"><span style="color:var(--tx2)">Version</span><span style="color:var(--tx3)">ZETA v2.0</span></div></div><button class="bs w-full mt-4" onclick="Modal.close()">Close</button></div>`
            );
        }

        // ================================================================
        //  ROUTER INIT
        // ================================================================
        Router.reg('/dashboard', pgDashboard);
        Router.reg('/settings', function() { pgDashboard();
            setTimeout(openSettings, 120); });

        (function() {
            document.documentElement.classList.add('dark');
            if (!Router.cur() || Router.cur() === '/login' || Router.cur() === '/register') Router.go('/dashboard');
            Router.init();
        })();

        (function() {
            function sync() { document.body.classList.toggle('tab-hidden', document.hidden); }
            document.addEventListener('visibilitychange', sync);
            sync();
        })();
    </script>
</body>
</html>
