<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZETA TOOLS — Premium APK Downloads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    </script>

        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
    </script>
    <style>
        /* ... (all existing styles remain unchanged) ... */
        /* Keep the same styles as before, including the .admin-badge-link class, but we won't use it */
        /* ... */
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="tc" id="toasts"></div>
    <div id="modal-root"></div>

    <script>
        // =====================================================================
        //  UTILITY & ORIGINAL DB (unchanged)
        // =====================================================================
        const U = {
            esc: s => { const d = document.createElement('div');
                d.textContent = s; return d.innerHTML; },
            now: () => new Date().toISOString(),
            relTime: d => {
                const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
                if (s < 60) return 'Just now';
                if (s < 3600) return Math.floor(s / 60) + 'm ago';
                if (s < 86400) return Math.floor(s / 3600) + 'h ago';
                if (s < 604800) return Math.floor(s / 86400) + 'd ago';
                return new Date(d).toLocaleDateString();
            },
            fmtDateTime: d => {
                const dt = new Date(d);
                return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
                    ' ' + dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }
        };
        const DB = {
            _g: k => { try { return JSON.parse(localStorage.getItem('z_' + k)); } catch (e) { return null; } },
            _s: (k, v) => { try { localStorage.setItem('z_' + k, JSON.stringify(v)); } catch (e) {} },
            getUsers: function() { return this._g('users') || []; },
            saveUsers: function(u) { this._s('users', u); },
            findUserById: function(id) { return this.getUsers().find(u => u.id === id); },
            addUser: function(u) { const us = this.getUsers();
                us.push(u);
                this.saveUsers(us);
                return u; },
            clearAll: function() {
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('z_') === 0)
                        keys.push(k); }
                keys.forEach(k => localStorage.removeItem(k));
                try { sessionStorage.removeItem('z_sess'); } catch (e) {}
            },
            getSessionUserId: function() {
                try { return localStorage.getItem('z_session') || null; } catch { return null; }
            },
            touchUser: function(userId) {
                const users = this.getUsers();
                const idx = users.findIndex(u => u.id === userId);
                if (idx !== -1) {
                    users[idx].lastLogin = this.now();
                    this.saveUsers(users);
                    return users[idx];
                }
                return null;
            },
            isUserOnline: function(userId) {
                const sessionId = this.getSessionUserId();
                if (!sessionId || sessionId !== userId) return false;
                const user = this.findUserById(userId);
                if (!user || !user.lastLogin) return false;
                const diff = Date.now() - new Date(user.lastLogin).getTime();
                return diff < 300000;
            }
        };

        // =====================================================================
        //  AUTH SYSTEM (unchanged)
        // =====================================================================
        async function hashPassword(password, salt) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + salt);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function generateSalt() {
            const array = new Uint8Array(16);
            crypto.getRandomValues(array);
            return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
        }

        function getLoginAttempts() {
            try {
                const data = JSON.parse(localStorage.getItem('z_login_attempts') || '{}');
                return data;
            } catch { return {}; }
        }

        function setLoginAttempts(data) {
            localStorage.setItem('z_login_attempts', JSON.stringify(data));
        }

        function isRateLimited(email) {
            const attempts = getLoginAttempts();
            const now = Date.now();
            const record = attempts[email];
            if (!record) return false;
            if (record.count >= 5 && (now - record.lastAttempt) < 300000) { return true; }
            if (now - record.lastAttempt >= 300000) {
                delete attempts[email];
                setLoginAttempts(attempts);
                return false;
            }
            return false;
        }

        function recordLoginAttempt(email, success) {
            const attempts = getLoginAttempts();
            const now = Date.now();
            if (!attempts[email]) {
                attempts[email] = { count: 0, lastAttempt: now };
            }
            if (success) {
                delete attempts[email];
            } else {
                attempts[email].count += 1;
                attempts[email].lastAttempt = now;
            }
            setLoginAttempts(attempts);
        }

        function getUsers() {
            try {
                return JSON.parse(localStorage.getItem('z_users') || '[]');
            } catch { return []; }
        }

        function saveUsers(users) {
            localStorage.setItem('z_users', JSON.stringify(users));
        }

        function findUserByEmail(email) {
            return getUsers().find(u => u.email && u.email.toLowerCase() === email.toLowerCase());
        }

        function getUserById(id) {
            return getUsers().find(u => u.id === id);
        }

        function createUser(email, password, name) {
            const salt = generateSalt();
            return hashPassword(password, salt).then(hash => {
                const user = {
                    id: 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    email: email.toLowerCase(),
                    name: name || email.split('@')[0],
                    passwordHash: hash,
                    salt: salt,
                    created_at: new Date().toISOString(),
                    lastLogin: new Date().toISOString(),
                    active: true,
                    profile_image: `https://ui-avatars.com/api/?name=${encodeURIComponent(name || email)}&background=4F7DF7&color=fff&size=128&bold=true`
                };
                const users = getUsers();
                users.push(user);
                saveUsers(users);
                return user;
            });
        }

        function verifyPassword(user, password) {
            return hashPassword(password, user.salt).then(hash => hash === user.passwordHash);
        }

        function getSession() {
            try {
                return localStorage.getItem('z_session') || null;
            } catch { return null; }
        }

        function setSession(userId) {
            if (userId) {
                localStorage.setItem('z_session', userId);
            } else {
                localStorage.removeItem('z_session');
            }
        }

        function getLoggedInUser() {
            const sessionId = getSession();
            if (!sessionId) return null;
            return getUserById(sessionId);
        }

        const Auth = {
            _uid: 'local',
            getUser: function() {
                let loggedIn = getLoggedInUser();
                if (loggedIn) {
                    DB.touchUser(loggedIn.id);
                    return loggedIn;
                }
                let guest = DB.findUserById(this._uid);
                if (!guest) {
                    guest = DB.addUser({
                        id: this._uid,
                        name: 'Guest',
                        profile_image: 'https://ui-avatars.com/api/?name=Guest&background=4F7DF7&color=fff&size=128&bold=true',
                        created_at: U.now(),
                        lastLogin: U.now(),
                        active: true,
                        isGuest: true
                    });
                }
                return guest;
            },
            isLoggedIn: function() {
                return !!getLoggedInUser();
            },
            login: function(email, password) {
                return new Promise((resolve, reject) => {
                    if (isRateLimited(email)) {
                        reject(new Error('Too many failed attempts. Please wait 5 minutes.'));
                        return;
                    }
                    const user = findUserByEmail(email);
                    if (!user) {
                        recordLoginAttempt(email, false);
                        reject(new Error('Invalid email or password.'));
                        return;
                    }
                    if (user.active === false) {
                        reject(new Error('Account has been deactivated.'));
                        return;
                    }
                    verifyPassword(user, password).then(match => {
                        if (match) {
                            recordLoginAttempt(email, true);
                            setSession(user.id);
                            user.lastLogin = U.now();
                            saveUsers(getUsers().map(u => u.id === user.id ? user : u));
                            try { localStorage.setItem('z_has_logged_in', 'true'); } catch (e) {}
                            resolve(user);
                        } else {
                            recordLoginAttempt(email, false);
                            reject(new Error('Invalid email or password.'));
                        }
                    }).catch(reject);
                });
            },
            register: function(email, password, name) {
                return new Promise((resolve, reject) => {
                    if (!email || !password || password.length < 6) {
                        reject(new Error('Password must be at least 6 characters.'));
                        return;
                    }
                    if (findUserByEmail(email)) {
                        reject(new Error('Email already registered.'));
                        return;
                    }
                    createUser(email, password, name).then(user => {
                        setSession(user.id);
                        try { localStorage.setItem('z_has_logged_in', 'true'); } catch (e) {}
                        resolve(user);
                    }).catch(reject);
                });
            },
            logout: function() {
                setSession(null);
                Toast.show('Logged out successfully', 'info');
                pgDashboard();
            },
            isAdmin: function() {
                try {
                    const adminSess = JSON.parse(sessionStorage.getItem('zeta_admin_sess') || 'null');
                    return adminSess && adminSess.logged === true;
                } catch { return false; }
            }
        };

        // =====================================================================
        //  TOAST, MODAL, STORE (unchanged)
        // =====================================================================
        const Toast = {
            show: function(msg, type, dur) {
                type = type || 'info';
                dur = dur || 3500;
                const c = document.getElementById('toasts');
                const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
                const el = document.createElement('div');
                el.className = 'toast ' + type;
                el.innerHTML =
                    `<div class="toast-content"><i class="fa-solid ${icons[type]||icons.info}"></i><span>${U.esc(msg)}</span><button class="toast-close" onclick="this.closest('.toast').remove()"><i class="fa-solid fa-xmark"></i></button></div><div class="progress-bar"><div class="progress-fill"></div></div>`;
                c.appendChild(el);
                const timer = setTimeout(() => { el.style.animation = 'toastOut .25s ease forwards';
                    setTimeout(() => el.remove(), 300); }, dur);
                el.addEventListener('click', e => { if (e.target.closest('.toast-close')) return;
                    clearTimeout(timer);
                    el.style.animation = 'toastOut .25s ease forwards';
                    setTimeout(() => el.remove(), 300); });
                el.querySelector('.toast-close').addEventListener('click', () => clearTimeout(timer));
            }
        };
        const Modal = {
            open: function(html) {
                document.getElementById('modal-root').innerHTML =
                    `<div class="mo" id="mo"><div class="moc">${html}</div></div>`;
                document.getElementById('mo').addEventListener('click', e => { if (e.target.id === 'mo') Modal.close(); });
            },
            close: function() { document.getElementById('modal-root').innerHTML = ''; }
        };
        const Store = { sidebarOpen: false, profileDropdown: false };

        // =====================================================================
        //  NAVIGATION HELPERS (unchanged)
        // =====================================================================
        function togSB() {
            const s = document.getElementById('sb'),
                o = document.getElementById('sb-ov');
            if (s) s.classList.toggle('open');
            if (o) o.classList.toggle('active');
            Store.sidebarOpen = !Store.sidebarOpen;
        }

        function clsSBM() {
            if (window.innerWidth < 768) {
                const s = document.getElementById('sb'),
                    o = document.getElementById('sb-ov');
                if (s) s.classList.remove('open');
                if (o) o.classList.remove('active');
                Store.sidebarOpen = false;
            }
        }

        function togPM() {
            Store.profileDropdown = !Store.profileDropdown;
            const m = document.getElementById('pmenu');
            if (m) m.classList.toggle('hidden', !Store.profileDropdown);
        }
        document.addEventListener('click', e => {
            if (Store.profileDropdown && !e.target.closest('#ptrig') && !e.target.closest('#pmenu')) {
                Store.profileDropdown = false;
                const m = document.getElementById('pmenu');
                if (m) m.classList.add('hidden');
            }
        });

        function navTo(id) {
            clsSBM();
            setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth',
                    block: 'start' }); }, 260);
        }

        // =====================================================================
        //  ADMIN PANEL - HIDDEN TRIGGER
        //  - Double-click on logo or Ctrl+Shift+A opens admin login
        // =====================================================================
        function openAdminPanel() {
            try {
                const adminSess = JSON.parse(sessionStorage.getItem('zeta_admin_sess') || 'null');
                if (adminSess && adminSess.logged) {
                    window.open('admin.html', '_blank');
                    return;
                }
            } catch (e) {}

            Modal.open(`
                <div class="p-5">
                    <h3 class="text-sm font-semibold mb-1"><i class="fa-solid fa-shield-halved mr-1.5" style="color:var(--accent-violet);font-size:12px"></i>Admin Access</h3>
                    <p class="text-xs mb-3" style="color:var(--text-secondary)">Enter admin credentials to access the management panel.</p>
                    <form id="adminLoginForm" onsubmit="return false;">
                        <div class="mb-2"><input type="text" id="adminUser" class="auth-input" placeholder="Username" value="admin" /></div>
                        <div class="mb-2"><input type="password" id="adminPass" class="auth-input" placeholder="Password" /></div>
                        <div id="adminLoginError" class="auth-error"></div>
                        <button type="submit" id="adminLoginBtn" class="btn-primary w-full justify-center mt-2"><i class="fa-solid fa-right-to-bracket mr-1"></i> Sign In</button>
                    </form>
                    <div class="auth-divider"><span>secure</span></div>
                    <div class="text-center text-xs" style="color:var(--text-tertiary)">Admin panel access is restricted.</div>
                </div>
            `);

            setTimeout(() => {
                const form = document.getElementById('adminLoginForm');
                const errorEl = document.getElementById('adminLoginError');
                const btn = document.getElementById('adminLoginBtn');
                if (!form) return;

                const adminCreds = { username: 'admin', password: 'zeta@2024' };

                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const u = document.getElementById('adminUser').value.trim();
                    const p = document.getElementById('adminPass').value;

                    errorEl.textContent = '';
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Authenticating...';

                    setTimeout(() => {
                        if (u === adminCreds.username && p === adminCreds.password) {
                            sessionStorage.setItem('zeta_admin_sess', JSON.stringify({ logged: true,
                                at: new Date().toISOString() }));
                            Modal.close();
                            Toast.show('Admin access granted', 'success');
                            window.open('admin.html', '_blank');
                        } else {
                            errorEl.textContent = 'Invalid admin credentials.';
                            btn.disabled = false;
                            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1"></i> Sign In';
                            document.getElementById('adminPass').value = '';
                            document.getElementById('adminPass').focus();
                        }
                    }, 500);
                });
            }, 50);
        }

        // --- Hidden trigger: double-click on logo ---
        document.addEventListener('dblclick', function(e) {
            const logo = e.target.closest('.nav-brand');
            if (logo) {
                e.preventDefault();
                openAdminPanel();
            }
        });

        // --- Hidden trigger: keyboard shortcut Ctrl+Shift+A ---
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && (e.key === 'a' || e.key === 'A')) {
                e.preventDefault();
                openAdminPanel();
            }
        });

        // =====================================================================
        //  REAL-TIME SYNC via Storage Events (unchanged)
        // =====================================================================
        let lastUserCount = 0;
        let userSyncListeners = [];

        function onUsersChanged(callback) {
            userSyncListeners.push(callback);
        }

        function notifyUserChange() {
            const currentUsers = DB.getUsers();
            const currentCount = currentUsers.length;
            if (lastUserCount > 0 && currentCount > lastUserCount) {
                Toast.show('New user registered!', 'success');
            }
            lastUserCount = currentCount;
            userSyncListeners.forEach(fn => {
                try { fn(currentUsers); } catch (e) {}
            });
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'z_users' || e.key === 'z_session') {
                notifyUserChange();
                updateUIForUserChange();
            }
        });

        window.addEventListener('user-update', function(e) {
            notifyUserChange();
            updateUIForUserChange();
        });

        function updateUIForUserChange() {
            const avatarEl = document.getElementById('sidebarAvatar');
            const nameEl = document.querySelector('.sb-profile-name');
            const statusEl = document.querySelector('.sb-profile-status');
            if (avatarEl) {
                const user = Auth.getUser();
                avatarEl.src = user.profile_image || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=4F7DF7&color=fff&size=64`;
            }
            if (nameEl) {
                const user = Auth.getUser();
                nameEl.textContent = user.name || 'Guest';
            }
            if (statusEl) {
                const isLoggedIn = Auth.isLoggedIn();
                statusEl.textContent = isLoggedIn ? 'Online' : 'Guest';
                statusEl.style.color = isLoggedIn ? 'var(--status-success)' : 'var(--text-tertiary)';
            }
        }

        // =====================================================================
        //  MODAL FUNCTIONS (unchanged)
        // =====================================================================
        function openProfile() {
            const user = Auth.getUser();
            const isLoggedIn = Auth.isLoggedIn();
            const email = isLoggedIn ? (user.email || '') : 'guest@zeta.tools';
            Modal.open(`
                <div class="p-5">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="relative">
                            <img src="${U.esc(user.profile_image)}" class="w-11 h-11 rounded-xl object-cover" style="border:1.5px solid var(--border-default)" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=4F7DF7&color=fff&size=64'">
                            <div class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full" style="background:var(--status-success);border:2px solid var(--bg-elevated)"></div>
                        </div>
                        <div>
                            <h3 class="text-sm font-semibold">${U.esc(user.name)}</h3>
                            <p class="text-xs" style="color:var(--text-tertiary)">${U.esc(email)}</p>
                        </div>
                    </div>
                    <div style="background:rgba(255,255,255,0.02);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 12px;font-size:12px">
                        <div class="flex justify-between py-1.5" style="border-bottom:1px solid var(--border-subtle)"><span style="color:var(--text-secondary)">Member since</span><span>${U.relTime(user.created_at)}</span></div>
                        <div class="flex justify-between py-1.5" style="border-bottom:1px solid var(--border-subtle)"><span style="color:var(--text-secondary)">Last active</span><span>${user.lastLogin ? U.relTime(user.lastLogin) : 'Never'}</span></div>
                        <div class="flex justify-between py-1.5"><span style="color:var(--text-secondary)">User ID</span><span class="font-mono text-xs" style="color:var(--text-tertiary)">${user.id.slice(0,8)}</span></div>
                        ${isLoggedIn ? `<div class="flex justify-between py-1.5" style="border-top:1px solid var(--border-subtle);margin-top:4px;padding-top:8px"><span style="color:var(--text-secondary)">Status</span><span style="color:var(--status-success)">Authenticated</span></div>` : ''}
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button class="bs flex-1" onclick="Modal.close()">Close</button>
                        ${isLoggedIn ? `<button class="bs flex-1" style="border-color:var(--status-error);color:var(--status-error)" onclick="Modal.close();Auth.logout()">Logout</button>` : ''}
                    </div>
                </div>
            `);
        }

        function openDataManagement() {
            Modal.open(
                `<div class="p-5"><h3 class="text-sm font-semibold mb-1"><i class="fa-solid fa-database mr-1.5" style="color:var(--accent-blue);font-size:12px"></i>Data Management</h3><p class="text-xs mb-3" style="color:var(--text-secondary)">Manage your stored data and history.</p><div class="data-mgmt"><button class="bs flex-1" onclick="clearAll()"><i class="fa-solid fa-trash-can mr-1" style="color:var(--status-error);font-size:11px"></i>Clear All</button><button class="bs flex-1" onclick="Modal.close();Toast.show('Data refreshed','success')"><i class="fa-solid fa-rotate mr-1" style="font-size:11px"></i>Refresh</button></div></div>`
                );
        }

        function openSettings() {
            Modal.open(
                `<div class="p-5"><h3 class="text-sm font-semibold mb-1"><i class="fa-solid fa-gear mr-1.5" style="color:var(--accent-blue);font-size:12px"></i>Settings</h3><p class="text-xs mb-3" style="color:var(--text-secondary)">App preferences and configuration.</p><div style="background:rgba(255,255,255,0.02);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 12px;font-size:12px"><div class="flex items-center justify-between py-1.5" style="border-bottom:1px solid var(--border-subtle)"><span style="color:var(--text-secondary)">Theme</span><span style="color:var(--text-primary)">Dark</span></div><div class="flex items-center justify-between py-1.5" style="border-bottom:1px solid var(--border-subtle)"><span style="color:var(--text-secondary)">Platform</span><span style="color:var(--text-tertiary)">Android</span></div><div class="flex items-center justify-between py-1.5"><span style="color:var(--text-secondary)">Version</span><span style="color:var(--text-tertiary)">ZETA v2.0</span></div></div><button class="bs w-full mt-3" onclick="Modal.close()">Close</button></div>`
                );
        }

        function clearAll() {
            Modal.open(
                `<div class="p-5 text-center"><div class="mb-3"><i class="fa-solid fa-triangle-exclamation" style="font-size:24px;color:var(--status-warning)"></i></div><h3 class="text-sm font-semibold mb-1">Clear All Data</h3><p class="text-xs mb-4" style="color:var(--text-secondary)">Deletes your profile and saved data. Cannot be undone.</p><div class="flex gap-2"><button class="bs flex-1" onclick="Modal.close()">Cancel</button><button class="flex-1 py-2.5 px-4 rounded-lg font-semibold text-xs border-none cursor-pointer" style="background:var(--status-error);color:#fff;transition:opacity var(--transition-fast)" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'" onclick="doClearAll()">Clear</button></div></div>`
                );
        }

        function doClearAll() { DB.clearAll();
            Modal.close();
            Toast.show('All data cleared', 'info');
            pgDashboard(); }

        // =====================================================================
        //  LOGIN / REGISTER MODAL (unchanged)
        // =====================================================================
        function openAuthModal(mode) {
            mode = mode || 'login';
            const isLogin = mode === 'login';
            const title = isLogin ? 'Sign In' : 'Create Account';
            const buttonText = isLogin ? 'Login' : 'Register';
            const toggleText = isLogin ? 'Don\'t have an account? Register' : 'Already have an account? Login';
            const toggleMode = isLogin ? 'register' : 'login';

            Modal.open(`
                <div class="p-5">
                    <h3 class="text-sm font-semibold mb-1"><i class="fa-solid fa-${isLogin ? 'right-to-bracket' : 'user-plus'} mr-1.5" style="color:var(--accent-blue);font-size:12px"></i>${title}</h3>
                    <p class="text-xs mb-3" style="color:var(--text-secondary)">${isLogin ? 'Enter your credentials to access your account.' : 'Create a new account to personalize your experience.'}</p>
                    <form id="authForm" onsubmit="return false;">
                        ${isLogin ? '' : `<div class="mb-2"><input type="text" id="authName" class="auth-input" placeholder="Full Name" required /></div>`}
                        <div class="mb-2"><input type="email" id="authEmail" class="auth-input" placeholder="Email Address" required /></div>
                        <div class="mb-2"><input type="password" id="authPassword" class="auth-input" placeholder="Password (min 6 chars)" required minlength="6" /></div>
                        <div id="authError" class="auth-error"></div>
                        <button type="submit" id="authSubmit" class="btn-primary w-full justify-center mt-2">${buttonText}</button>
                    </form>
                    <div class="auth-divider"><span>or</span></div>
                    <div class="text-center">
                        <span class="auth-toggle" onclick="Modal.close();openAuthModal('${toggleMode}')">${toggleText}</span>
                    </div>
                </div>
            `);

            setTimeout(() => {
                const form = document.getElementById('authForm');
                const errorEl = document.getElementById('authError');
                const submitBtn = document.getElementById('authSubmit');
                if (!form) return;

                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const email = document.getElementById('authEmail').value.trim();
                    const password = document.getElementById('authPassword').value;
                    const name = isLogin ? '' : document.getElementById('authName').value.trim();

                    errorEl.textContent = '';
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Please wait...';

                    const action = isLogin ? Auth.login(email, password) : Auth.register(email, password, name);
                    action.then(user => {
                        Modal.close();
                        const msg = isLogin ? `Welcome back, ${user.name}!` :
                            `Welcome, ${user.name}! Your account is ready.`;
                        Toast.show(msg, 'success');
                        window.dispatchEvent(new CustomEvent('user-update', { detail: { user: user } }));
                        pgDashboard();
                        setTimeout(() => navTo('downloads'), 400);
                    }).catch(err => {
                        errorEl.textContent = err.message || 'Something went wrong.';
                        submitBtn.disabled = false;
                        submitBtn.textContent = buttonText;
                    });
                });
            }, 50);
        }

        // =====================================================================

        // =====================================================================
        //  RENDER APK CARDS (unchanged)
        // =====================================================================
        function renderApkCards() {
            const apks = getApks();
            if (!apks.length) return '<p class="text-sm text-center py-8" style="color:var(--text-tertiary)">No APKs available.</p>';
            return apks.map(apk => {
                const color = apk.color || 'violet';
                const icon = apk.icon || 'fa-box';
                const title = U.esc(apk.title);
                const desc = U.esc(apk.description);
                const badge = apk.badge || 'Premium';
                const tags = apk.tags || [];
                const url = U.esc(apk.downloadUrl);
                return `<div class="dl-card reveal" style="--dl-a:rgba(124,92,252,0.18);--dl-b:rgba(124,92,252,0.06);--dl-glow:rgba(124,92,252,0.03)">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3.5 relative" style="z-index:2">
                        <div class="app-icon ${color}"><i class="fa-brands ${icon}"></i><span class="sp"><i class="fa-solid fa-sparkles"></i></span></div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center flex-wrap gap-2">
                                <div class="dl-title ${color}">${title}</div>
                                <span class="dl-badge ${color}"><i class="fa-solid fa-crown"></i> ${U.esc(badge)}</span>
                            </div>
                            <p class="dl-desc">${desc}</p>
                            <div class="dl-tags">
                                ${tags.map(t => `<span class="dl-tag"><i class="fa-regular fa-file"></i> ${U.esc(t)}</span>`).join('')}
                            </div>
                        </div>
                        <div class="w-full sm:w-auto flex-shrink-0">
                            <a href="${url}" target="_blank" rel="noopener noreferrer" class="dl-btn ${color}"><i class="fa-solid fa-download"></i> Download APK</a>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // =====================================================================
        //  RENDER FUNCTIONS
        // =====================================================================
        function initReveal() {
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible');
                        obs.unobserve(e.target); } });
            }, { threshold: 0.06, rootMargin: '0px 0px -20px 0px' });
            document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        }

            const user = Auth.getUser();

                    </div>
                </nav>
                <div style="height:100dvh;padding-top:54px;display:flex">

                        <div class="sb-head">
                            <div class="sb-head-logo">
                                <div class="sb-head-icon"><i class="fa-solid fa-bolt"></i></div>
                                <div>
                                    <div class="sb-head-name">ZETA <span>TOOLS</span></div>
                                    <div class="sb-head-ver">v2.0 &middot; Premium</div>
                                </div>
                            </div>
                        </div>
                        <nav class="sb-nav">
                            <button class="sb-nav-item" onclick="navTo('downloads')"><i class="fa-solid fa-download"></i> Downloads</button>
                            <button class="sb-nav-item" onclick="navTo('features')"><i class="fa-solid fa-layer-group"></i> Features</button>
                            <button class="sb-nav-item" onclick="navTo('about')"><i class="fa-solid fa-circle-info"></i> About</button>

                        <div class="sb-profile" onclick="togPM()" id="ptrig">

                                    <img src="${av}" id="sidebarAvatar" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=4F7DF7&color=fff&size=64'" />

                        localStorage.removeItem('z_just_logged_in');

                    }
                }
            } else {
                sessionStorage.removeItem('z_welcome_shown');
            }

            requestAnimationFrame(() => initReveal());
        }

        // Patch Auth.login to set a flag
        const _origLogin = Auth.login;
        Auth.login = function(email, password) {
            return _origLogin.call(this, email, password).then(user => {
                try { localStorage.setItem('z_just_logged_in', 'true'); } catch (e) {}
                return user;
            });
        };

        const _origRegister = Auth.register;
        Auth.register = function(email, password, name) {
            return _origRegister.call(this, email, password, name).then(user => {
                try { localStorage.setItem('z_just_logged_in', 'true'); } catch (e) {}
                return user;
            });
        };

        // =====================================================================
        //  INIT
        // =====================================================================
        (function() {
            document.documentElement.classList.add('dark');
            seedApks();
            pgDashboard();

            const hasLoggedInBefore = localStorage.getItem('z_has_logged_in');
            const isLoggedIn = Auth.isLoggedIn();
            const hasSeenAutoModal = sessionStorage.getItem('z_auto_modal_shown');

            if (!isLoggedIn && !hasLoggedInBefore && !hasSeenAutoModal) {
                sessionStorage.setItem('z_auto_modal_shown', 'true');
                setTimeout(() => { openAuthModal('login'); }, 600);
            }
        })();
    </script>
