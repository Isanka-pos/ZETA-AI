/* ===== NIC CHECKER ===== */
var NICChecker = {
  decode: function(nic, onDone, onError) {
    var url = new URL(CFG.NIC_API_URL);
    url.searchParams.set('apiKey', CFG.NIC_API_KEY);
    url.searchParams.set('text', nic);
    var ctrl = new AbortController();
    var timeout = setTimeout(function() { ctrl.abort(); }, 20000);

    fetch(url.toString(), { signal: ctrl.signal })
      .then(function(res) {
        clearTimeout(timeout);
        return res.text().then(function(raw) {
          var data;
          try { data = JSON.parse(raw); }
          catch (e) {
            console.error('[NICChecker] Non-JSON response (status ' + res.status + '):', raw.slice(0, 500));
            throw new Error(res.ok ? 'BAD_JSON' : 'API_ERR_' + res.status);
          }
          if (!res.ok) { console.error('[NICChecker] API error (status ' + res.status + '):', data); throw new Error('API_ERR_' + res.status); }
          return data;
        });
      })
      .then(function(data) {
        if (data.success === false || data.status === false) {
          console.error('[NICChecker] API returned an error payload:', data);
          throw new Error('API_MSG:' + (data.message || data.error || 'Invalid NIC number'));
        }
        var r = data.results || data.result || data.data || data;
        if (!r || !r.nic) { console.error('[NICChecker] Unrecognized response shape:', data); throw new Error('EMPTY'); }
        onDone(r);
      })
      .catch(function(e) {
        clearTimeout(timeout);
        console.error('[NICChecker] decode() failed:', e);
        if (e.name === 'AbortError') onError('Request timed out. Please try again.');
        else if (e.message === 'EMPTY') onError('Could not read NIC details from the response.');
        else if (e.message === 'BAD_JSON') onError('Service sent back an unexpected response.');
        else if (e.message.indexOf('API_MSG:') === 0) onError(e.message.slice(8));
        else if (e.message.indexOf('API_ERR_402') === 0) onError('Service quota/credits exhausted (HTTP 402).');
        else if (e.message.indexOf('API_ERR_401') === 0 || e.message.indexOf('API_ERR_403') === 0) onError('API key rejected (HTTP ' + e.message.replace('API_ERR_', '') + ').');
        else if (e.message.indexOf('API_ERR_429') === 0) onError('Rate limited. Please wait a moment and try again.');
        else if (e.message.indexOf('API_ERR') === 0) onError('Service unavailable (' + e.message.replace('API_ERR_', 'HTTP ') + ').');
        else if (e.message.indexOf('fetch') >= 0 || e.message.indexOf('Network') >= 0 || e.message.indexOf('Failed') >= 0) onError('Network error. Check your connection.');
        else onError('Something went wrong. Please try again.');
      });
  }
};

function doLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('lbtn');
  var email = document.getElementById('le').value.trim();
  var pw = document.getElementById('lp').value;
  var rem = document.getElementById('lrem').checked;

  if (!email) { Toast.show('Please enter your email', 'error'); return; }
  if (!pw) { Toast.show('Please enter your password', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = spin() + ' Signing in...';

  // Small UX delay
  setTimeout(function() {
    try {
      var res = Auth.login(email, pw, rem);
      if (res.ok) {
        Toast.show('Welcome back, ' + res.user.name + '!', 'success');
        Router.go('/dashboard');
      } else {
        Toast.show(res.err, 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    } catch (err) {
      console.error('Login error:', err);
      Toast.show('An error occurred. Try clearing data & resetting.', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }, 500);
}

function togSB() { var s = document.getElementById('sb'), o = document.getElementById('sb-ov'); if (s) s.classList.toggle('open'); if (o) o.classList.toggle('active'); }
function clsSBM() { if (window.innerWidth < 768) { var s = document.getElementById('sb'), o = document.getElementById('sb-ov'); if (s) s.classList.remove('open'); if (o) o.classList.remove('active'); } }
function togPM() { Store.profileDropdown = !Store.profileDropdown; var m = document.getElementById('pmenu'); if (m) m.classList.toggle('hidden', !Store.profileDropdown); }
document.addEventListener('click', function(e) { if (Store.profileDropdown && !e.target.closest('#ptrig') && !e.target.closest('#pmenu')) { Store.profileDropdown = false; var m = document.getElementById('pmenu'); if (m) m.classList.add('hidden'); } });

/* ===== PROFILE ===== */
function openProfile() {
  Store.profileDropdown = false; var m = document.getElementById('pmenu'); if (m) m.classList.add('hidden');
  var user = Auth.getUser(); if (!user) return;
  Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Profile Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<div class="flex flex-col items-center mb-6"><div class="relative mb-3"><img src="' + U.esc(user.profile_image) + '" id="pprev" class="w-20 h-20 rounded-2xl object-cover" style="border:2px solid var(--brd)" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=e8922a&color=fff&size=128\'"><label class="absolute -bottom-1 -right-1 w-8 h-8 rounded-lg flex items-center justify-center cursor-pointer" style="background:var(--acc);color:#fff;font-size:12px;border:2px solid var(--bg2)"><i class="fa-solid fa-camera"></i><input type="file" accept="image/*" class="hidden" onchange="avChange(this)"></label></div><p class="text-xs" style="color:var(--tx3)">Click to change photo</p></div>' +
    '<form onsubmit="saveProf(event)">' + inp('pname', 'Name', 'text', user.name, { icon: 'fa-user' }) + inp('pemail', 'Email', 'email', user.email, { icon: 'fa-envelope' }) +
    '<div class="text-xs mb-4 p-3 rounded-lg" style="background:var(--bg3);color:var(--tx3)"><i class="fa-solid fa-circle-info mr-1"></i> Email is read-only.</div>' +
    '<button type="submit" class="bp" id="psbtn">Save Changes</button></form>' +
    '<div class="mt-6 pt-6" style="border-top:1px solid var(--brd)"><h4 class="font-display text-sm font-semibold mb-4">Change Password</h4><form onsubmit="chPw(event)">' + inp('opw', 'Current Password', 'password', '', { icon: 'fa-lock' }) + inp('npw1', 'New Password', 'password', '', { icon: 'fa-key' }) + inp('npw2', 'Confirm New Password', 'password', '', { icon: 'fa-key' }) +
    '<button type="submit" class="bs" id="cpbtn">Update Password</button></form></div></div>');
}
function avChange(inp) { var f = inp.files[0]; if (!f) return; if (f.size > 2097152) { Toast.show('Image must be under 2MB', 'error'); return; } var r = new FileReader(); r.onload = function(e) { var p = document.getElementById('pprev'); if (p) p.src = e.target.result; inp.dataset.du = e.target.result; }; r.readAsDataURL(f); }
function saveProf(e) {
  e.preventDefault(); var btn = document.getElementById('psbtn'); var n = document.getElementById('pname').value.trim();
  if (!n) { Toast.show('Name is required', 'error'); return; }
  btn.disabled = true; btn.innerHTML = spin() + ' Saving...';
  setTimeout(function() {
    var up = { name: n }; var ai = document.querySelector('input[type="file"][accept="image/*"]');
    if (ai && ai.dataset.du) up.profile_image = ai.dataset.du;
    DB.updateUser(Auth.getSession().userId, up); Toast.show('Profile updated', 'success'); Modal.close(); pgDashboard();
  }, 400);
}
function chPw(e) {
  e.preventDefault(); var btn = document.getElementById('cpbtn');
  var o = document.getElementById('opw').value, n = document.getElementById('npw1').value, n2 = document.getElementById('npw2').value;
  if (!o || !n || !n2) { Toast.show('Fill all password fields', 'error'); return; }
  if (n !== n2) { Toast.show('Passwords do not match', 'error'); return; }
  if (!U.validPw(n)) { Toast.show('Min 8 characters', 'error'); return; }
  btn.disabled = true; btn.innerHTML = spin() + ' Updating...';
  setTimeout(function() {
    var res = Auth.changePassword(Auth.getSession().userId, o, n);
    if (res.ok) { Toast.show('Password updated', 'success'); Modal.close(); }
    else { Toast.show(res.err, 'error'); btn.disabled = false; btn.textContent = 'Update Password'; }
  }, 400);
}

/* ===== NIC CHECKER ===== */
function openNicChecker() {
  Store.profileDropdown = false; var m = document.getElementById('pmenu'); if (m) m.classList.add('hidden');
  var user = Auth.getUser(); if (!user) return;
  var checks = DB.getNicChecks(user.id);
  Modal.open('<div class="p-6">' +
    '<div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-id-card mr-2" style="color:var(--acc)"></i>NIC Checker</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<p class="text-sm mb-4" style="color:var(--tx2)">Enter a Sri Lankan NIC number to decode birth date, gender, and format.</p>' +
    '<div class="flex gap-2 mb-2"><input type="text" id="ncin" class="ifield" placeholder="e.g. 705693323V or 200012345678" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doNicCheck();}"><button class="bp" id="ncbtn" style="width:auto;padding:12px 20px" onclick="doNicCheck()"><i class="fa-solid fa-magnifying-glass"></i></button></div>' +
    '<div id="ncres" class="mt-4"></div>' +
    (checks.length ? '<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="nclist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">' + checks.map(rNCI).join('') + '</div></div>' : '<div id="nclist"></div>') +
    '</div>');
  setTimeout(function() { var i = document.getElementById('ncin'); if (i) i.focus(); }, 50);
}
function doNicCheck() {
  var inp = document.getElementById('ncin'), btn = document.getElementById('ncbtn'), res = document.getElementById('ncres');
  var nic = inp.value.trim();
  if (!nic) { Toast.show('Enter a NIC number first', 'error'); return; }
  if (!/^\d{9}[vVxX]$|^\d{12}$/.test(nic)) { Toast.show('Enter a valid NIC (9 digits + V, or 12 digits)', 'error'); return; }

  btn.disabled = true; var orig = btn.innerHTML; btn.innerHTML = spin(14);
  NICChecker.decode(nic,
    function(r) {
      btn.disabled = false; btn.innerHTML = orig;
      res.innerHTML = rNCResult(r);
      var user = Auth.getUser();
      var entry = { id: U.id(), nic: r.nic, gender: r.gender, birthDate: r.birthDate, created_at: U.now() };
      DB.addNicCheck(user.id, entry);
      var list = document.getElementById('nclist');
      if (list) list.innerHTML = DB.getNicChecks(user.id).map(rNCI).join('');
      inp.value = '';
      Toast.show('NIC decoded', 'success');
    },
    function(err) { btn.disabled = false; btn.innerHTML = orig; Toast.show(err, 'error'); }
  );
}
function rNCResult(r) {
  return '<div class="nc-res">' +
    '<div class="nc-row"><span class="l">NIC</span><span class="v">' + U.esc(r.nic) + '</span></div>' +
    '<div class="nc-row"><span class="l">Format</span><span class="v">' + U.esc(r.format || '-') + '</span></div>' +
    '<div class="nc-row"><span class="l">Gender</span><span class="v">' + U.esc(r.gender || '-') + '</span></div>' +
    '<div class="nc-row"><span class="l">Birth Date</span><span class="v">' + U.esc(r.birthDate || '-') + '</span></div>' +
    '<div class="nc-row"><span class="l">Birth Year</span><span class="v">' + U.esc(String(r.birthYear || '-')) + '</span></div>' +
    '</div>';
}
function rNCI(l) {
  return '<div class="nc-hi"><i class="fa-solid fa-id-card" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">' + U.esc(l.nic) + '</div><div class="o">' + U.esc(l.gender || '') + (l.birthDate ? ' • ' + U.esc(l.birthDate) : '') + '</div></div>' +
    '<button class="nc-ib" title="Copy" onclick="cpText(\'' + U.esc(l.nic).replace(/'/g, "\\'") + '\')"><i class="fa-regular fa-copy"></i></button>' +
    '<button class="nc-ib" title="Delete" onclick="delNC(\'' + l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
}
function delNC(id) { var user = Auth.getUser(); if (!user) return; DB.deleteNicCheck(user.id, id); var list = document.getElementById('nclist'); if (list) list.innerHTML = DB.getNicChecks(user.id).map(rNCI).join(''); }
function cpText(t) { navigator.clipboard.writeText(t).then(function() { Toast.show('Copied', 'success'); }); }

/* ===== SETTINGS ===== */
function openSettings() {
  Store.profileDropdown = false; var m = document.getElementById('pmenu'); if (m) m.classList.add('hidden');
  var user = Auth.getUser(); if (!user) return;
  var dk = !document.documentElement.classList.contains('light');
  Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<div class="flex items-center justify-between p-4 rounded-lg mb-4" style="background:var(--bg3)"><div><div class="text-sm font-medium">Dark Mode</div><div class="text-xs" style="color:var(--tx3)">Toggle theme</div></div><div class="tt' + (dk ? ' on' : '') + '" id="ttgl" onclick="togTheme()"><div class="tth"></div></div></div>' +
    '<div class="grid grid-cols-2 gap-3"><div class="p-4 rounded-lg cursor-pointer border-2 transition-all text-center" style="background:#09090f;border-color:' + (dk ? 'var(--acc)' : 'var(--brd)') + '" onclick="setTh(true)"><div class="w-full h-16 rounded-lg mb-2" style="background:linear-gradient(135deg,#111118,#1a1a24)"></div><span class="text-sm font-medium" style="color:#eaeaf0">Dark</span></div><div class="p-4 rounded-lg cursor-pointer border-2 transition-all text-center" style="background:#f5f5f8;border-color:' + (!dk ? 'var(--acc)' : 'var(--brd)') + '" onclick="setTh(false)"><div class="w-full h-16 rounded-lg mb-2" style="background:linear-gradient(135deg,#fff,#eeeef2)"></div><span class="text-sm font-medium" style="color:#1a1a24">Light</span></div></div>' +
    '<button class="bp mt-4" onclick="saveSet()">Save Settings</button></div>');
}
function togTheme() { setTh(document.documentElement.classList.contains('light')); }
function setTh(d) { document.documentElement.classList.toggle('light', !d); document.documentElement.classList.toggle('dark', d); var t = document.getElementById('ttgl'); if (t) t.classList.toggle('on', d); }
function saveSet() { var u = Auth.getUser(); if (!u) return; var s = DB.getSettings(u.id); s.theme = document.documentElement.classList.contains('light') ? 'light' : 'dark'; DB.saveSettings(u.id, s); Toast.show('Settings saved', 'success'); Modal.close(); }

/* ===== LOGOUT ===== */
function doLogout() {
  Store.profileDropdown = false;
  Modal.open('<div class="p-6 text-center"><div class="mb-4"><i class="fa-solid fa-arrow-right-from-bracket" style="font-size:36px;color:var(--acc)"></i></div><h3 class="font-display text-lg font-semibold mb-2">Sign Out</h3><p class="text-sm mb-6" style="color:var(--tx2)">Are you sure?</p><div class="flex gap-3"><button class="bs flex-1" onclick="Modal.close()">Cancel</button><button class="flex-1 py-3 px-4 rounded-lg font-semibold text-sm border-none cursor-pointer" style="background:var(--acc);color:#fff" onclick="Modal.close();realLogout()">Sign Out</button></div></div>');
}
function realLogout() { Auth.logout(); Toast.show('Signed out', 'info'); Router.go('/login'); }

/* ===== ROUTES ===== */
Router.reg('/login', pgLogin);
Router.reg('/register', pgRegister);
Router.reg('/forgot-password', pgForgot);
Router.reg('/reset-password', pgReset);
Router.reg('/dashboard', pgDashboard);
Router.reg('/settings', function() { if (Auth.isLoggedIn()) { pgDashboard(); setTimeout(openSettings, 100); } else Router.go('/login'); });

/* ===== INIT ===== */
(function() {
  if (Auth.isLoggedIn()) { var s = DB.getSettings(Auth.getSession().userId); if (s && s.theme === 'light') { document.documentElement.classList.remove('dark'); document.documentElement.classList.add('light'); } }
  Router.init();
})();
</script>
</body>
</html>
