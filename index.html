<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZETA TOOLS — Sri Lankan Utility Suite</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Space Grotesk', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #09090f;
            --bg2: #111118;
            --bg3: #1a1a24;
            --bg4: #22222e;
            --brd: #2a2a38;
            --brd2: #35354a;
            --tx: #eaeaf0;
            --tx2: #9898b0;
            --tx3: #68688a;
            --acc: #e8922a;
            --acc-l: #f0a848;
            --acc-g: rgba(232, 146, 42, 0.15);
            --ok: #4ade80;
            --err: #f87171;
            --wrn: #fbbf24
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--tx);
            overflow: hidden;
            height: 100dvh
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', sans-serif
        }
        ::-webkit-scrollbar {
            width: 6px
        }
        ::-webkit-scrollbar-track {
            background: transparent
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brd2);
            border-radius: 3px
        }
        input,
        textarea,
        button,
        select {
            font-family: inherit
        }
        .auth-bg {
            position: fixed;
            inset: 0;
            background: var(--bg);
            overflow: hidden;
            z-index: 0
        }
        .auth-bg .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .22;
            animation: bf 20s ease-in-out infinite
        }
        .auth-bg .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: var(--acc);
            top: -10%;
            left: -10%
        }
        .auth-bg .blob:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #6366f1;
            bottom: -10%;
            right: -10%;
            animation-delay: -7s
        }
        .auth-bg .blob:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #ec4899;
            top: 50%;
            left: 50%;
            animation-delay: -14s
        }
        @keyframes bf {
            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }
            25% {
                transform: translate(50px, -50px) scale(1.1)
            }
            50% {
                transform: translate(-30px, 60px) scale(.9)
            }
            75% {
                transform: translate(40px, 30px) scale(1.05)
            }
        }
        .glass {
            background: rgba(17, 17, 24, .6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--brd)
        }
        .ifield {
            background: var(--bg3);
            border: 1px solid var(--brd);
            color: var(--tx);
            border-radius: 10px;
            padding: 12px 16px;
            width: 100%;
            font-size: 14px;
            transition: all .2s;
            outline: none
        }
        .ifield:focus {
            border-color: var(--acc);
            box-shadow: 0 0 0 3px var(--acc-g)
        }
        .ifield::placeholder {
            color: var(--tx3)
        }
        .ifield:disabled {
            opacity: .5;
            cursor: not-allowed
        }
        .bp {
            background: linear-gradient(135deg, var(--acc), var(--acc-l));
            color: #fff;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all .2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }
        .bp:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(232, 146, 42, .3)
        }
        .bp:active {
            transform: translateY(0)
        }
        .bp:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none
        }
        .bs {
            background: var(--bg3);
            border: 1px solid var(--brd);
            color: var(--tx);
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all .2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }
        .bs:hover {
            border-color: var(--brd2);
            background: var(--bg4)
        }
        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100dvh;
            background: var(--bg2);
            border-right: 1px solid var(--brd);
            display: flex;
            flex-direction: column;
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
            z-index: 40
        }
        @media(max-width:768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                transform: translateX(-100%)
            }
            .sidebar.open {
                transform: translateX(0)
            }
        }
        .sb-ov {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 35;
            backdrop-filter: blur(4px)
        }
        .sb-ov.active {
            display: block
        }
        .ci {
            padding: 10px 14px;
            margin: 2px 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all .15s;
            position: relative;
            overflow: hidden
        }
        .ci:hover {
            background: var(--bg3)
        }
        .ci.act {
            background: var(--acc-g);
            border: 1px solid rgba(232, 146, 42, .2)
        }
        .ci .db {
            opacity: 0;
            transition: opacity .15s;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg4);
            border: none;
            color: var(--tx3);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px
        }
        .ci:hover .db {
            opacity: 1
        }
        .ci .db:hover {
            color: var(--err);
            background: rgba(248, 113, 113, .1)
        }
        .mc {
            display: flex;
            gap: 16px;
            padding: 24px 0;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            animation: mi .3s ease
        }
        @keyframes mi {
            from {
                opacity: 0;
                transform: translateY(10px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        .ma {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600
        }
        .mu .ma {
            background: linear-gradient(135deg, var(--acc), var(--acc-l));
            color: #fff
        }
        .mai .ma {
            background: var(--bg4);
            color: var(--acc);
            border: 1px solid var(--brd)
        }
        .mt {
            flex: 1;
            min-width: 0
        }
        .mt .mn {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px
        }
        .mt .mtime {
            font-size: 11px;
            color: var(--tx3);
            margin-bottom: 8px
        }
        .mt .mx {
            font-size: 15px;
            line-height: 1.7;
            color: var(--tx);
            word-break: break-word
        }
        .mt .mx p {
            margin-bottom: 12px
        }
        .mt .mx p:last-child {
            margin-bottom: 0
        }
        .mt .mx h1,
        .mt .mx h2,
        .mt .mx h3 {
            font-family: 'Space Grotesk', sans-serif;
            margin: 20px 0 10px;
            font-weight: 600
        }
        .mt .mx h1 {
            font-size: 1.5em
        }
        .mt .mx h2 {
            font-size: 1.25em
        }
        .mt .mx h3 {
            font-size: 1.1em
        }
        .mt .mx ul,
        .mt .mx ol {
            padding-left: 20px;
            margin: 8px 0 12px
        }
        .mt .mx li {
            margin: 4px 0
        }
        .mt .mx blockquote {
            border-left: 3px solid var(--acc);
            padding: 8px 16px;
            margin: 12px 0;
            background: var(--acc-g);
            border-radius: 0 8px 8px 0
        }
        .mt .mx a {
            color: var(--acc-l);
            text-decoration: underline
        }
        .mt .mx table {
            border-collapse: collapse;
            margin: 12px 0;
            width: 100%
        }
        .mt .mx th,
        .mt .mx td {
            border: 1px solid var(--brd);
            padding: 8px 12px;
            text-align: left;
            font-size: 14px
        }
        .mt .mx th {
            background: var(--bg3);
            font-weight: 600
        }
        .mt .mx code:not(pre code) {
            background: var(--bg4);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--acc-l)
        }
        .mt .mx pre {
            margin: 12px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--brd)
        }
        .cbh {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--bg3);
            border-bottom: 1px solid var(--brd);
            font-size: 12px;
            color: var(--tx3)
        }
        .ccb {
            background: none;
            border: none;
            color: var(--tx3);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            transition: all .15s
        }
        .ccb:hover {
            color: var(--tx);
            background: var(--bg4)
        }
        .mact {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity .15s
        }
        .mc:hover .mact {
            opacity: 1
        }
        .mab {
            background: none;
            border: 1px solid transparent;
            color: var(--tx3);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all .15s
        }
        .mab:hover {
            color: var(--tx);
            background: var(--bg3);
            border-color: var(--brd)
        }
        .ciw {
            padding: 16px 24px 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%
        }
        .cib {
            background: var(--bg3);
            border: 1px solid var(--brd);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 8px;
            transition: all .2s
        }
        .cib:focus-within {
            border-color: var(--acc);
            box-shadow: 0 0 0 3px var(--acc-g)
        }
        .cib textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--tx);
            font-size: 15px;
            padding: 8px 12px;
            resize: none;
            outline: none;
            max-height: 200px;
            line-height: 1.5
        }
        .cib textarea::placeholder {
            color: var(--tx3)
        }
        .sbtn {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 10px;
            border: none;
            background: var(--acc);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            font-size: 16px
        }
        .sbtn:hover {
            background: var(--acc-l);
            transform: scale(1.05)
        }
        .sbtn:disabled {
            opacity: .3;
            cursor: not-allowed;
            transform: none
        }
        .ti {
            display: flex;
            gap: 4px;
            padding: 4px 0
        }
        .ti span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--tx3);
            animation: tb 1.4s infinite
        }
        .ti span:nth-child(2) {
            animation-delay: .2s
        }
        .ti span:nth-child(3) {
            animation-delay: .4s
        }
        @keyframes tb {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: .4
            }
            30% {
                transform: translateY(-8px);
                opacity: 1
            }
        }
        .tc {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        /* --- ENHANCED TOAST (PILL SHAPE + GLASS) --- */
        .toast {
            padding: 12px 20px 12px 24px;
            border-radius: 100px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: tin .4s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 200px;
            max-width: 420px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            font-weight: 500;
            letter-spacing: 0.2px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all .2s;
            cursor: default;
        }
        .toast.success {
            background: rgba(6, 95, 70, 0.85);
            color: #a7f3d0;
            border-color: rgba(16, 185, 129, 0.25);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.15);
        }
        .toast.error {
            background: rgba(127, 29, 29, 0.85);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.25);
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.15);
        }
        .toast.info {
            background: rgba(30, 58, 95, 0.85);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.25);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.15);
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            opacity: 0.4;
            font-size: 16px;
            padding: 4px 4px 4px 8px;
            transition: opacity .15s;
            line-height: 1;
            border-radius: 50%;
        }
        .toast .toast-close:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.15);
        }
        .toast i:first-child {
            font-size: 16px;
        }
        .toast span {
            flex: 1;
        }

        @keyframes tin {
            from {
                opacity: 0;
                transform: translateX(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        @keyframes tout {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(50px) scale(0.95);
            }
        }

        /* -------- MODAL & OTHERS -------- */
        .mo {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            animation: fi .2s ease
        }
        .moc {
            background: var(--bg2);
            border: 1px solid var(--brd);
            border-radius: 16px;
            max-width: 560px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            animation: modin .3s ease
        }
        @keyframes fi {
            from {
                opacity: 0
            }
            to {
                opacity: 1
            }
        }
        @keyframes modin {
            from {
                opacity: 0;
                transform: scale(.95) translateY(10px)
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }
        .wc {
            background: var(--bg3);
            border: 1px solid var(--brd);
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            transition: all .2s
        }
        .wc:hover {
            border-color: var(--acc);
            background: var(--acc-g);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(232, 146, 42, .1)
        }
        .dd {
            position: absolute;
            background: var(--bg2);
            border: 1px solid var(--brd);
            border-radius: 10px;
            padding: 6px;
            min-width: 200px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .4);
            animation: ddin .15s ease;
            z-index: 50
        }
        @keyframes ddin {
            from {
                opacity: 0;
                transform: translateY(-4px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        .ddi {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--tx2);
            transition: all .1s;
            border: none;
            background: none;
            width: 100%;
            text-align: left
        }
        .ddi:hover {
            background: var(--bg3);
            color: var(--tx)
        }
        .ddi.dng {
            color: var(--err)
        }
        .ddi.dng:hover {
            background: rgba(248, 113, 113, .1)
        }
        .ddv {
            height: 1px;
            background: var(--brd);
            margin: 4px 0
        }
        .tt {
            width: 44px;
            height: 24px;
            border-radius: 12px;
            background: var(--bg4);
            border: 1px solid var(--brd);
            cursor: pointer;
            position: relative;
            transition: all .2s
        }
        .tt.on {
            background: var(--acc);
            border-color: var(--acc)
        }
        .tth {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform .2s
        }
        .tt.on .tth {
            transform: translateX(20px)
        }
        .ri {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg4);
            outline: none
        }
        .ri::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--acc);
            cursor: pointer;
            border: 2px solid var(--bg2)
        }
        .nc-res {
            background: var(--acc-g);
            border: 1px solid rgba(232, 146, 42, .3);
            border-radius: 12px;
            padding: 16px;
            animation: mi .25s ease;
            display: flex;
            flex-direction: column;
            gap: 10px
        }
        .nc-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--brd)
        }
        .nc-row:last-child {
            border-bottom: none;
            padding-bottom: 0
        }
        .nc-row .l {
            font-size: 12px;
            color: var(--tx3);
            font-weight: 500
        }
        .nc-row .v {
            font-size: 14px;
            font-weight: 600;
            color: var(--tx)
        }
        .nc-ib {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg3);
            color: var(--tx2);
            transition: all .15s;
            font-size: 13px
        }
        .nc-ib:hover {
            background: var(--acc);
            color: #fff
        }
        .nc-hi {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            transition: background .15s
        }
        .nc-hi:hover {
            background: var(--bg3)
        }
        .nc-hi .o {
            font-size: 12px;
            color: var(--tx3)
        }
        .nc-hi .s {
            font-size: 13px;
            color: var(--acc-l);
            font-weight: 600
        }
        .lp {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            background: var(--bg4);
            border: 1px solid var(--brd2);
            color: var(--tx);
            margin-right: 6px;
            min-width: 36px;
            text-align: center
        }
        .lp.gold {
            background: var(--acc-g);
            border-color: var(--acc);
            color: var(--acc-l)
        }
        .lot-game-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            background: var(--bg4);
            color: var(--tx3);
            border: 1px solid var(--brd)
        }
        .lot-game-badge.dlb {
            background: rgba(232, 146, 42, .15);
            color: var(--acc-l);
            border-color: rgba(232, 146, 42, .25)
        }
        .pw-box {
            background: var(--bg3);
            border: 1px solid var(--brd);
            border-radius: 10px;
            padding: 14px 18px;
            font-family: 'Space Grotesk', monospace;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--acc-l);

        function filterTools(q) {

            Modal.open('<div class="p-6">' +

                '<div id="ncres" class="mt-4"></div>' +

        }

        function doNicCheck() {
            var inp = document.getElementById('ncin'),
                btn = document.getElementById('ncbtn'),
                res = document.getElementById('ncres');
            var nic = inp.value.trim();
            if (!nic) { Toast.show('Enter a NIC number first', 'error'); return; }
            if (!/^\d{9}[vVxX]$|^\d{12}$/.test(nic)) { Toast.show('Enter a valid NIC (9 digits + V, or 12 digits)',
                    'error'); return; }

            btn.disabled = true;
            var orig = btn.innerHTML;
            btn.innerHTML = spin(14);
            NICChecker.decode(nic,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rNCResult(r);
                    var user = Auth.getUser();
                    var entry = { id: U.id(), nic: r.nic, gender: r.gender, birthDate: r.birthDate,
                        created_at: U.now() };
                    DB.addNicCheck(user.id, entry);
                    var list = document.getElementById('nclist');
                    if (list) list.innerHTML = DB.getNicChecks(user.id).map(rNCI).join('');
                    inp.value = '';
                    Toast.show('NIC decoded', 'success');
                },
                function(err) { btn.disabled = false;
                    btn.innerHTML = orig;
                    Toast.show(err, 'error'); }
            );
        }

                '</span></div>' +
                '<div class="nc-row"><span class="l">Gender</span><span class="v">' + U.esc(r.gender || '-') +

                '<div class="nc-row"><span class="l">Birth Date</span><span class="v">' + U.esc(r.birthDate || '-') +

                '<div class="nc-row"><span class="l">Birth Year</span><span class="v">' + U.esc(String(r.birthYear ||
                    '-')) + '</span></div>' +
                '</div>';
        }

            return '<div class="nc-hi"><i class="fa-solid fa-id-card" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">' +

        function cpText(t) { navigator.clipboard.writeText(t).then(function() { Toast.show('Copied', 'success'); }); }

        /* ===== LKR EXCHANGE RATE ===== */
        var FX_CODES = [
            { c: 'USD', n: 'US Dollar' }, { c: 'GBP', n: 'British Pound' }, { c: 'EUR', n: 'Euro' },
            { c: 'AUD', n: 'Australian Dollar' }, { c: 'CAD', n: 'Canadian Dollar' }, { c: 'JPY', n: 'Japanese Yen' },
            { c: 'INR', n: 'Indian Rupee' }, { c: 'AED', n: 'UAE Dirham' }, { c: 'SAR', n: 'Saudi Riyal' },

        function openCurrency() {
            Store.profileDropdown = false;
            var m = document.getElementById('pmenu');
            if (m) m.classList.add('hidden');
            var user = Auth.getUser();
            if (!user) return;
            var checks = DB.getFxChecks(user.id);
            Modal.open('<div class="p-6">' +
                '<div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-money-bill-transfer mr-2" style="color:var(--acc)"></i>LKR Exchange Rate</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
                '<p class="text-sm mb-4" style="color:var(--tx2)">Check the live rate for any currency against the Sri Lankan Rupee.</p>' +
                '<div class="grid grid-cols-2 gap-2 mb-2">' +
                '<div><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">CURRENCY</label><select id="fxcode" class="ifield" style="padding:12px">' +
                FX_CODES.map(function(f) { return '<option value="' + f.c + '">' + f.c + ' — ' + f.n +
                    '</option>'; }).join('') + '</select></div>' +
                '<div><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">AMOUNT</label><input type="number" id="fxamt" class="ifield" value="1" min="0" step="any" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doFxCheck();}"></div>' +
                '</div>' +
                '<button class="bp mt-1" id="fxbtn" onclick="doFxCheck()"><i class="fa-solid fa-arrow-right-arrow-left"></i> Get Rate</button>' +
                '<div id="fxres" class="mt-4"></div>' +
                (checks.length ? '<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="fxlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">' +
                    checks.map(rFXI).join('') + '</div></div>' : '<div id="fxlist"></div>') +
                '</div>');
        }

        function doFxCheck() {
            var sel = document.getElementById('fxcode'),
                amtIn = document.getElementById('fxamt'),
                btn = document.getElementById('fxbtn'),
                res = document.getElementById('fxres');
            var code = sel.value;
            var amt = parseFloat(amtIn.value);
            if (isNaN(amt) || amt < 0) { Toast.show('Enter a valid amount', 'error'); return; }

            btn.disabled = true;
            var orig = btn.innerHTML;
            btn.innerHTML = spin(14);
            CurrencyAPI.getRate(code,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rFXResult(r, amt);
                    var user = Auth.getUser();
                    var entry = { id: U.id(), code: r.from, rate: r.rate, amount: amt, converted: amt * r.rate,
                        created_at: U.now() };
                    DB.addFxCheck(user.id, entry);
                    var list = document.getElementById('fxlist');
                    if (list) list.innerHTML = DB.getFxChecks(user.id).map(rFXI).join('');
                    Toast.show('Rate updated', 'success');
                },
                function(err) { btn.disabled = false;
                    btn.innerHTML = orig;
                    Toast.show(err, 'error'); }
            );
        }

        function rFXResult(r, amt) {
            var converted = (amt * r.rate).toLocaleString('en-LK', { maximumFractionDigits: 2 });
            var updated = r.last_updated_utc ? U.relTime(r.last_updated_utc) : '-';
            return '<div class="nc-res">' +
                '<div class="text-center mb-1" style="padding:8px 0"><div class="text-2xl font-display font-bold" style="color:var(--acc)">Rs. ' +
                converted + '</div><div class="text-xs mt-1" style="color:var(--tx3)">' + U.esc(String(amt)) + ' ' +
                U.esc(r.from) + ' converted to LKR</div></div>' +
                '<div class="nc-row"><span class="l">Rate (1 ' + U.esc(r.from) + ')</span><span class="v">Rs. ' + U
                .esc(String(r.rate)) + '</span></div>' +
                '<div class="nc-row"><span class="l">Inverse Rate</span><span class="v">' + U.esc(String(r
                    .inverse_rate || '-')) + '</span></div>' +
                '<div class="nc-row"><span class="l">Last Updated</span><span class="v">' + U.esc(updated) +
                '</span></div>' +
                '<div class="nc-row"><span class="l">Source</span><span class="v">' + U.esc(r.source || '-') +
                '</span></div>' +
                '</div>';
        }

        function rFXI(l) {
            var conv = (l.converted || 0).toLocaleString('en-LK', { maximumFractionDigits: 2 });
            return '<div class="nc-hi"><i class="fa-solid fa-money-bill-transfer" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">' +
                U.esc(String(l.amount)) + ' ' + U.esc(l.code) + ' → Rs. ' + conv +
                '</div><div class="o">Rate: ' + U.esc(String(l.rate)) + ' • ' + U.esc(U.relTime(l.created_at)) +
                '</div></div>' +
                '<button class="nc-ib" title="Copy" onclick="cpText(\'' + conv.replace(/'/g, "\\'") +
                '\')"><i class="fa-regular fa-copy"></i></button>' +
                '<button class="nc-ib" title="Delete" onclick="delFX(\'' + l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
        }

        function delFX(id) { var user = Auth.getUser(); if (!user) return;
            DB.deleteFxCheck(user.id, id); var list = document.getElementById('fxlist'); if (list) list.innerHTML = DB
                .getFxChecks(user.id).map(rFXI).join(''); }

        /* ===== LOTTERY CHECKER ===== */
        var LOTTERY_GAMES = [
            { label: 'Sasiri', value: 'sasiri' }
        ];

        function openLotteryChecker() {
            Store.profileDropdown = false;
            var m = document.getElementById('pmenu');
            if (m) m.classList.add('hidden');
            var user = Auth.getUser();
            if (!user) return;
            var checks = DB.getLotteryChecks(user.id);

            var pills = LOTTERY_GAMES.map(function(g) {
                return '<button class="text-xs px-3 py-1 rounded-full border border-[var(--brd)] hover:border-[var(--acc)] hover:bg-[var(--acc-g)] transition-all" style="color:var(--tx2)" onclick="document.getElementById(\'lotgame\').value=\'' +
                    g.value + '\';doLotteryCheck();">' + U.esc(g.label) + '</button>';
            }).join('');

            Modal.open('<div class="p-6">' +
                '<div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-ticket mr-2" style="color:var(--acc)"></i>Lottery Checker</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
                '<p class="text-sm mb-4" style="color:var(--tx2)">Enter a Sri Lankan lottery game name (e.g. <strong>sasiri</strong>) to get the latest draw results.</p>' +
                '<div class="flex flex-wrap gap-2 mb-3">' + pills + '</div>' +
                '<div class="flex gap-2"><input type="text" id="lotgame" class="ifield" placeholder="Game name…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doLotteryCheck();}"><button class="bp" id="lotbtn" style="width:auto;padding:12px 20px" onclick="doLotteryCheck()"><i class="fa-solid fa-magnifying-glass"></i></button></div>' +
                '<div id="lotres" class="mt-4"></div>' +
                (checks.length ? '<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="lotlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">' +
                    checks.map(rLotteryItem).join('') + '</div></div>' : '<div id="lotlist"></div>') +
                '</div>');
            setTimeout(function() { var i = document.getElementById('lotgame'); if (i) i.focus(); }, 50);
        }

        function doLotteryCheck() {
            var inp = document.getElementById('lotgame'),
                btn = document.getElementById('lotbtn'),
                res = document.getElementById('lotres');
            var game = inp.value.trim();
            if (!game) { Toast.show('Enter a lottery game name', 'error'); return; }

            btn.disabled = true;
            var orig = btn.innerHTML;
            btn.innerHTML = spin(14);
            LotteryAPI.fetch(game,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rLotteryResult(r);
                    var user = Auth.getUser();
                    var entry = {
                        id: U.id(),
                        game: r.game,
                        board: r.board || 'DLB',
                        draw_number: r.draw_number || '-',
                        date: r.date || '-',
                        numbers: r.numbers || [],
                        source_url: r.source_url || '',
                        disclaimer: r.disclaimer || '',
                        created_at: U.now()
                    };
                    DB.addLotteryCheck(user.id, entry);
                    var list = document.getElementById('lotlist');
                    if (list) list.innerHTML = DB.getLotteryChecks(user.id).map(rLotteryItem).join('');
                    Toast.show('Lottery results loaded', 'success');
                },
                function(err) { btn.disabled = false;
                    btn.innerHTML = orig;
                    Toast.show(err, 'error'); }
            );
        }

        function rLotteryResult(r) {
            var nums = (r.numbers || []).map(function(n) { return '<span class="lp gold">' + U.esc(String(n)) +
                '</span>'; }).join('');
            var boardClass = (r.board || '').toLowerCase() === 'dlb' ? 'dlb' : '';
            return '<div class="nc-res">' +
                '<div class="text-center mb-1" style="padding:4px 0"><span class="lot-game-badge ' + boardClass +
                '">' + U.esc(r.board || 'DLB') + '</span></div>' +
                '<div class="nc-row"><span class="l">Game</span><span class="v" style="text-transform:capitalize">' +
                U.esc(r.game || '-') + '</span></div>' +
                '<div class="nc-row"><span class="l">Draw Number</span><span class="v">' + U.esc(r.draw_number ||
                    '-') + '</span></div>' +
                '<div class="nc-row"><span class="l">Date</span><span class="v">' + U.esc(r.date || '-') +
                '</span></div>' +
                '<div class="nc-row" style="flex-wrap:wrap"><span class="l">Winning Numbers</span><span class="v" style="flex-wrap:wrap;display:flex;gap:4px;justify-content:flex-end">' +
                nums + '</span></div>' +
                (r.source_url ? '<div class="nc-row"><span class="l">Source</span><span class="v"><a href="' + U
                    .esc(r.source_url) +
                '" target="_blank" rel="noopener noreferrer" style="color:var(--acc-l);text-decoration:underline;font-size:13px">results.govdoc.lk</a></span></div>' :
                    '') +
                (r.disclaimer ? '<div class="mt-2 text-xs" style="color:var(--tx3);line-height:1.4">' + U.esc(r
                    .disclaimer) + '</div>' : '') +
                '</div>';
        }

        function rLotteryItem(l) {
            var nums = (l.numbers || []).slice(0, 3).map(function(n) { return U.esc(String(n)); }).join(' ');
            var suffix = (l.numbers || []).length > 3 ? ' …' : '';
            var boardLabel = (l.board || 'DLB').toUpperCase();
            return '<div class="nc-hi"><i class="fa-solid fa-ticket" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">' +
                U.esc(l.game) + ' #' + U.esc(l.draw_number || '-') + ' — ' + nums + suffix +
                '</div><div class="o">' + boardLabel + ' • ' + U.esc(l.date || '') + ' • ' + U.esc(U.relTime(l
                    .created_at)) + '</div></div>' +
                '<button class="nc-ib" title="Copy" onclick="cpText(\'' + (l.numbers || []).join(' ').replace(/'/g,
                    "\\'") + '\')"><i class="fa-regular fa-copy"></i></button>' +
                '<button class="nc-ib" title="Delete" onclick="delLot(\'' + l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
        }

        function delLot(id) { var user = Auth.getUser(); if (!user) return;
            DB.deleteLotteryCheck(user.id, id); var list = document.getElementById('lotlist'); if (list) list.innerHTML =
                DB.getLotteryChecks(user.id).map(rLotteryItem).join(''); }

        /* ===== PASSWORD GENERATOR ===== */
        function openPasswordGenerator() {
            Store.profileDropdown = false;
            var m = document.getElementById('pmenu');
            if (m) m.classList.add('hidden');
            var user = Auth.getUser();
            if (!user) return;
            var entries = DB.getPasswordEntries(user.id);

            Modal.open('<div class="p-6">' +
                '<div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-key mr-2" style="color:var(--acc)"></i>Password Generator</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
                '<p class="text-sm mb-4" style="color:var(--tx2)">Generate a secure, random password with a custom length.</p>' +
                '<div class="mb-4">' +
                '<label class="block text-xs font-medium mb-1" style="color:var(--tx3)">PASSWORD LENGTH</label>' +
                '<div class="pw-length-selector">' +
                '<input type="range" id="pwrange" class="ri" min="6" max="32" value="16" oninput="document.getElementById(\'pwlen\').textContent=this.value">' +
                '<span class="length-label" id="pwlen">16</span>' +
                '</div>' +
                '</div>' +
                '<button class="bp" id="pwbtn" onclick="doGeneratePassword()"><i class="fa-solid fa-rotate"></i> Generate Password</button>' +
                '<div id="pwres" class="mt-4"></div>' +
                (entries.length ? '<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="pwlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">' +
                    entries.map(rPasswordItem).join('') + '</div></div>' : '<div id="pwlist"></div>') +
                '</div>');
            setTimeout(function() { doGeneratePassword(); }, 100);
        }

        function doGeneratePassword() {
            var range = document.getElementById('pwrange');
            var btn = document.getElementById('pwbtn');
            var res = document.getElementById('pwres');
            var length = parseInt(range.value, 10);
            if (isNaN(length) || length < 6 || length > 32) { Toast.show('Please select a length between 6 and 32',
                    'error'); return; }

            btn.disabled = true;
            var orig = btn.innerHTML;
            btn.innerHTML = spin(14);
            PasswordAPI.generate(length,
                function(r) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    res.innerHTML = rPasswordResult(r);
                    var user = Auth.getUser();
                    var entry = { id: U.id(), password: r.password, length: r.length, created_at: U.now() };
                    DB.addPasswordEntry(user.id, entry);
                    var list = document.getElementById('pwlist');
                    if (list) list.innerHTML = DB.getPasswordEntries(user.id).map(rPasswordItem).join('');
                    Toast.show('Password generated', 'success');
                },
                function(err) {
                    btn.disabled = false;
                    btn.innerHTML = orig;
                    Toast.show(err, 'error');
                }
            );
        }

        function rPasswordResult(r) {
            var pw = U.esc(r.password);
            return '<div class="nc-res">' +
                '<div class="pw-box">' +
                '<span class="font-mono tracking-wide">' + pw + '</span>' +
                '<button class="copy-btn" onclick="cpText(\'' + pw.replace(/'/g, "\\'") +
                '\')" title="Copy to clipboard"><i class="fa-regular fa-copy"></i></button>' +
                '</div>' +
                '<div class="nc-row"><span class="l">Length</span><span class="v">' + U.esc(String(r.length)) +
                '</span></div>' +
                '</div>';
        }

        function rPasswordItem(l) {
            var pw = U.esc(l.password);
            return '<div class="nc-hi"><i class="fa-solid fa-key" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s font-mono text-sm tracking-wide">' +
                pw + '</div><div class="o">Length ' + U.esc(String(l.length)) + ' • ' + U.esc(U.relTime(l
                    .created_at)) + '</div></div>' +
                '<button class="nc-ib" title="Copy" onclick="cpText(\'' + pw.replace(/'/g, "\\'") +
                '\')"><i class="fa-regular fa-copy"></i></button>' +
                '<button class="nc-ib" title="Delete" onclick="delPw(\'' + l.id + '\')"><i class="fa-solid fa-xmark"></i></button></div>';
        }

        function delPw(id) { var user = Auth.getUser(); if (!user) return;
            DB.deletePasswordEntry(user.id, id); var list = document.getElementById('pwlist'); if (list) list.innerHTML =
                DB.getPasswordEntries(user.id).map(rPasswordItem).join(''); }

        /* ===== SETTINGS ===== */
        function openSettings() {
            Store.profileDropdown = false;
            var m = document.getElementById('pmenu');
            if (m) m.classList.add('hidden');
            var user = Auth.getUser();
            if (!user) return;
            Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div>' +
                '<div class="flex items-center gap-3 p-4 rounded-lg mb-4" style="background:var(--bg3)"><i class="fa-solid fa-moon" style="color:var(--acc)"></i><div><div class="text-sm font-medium">Dark Mode</div><div class="text-xs" style="color:var(--tx3)">Always on for this app</div></div></div>' +
                '<button class="bs" onclick="clearAll()"><i class="fa-solid fa-trash-can"></i> Clear all data</button></div>'
                );
        }

        /* ===== ROUTES ===== */
        Router.reg('/dashboard', pgDashboard);
        Router.reg('/settings', function() { pgDashboard();
            setTimeout(openSettings, 100); });

        /* ===== INIT ===== */
        (function() {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            if (!Router.cur() || Router.cur() === '/login' || Router.cur() === '/register') Router.go('/dashboard');
            Router.init();
        })();
    </script>
</body>
</html>
