<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZETA TOOLS — Sri Lankan Utility Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { display: ['Space Grotesk','sans-serif'], body: ['DM Sans','sans-serif'] } } }
        }
    </script>
    <style>
        :root {
            --bg:#09090f;--bg2:#0d0d14;--bg3:#16161f;--bg4:#22222e;
            --brd:#1f1f2e;--brd2:#2d2d40;--tx:#eaeaf0;--tx2:#9898b0;--tx3:#5e5e7a;
            --acc:#e8922a;--acc-l:#f0a848;--acc-g:rgba(232,146,42,0.1);
            --ok:#4ade80;--err:#f87171;--wrn:#fbbf24
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;height:100dvh}
        h1,h2,h3,h4,h5,h6{font-family:'Space Grotesk',sans-serif}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
        input,textarea,button,select{font-family:inherit}

        /* ═══════════════════════════════════════
           PREMIUM SIDEBAR
           ═══════════════════════════════════════ */
        .sidebar {
            width: 280px;
            min-width: 280px;
            height: 100dvh;
            background: linear-gradient(180deg, #0c0c15 0%, #0a0a12 100%);
            border-right: 1px solid var(--brd);
            display: flex;
            flex-direction: column;
            transition: transform .3s cubic-bezier(.4,0,.2,1);
            z-index: 40;
            position: relative;
            overflow: hidden;
        }
        /* subtle vertical glow line on right edge */
        .sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: -1px;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, transparent 0%, rgba(232,146,42,0.15) 30%, rgba(232,146,42,0.25) 50%, rgba(232,146,42,0.15) 70%, transparent 100%);
            pointer-events: none;
        }
        @media(max-width:768px) {
            .sidebar { position:fixed; left:0; top:0; transform:translateX(-100%) }
            .sidebar.open { transform:translateX(0) }
        }

        /* Logo brand area */
        .sb-brand {
            padding: 24px 20px 20px;
            position: relative;
        }
        .sb-brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .sb-brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--acc), #d4781a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 4px 16px rgba(232,146,42,0.25);
            flex-shrink: 0;
            position: relative;
        }
        .sb-brand-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(232,146,42,0.4), transparent 60%);
            z-index: -1;
            filter: blur(4px);
        }
        .sb-brand-text {
            font-family: 'Space Grotesk', sans-serif;
        }
        .sb-brand-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--tx);
            line-height: 1;
        }
        .sb-brand-sub {
            font-size: 10px;
            font-weight: 500;
            color: var(--tx3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 3px;
        }
        .sb-version-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(232,146,42,0.08);
            border: 1px solid rgba(232,146,42,0.12);
            color: var(--acc-l);
            letter-spacing: 0.5px;
        }

        /* Search */
        .sb-search {
            padding: 0 16px;
            margin-bottom: 8px;
        }
        .sb-search-wrap {
            position: relative;
        }
        .sb-search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tx3);
            font-size: 12px;
            transition: color .2s;
        }
        .sb-search-wrap input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--brd);
            border-radius: 12px;
            padding: 10px 14px 10px 38px;
            font-size: 13px;
            color: var(--tx);
            outline: none;
            transition: all .2s;
        }
        .sb-search-wrap input::placeholder { color: var(--tx3) }
        .sb-search-wrap input:focus {
            border-color: rgba(232,146,42,0.3);
            background: rgba(232,146,42,0.04);
            box-shadow: 0 0 0 3px rgba(232,146,42,0.06);
        }
        .sb-search-wrap input:focus + i,
        .sb-search-wrap:focus-within i { color: var(--acc-l) }

        /* Section label */
        .sb-section-label {
            padding: 16px 20px 8px;
            font-size: 10px;
            font-weight: 700;
            color: var(--tx3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Category nav items — premium */
        .sb-cat {
            margin: 2px 12px;
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid transparent;
            transition: all .2s;
            cursor: pointer;
        }
        .sb-cat:hover {
            background: rgba(255,255,255,0.025);
            border-color: var(--brd);
        }
        .sb-cat-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            transition: all .15s;
        }
        .sb-cat-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            transition: all .2s;
        }
        .sb-cat:hover .sb-cat-icon {
            transform: scale(1.05);
        }
        .sb-cat-info {
            flex: 1;
            min-width: 0;
        }
        .sb-cat-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--tx);
            line-height: 1.2;
        }
        .sb-cat-count {
            font-size: 11px;
            color: var(--tx3);
            margin-top: 1px;
        }
        .sb-cat-arrow {
            color: var(--tx3);
            font-size: 11px;
            transition: all .2s;
            opacity: 0;
        }
        .sb-cat:hover .sb-cat-arrow { opacity: 1; transform: translateX(2px); }

        /* User profile at bottom */
        .sb-profile {
            margin: auto 12px 12px;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(232,146,42,0.06) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(232,146,42,0.1);
            cursor: pointer;
            transition: all .25s;
            position: relative;
            overflow: hidden;
        }
        .sb-profile::before {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(232,146,42,0.06);
            pointer-events: none;
        }
        .sb-profile:hover {
            border-color: rgba(232,146,42,0.2);
            background: linear-gradient(135deg, rgba(232,146,42,0.1) 0%, rgba(255,255,255,0.03) 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(232,146,42,0.08);
        }
        .sb-profile-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        .sb-profile-avatar {
            position: relative;
            flex-shrink: 0;
        }
        .sb-profile-avatar img {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(232,146,42,0.2);
        }
        .sb-profile-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--ok);
            border: 2px solid #0d0d14;
            box-shadow: 0 0 6px rgba(74,222,128,0.4);
        }
        .sb-profile-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--tx);
            line-height: 1.2;
        }
        .sb-profile-status {
            font-size: 11px;
            color: var(--ok);
            margin-top: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sb-profile-status::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--ok);
        }
        .sb-profile-ellipsis {
            margin-left: auto;
            color: var(--tx3);
            font-size: 14px;
            transition: color .15s;
        }
        .sb-profile:hover .sb-profile-ellipsis { color: var(--acc-l) }

        /* ═══════════════════════════════════════
           HEADER BAR
           ═══════════════════════════════════════ */
        .zeta-header {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 20px;
            height: 68px;
            min-height: 68px;
            background: linear-gradient(135deg, rgba(13,13,20,0.95) 0%, rgba(22,22,31,0.92) 50%, rgba(13,13,20,0.95) 100%);
            border-bottom: 1px solid var(--brd);
            overflow: hidden;
            z-index: 1;
        }
        .zeta-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--acc) 20%, var(--acc-l) 50%, var(--acc) 80%, transparent 100%);
            background-size: 200% 100%;
            animation: headerLine 3s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes headerLine { 0%,100%{background-position:200% 0} 50%{background-position:0% 0} }
        .header-glow { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:260px;height:60px;background:radial-gradient(ellipse,rgba(232,146,42,0.08) 0%,transparent 70%);pointer-events:none;z-index:0;animation:glowPulse 4s ease-in-out infinite alternate }
        @keyframes glowPulse { 0%{opacity:.6;transform:translate(-50%,-50%) scale(1)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1.2)} }
        .header-title { position:relative;z-index:1;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#f0a848 0%,#e8922a 40%,#f5c76e 70%,#e8922a 100%);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShine 5s ease-in-out infinite;line-height:1;user-select:none }
        @keyframes titleShine { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .header-subtitle { position:relative;z-index:1;font-size:11px;font-weight:500;color:var(--tx3);letter-spacing:2.5px;text-transform:uppercase;line-height:1;margin-top:2px }
        .header-btn { position:relative;z-index:1;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--brd);background:var(--bg3);color:var(--tx2);cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);font-size:15px;flex-shrink:0 }
        .header-btn:hover { border-color:var(--acc);color:var(--acc-l);background:var(--acc-g);transform:translateY(-1px);box-shadow:0 4px 16px rgba(232,146,42,0.15) }
        .header-btn:active { transform:translateY(0) scale(.96) }
        .header-divider { width:1px;height:28px;background:linear-gradient(to bottom,transparent,var(--brd2),transparent);flex-shrink:0 }

        /* ═══════════════════════════════════════
           CONTENT AREA
           ═══════════════════════════════════════ */
        .dot-grid-bg { position:relative }
        .dot-grid-bg::before { content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(232,146,42,0.06) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;animation:dotDrift 30s linear infinite }
        @keyframes dotDrift { 0%{background-position:0 0} 100%{background-position:28px 28px} }
        .dot-grid-bg::after { content:'';position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:500px;height:360px;background:radial-gradient(ellipse,rgba(232,146,42,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;animation:heroGlow 6s ease-in-out infinite alternate }
        @keyframes heroGlow { 0%{opacity:.5;transform:translateX(-50%) scale(1)} 100%{opacity:1;transform:translateX(-50%) scale(1.15)} }
        .hero-particles { position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden }
        .hero-particles span { position:absolute;width:3px;height:3px;border-radius:50%;background:var(--acc);opacity:0;animation:particleFloat linear infinite }
        @keyframes particleFloat { 0%{opacity:0;transform:translateY(0) scale(0)} 15%{opacity:.6;transform:scale(1)} 85%{opacity:.3} 100%{opacity:0;transform:translateY(-160px) scale(0)} }
        .bolt-glow { animation:boltPulse 2.5s ease-in-out infinite }
        @keyframes boltPulse { 0%,100%{filter:drop-shadow(0 0 12px rgba(232,146,42,0.3));transform:scale(1)} 50%{filter:drop-shadow(0 0 28px rgba(232,146,42,0.7));transform:scale(1.08)} }
        .wc { background:var(--bg3);border:1px solid var(--brd);border-radius:14px;padding:20px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;opacity:0;transform:translateY(16px);animation:cardIn .5s ease forwards }
        .wc::before { content:'';position:absolute;inset:-1px;border-radius:14px;padding:1px;background:linear-gradient(135deg,transparent 40%,var(--acc) 50%,transparent 60%);background-size:300% 300%;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;animation:borderShift 3s linear infinite }
        .wc:hover::before { opacity:1 }
        @keyframes borderShift { 0%{background-position:0% 0%} 100%{background-position:300% 300%} }
        .wc:hover { border-color:transparent;background:var(--bg3);transform:translateY(-3px);box-shadow:0 12px 32px rgba(232,146,42,0.08),0 2px 8px rgba(0,0,0,0.3) }
        .wc:hover .wc-icon { transform:scale(1.1) rotate(-3deg);box-shadow:0 0 20px rgba(232,146,42,0.2) }
        .wc-icon { transition:all .3s cubic-bezier(.4,0,.2,1) }
        @keyframes cardIn { to{opacity:1;transform:translateY(0)} }
        .logo-shimmer { position:relative;display:inline-block }
        .logo-shimmer::after { content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);transform:skewX(-15deg);animation:shimmer 5s ease-in-out infinite;pointer-events:none }
        @keyframes shimmer { 0%,80%,100%{left:-60%} 40%{left:120%} }

        .sb-ov { display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;backdrop-filter:blur(6px) }
        .sb-ov.active { display:block }

        .ifield { background:var(--bg3);border:1px solid var(--brd);color:var(--tx);border-radius:10px;padding:12px 16px;width:100%;font-size:14px;transition:all .2s;outline:none }
        .ifield:focus { border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-g) }
        .ifield::placeholder { color:var(--tx3) }
        .ifield:disabled { opacity:.5;cursor:not-allowed }
        .bp { background:linear-gradient(135deg,var(--acc),var(--acc-l));color:#fff;font-weight:600;padding:12px 24px;border-radius:10px;border:none;cursor:pointer;font-size:14px;transition:all .2s;width:100%;display:flex;align-items:center;justify-content:center;gap:8px }
        .bp:hover { transform:translateY(-1px);box-shadow:0 8px 24px rgba(232,146,42,.3) }
        .bp:active { transform:translateY(0) }
        .bp:disabled { opacity:.5;cursor:not-allowed;transform:none;box-shadow:none }
        .bs { background:var(--bg3);border:1px solid var(--brd);color:var(--tx);font-weight:500;padding:12px 24px;border-radius:10px;cursor:pointer;font-size:14px;transition:all .2s;width:100%;display:flex;align-items:center;justify-content:center;gap:8px }
        .bs:hover { border-color:var(--brd2);background:var(--bg4) }
        .mc { display:flex;gap:16px;padding:24px 0;max-width:800px;margin:0 auto;width:100%;animation:mi .3s ease }
        @keyframes mi { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .ma { width:32px;height:32px;min-width:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600 }
        .mu .ma { background:linear-gradient(135deg,var(--acc),var(--acc-l));color:#fff }
        .mai .ma { background:var(--bg4);color:var(--acc);border:1px solid var(--brd) }
        .mt { flex:1;min-width:0 }
        .mt .mn { font-weight:600;font-size:14px;margin-bottom:4px }
        .mt .mtime { font-size:11px;color:var(--tx3);margin-bottom:8px }
        .mt .mx { font-size:15px;line-height:1.7;color:var(--tx);word-break:break-word }
        .mt .mx p { margin-bottom:12px }
        .mt .mx p:last-child { margin-bottom:0 }
        .mt .mx h1,.mt .mx h2,.mt .mx h3 { font-family:'Space Grotesk',sans-serif;margin:20px 0 10px;font-weight:600 }
        .mt .mx h1 { font-size:1.5em }
        .mt .mx h2 { font-size:1.25em }
        .mt .mx h3 { font-size:1.1em }
        .mt .mx ul,.mt .mx ol { padding-left:20px;margin:8px 0 12px }
        .mt .mx li { margin:4px 0 }
        .mt .mx blockquote { border-left:3px solid var(--acc);padding:8px 16px;margin:12px 0;background:var(--acc-g);border-radius:0 8px 8px 0 }
        .mt .mx a { color:var(--acc-l);text-decoration:underline }
        .mt .mx table { border-collapse:collapse;margin:12px 0;width:100% }
        .mt .mx th,.mt .mx td { border:1px solid var(--brd);padding:8px 12px;text-align:left;font-size:14px }
        .mt .mx th { background:var(--bg3);font-weight:600 }
        .mt .mx code:not(pre code) { background:var(--bg4);padding:2px 6px;border-radius:4px;font-size:13px;color:var(--acc-l) }
        .mt .mx pre { margin:12px 0;border-radius:10px;overflow:hidden;border:1px solid var(--brd) }
        .cbh { display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg3);border-bottom:1px solid var(--brd);font-size:12px;color:var(--tx3) }
        .ccb { background:none;border:none;color:var(--tx3);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;transition:all .15s }
        .ccb:hover { color:var(--tx);background:var(--bg4) }
        .mact { display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .15s }
        .mc:hover .mact { opacity:1 }
        .mab { background:none;border:1px solid transparent;color:var(--tx3);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:4px;transition:all .15s }
        .mab:hover { color:var(--tx);background:var(--bg3);border-color:var(--brd) }
        .ciw { padding:16px 24px 24px;max-width:800px;margin:0 auto;width:100% }
        .cib { background:var(--bg3);border:1px solid var(--brd);border-radius:16px;display:flex;align-items:flex-end;padding:8px;transition:all .2s }
        .cib:focus-within { border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-g) }
        .cib textarea { flex:1;background:none;border:none;color:var(--tx);font-size:15px;padding:8px 12px;resize:none;outline:none;max-height:200px;line-height:1.5 }
        .cib textarea::placeholder { color:var(--tx3) }
        .sbtn { width:40px;height:40px;min-width:40px;border-radius:10px;border:none;background:var(--acc);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:16px }
        .sbtn:hover { background:var(--acc-l);transform:scale(1.05) }
        .sbtn:disabled { opacity:.3;cursor:not-allowed;transform:none }
        .ti { display:flex;gap:4px;padding:4px 0 }
        .ti span { width:8px;height:8px;border-radius:50%;background:var(--tx3);animation:tb 1.4s infinite }
        .ti span:nth-child(2) { animation-delay:.2s }
        .ti span:nth-child(3) { animation-delay:.4s }
        @keyframes tb { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-8px);opacity:1} }
        .tc { position:fixed;top:24px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:10px }
        .toast { padding:12px 20px 12px 24px;border-radius:100px;font-size:14px;display:flex;align-items:center;gap:12px;animation:tin .4s cubic-bezier(0.34,1.56,0.64,1);min-width:200px;max-width:420px;backdrop-filter:blur(16px);font-weight:500;letter-spacing:.2px;border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 32px rgba(0,0,0,.5);transition:all .2s;cursor:default }
        .toast.success { background:rgba(6,95,70,.85);color:#a7f3d0;border-color:rgba(16,185,129,.25);box-shadow:0 8px 32px rgba(16,185,129,.15) }
        .toast.error { background:rgba(127,29,29,.85);color:#fca5a5;border-color:rgba(239,68,68,.25);box-shadow:0 8px 32px rgba(239,68,68,.15) }

function clearAll(){Modal.open('<div class="p-6 text-center"><div class="mb-4"><i class="fa-solid fa-triangle-exclamation" style="font-size:36px;color:var(--wrn)"></i></div><h3 class="font-display text-lg font-semibold mb-2">Clear All Data</h3><p class="text-sm mb-6" style="color:var(--tx2)">This deletes your profile, tool history, and saved data. Cannot be undone.</p><div class="flex gap-3"><button class="bs flex-1" onclick="Modal.close()">Cancel</button><button class="flex-1 py-3 px-4 rounded-lg font-semibold text-sm border-none cursor-pointer" style="background:var(--err);color:#fff" onclick="doClearAll()">Clear Everything</button></div></div>');}
function doClearAll(){DB.clearAll();Modal.close();Toast.show('All data cleared','info');Router.go('/dashboard');pgDashboard();}

/* Category icon & color mapping for premium sidebar */
var CAT_META = {
    'Verification Tools': { icon: 'fa-shield-check', color: '#3b82f6', bg: 'rgba(59,130,246,0.12)' },
    'Currency Tools': { icon: 'fa-coins', color: '#22c55e', bg: 'rgba(34,197,94,0.12)' },
    'Lottery Tools': { icon: 'fa-dice', color: '#e8922a', bg: 'rgba(232,146,42,0.12)' },
    'Security Tools': { icon: 'fa-fingerprint', color: '#8b5cf6', bg: 'rgba(139,92,246,0.12)' }
};

var TOOLS=[{category:'Verification Tools',items:[{id:'nic',icon:'fa-id-card',color:'#3b82f6',title:'NIC Checker',desc:'Decode a Sri Lankan NIC number to get birth date, gender & format.',action:'openNicChecker'}]},{category:'Currency Tools',items:[{id:'fx',icon:'fa-money-bill-transfer',color:'#22c55e',title:'LKR Exchange Rate',desc:'Live exchange rates to Sri Lankan Rupees, with instant amount conversion.',action:'openCurrency'}]},{category:'Lottery Tools',items:[{id:'lottery',icon:'fa-ticket',color:'#e8922a',title:'Lottery Checker',desc:'Check Sri Lankan lottery results by game — draw number, date & winning numbers.',action:'openLotteryChecker'}]},{category:'Security Tools',items:[{id:'password',icon:'fa-key',color:'#8b5cf6',title:'Password Generator',desc:'Generate secure, random passwords with custom length via API.',action:'openPasswordGenerator'}]}];

function rParticles(){var html='<div class="hero-particles">';for(var i=0;i<18;i++){var left=Math.random()*100;var delay=Math.random()*6;var dur=4+Math.random()*5;var size=2+Math.random()*3;var opacity=0.15+Math.random()*0.35;html+='<span style="left:'+left+'%;bottom:10%;width:'+size+'px;height:'+size+'px;animation-delay:'+delay+'s;animation-duration:'+dur+'s;opacity:'+opacity+'"></span>';}html+='</div>';return html;}

    document.getElementById('app').innerHTML=
        '<div class="sb-ov'+(Store.sidebarOpen?' active':'')+'" id="sb-ov" onclick="togSB()"></div>'+
        '<div class="flex h-dvh">'+

        /* ══════════════════════════════════════
           PREMIUM SIDEBAR
           ══════════════════════════════════════ */

            /* Brand */
            '<div class="sb-brand">'+
                '<div class="sb-brand-logo">'+
                    '<div class="sb-brand-icon"><i class="fa-solid fa-bolt"></i></div>'+
                    '<div class="sb-brand-text">'+
                        '<div class="sb-brand-name">ZETA TOOLS</div>'+
                        '<div class="sb-brand-sub">Sri Lankan Utilities</div>'+
                    '</div>'+
                '</div>'+
                '<div class="sb-version-badge"><i class="fa-solid fa-gem" style="font-size:8px"></i> v1.0 Premium</div>'+
            '</div>'+

            /* Search */
            '<div class="sb-search"><div class="sb-search-wrap">'+
                '<input type="text" id="tsearch" placeholder="Search tools..." oninput="filterTools(this.value)">'+
                '<i class="fa-solid fa-magnifying-glass"></i>'+
            '</div></div>'+

            /* Section label */
            '<div class="sb-section-label">Categories</div>'+

            /* Category items */
            '<nav class="flex-1 overflow-y-auto px-0 pb-2" id="catnav">'+
                TOOLS.map(function(cat, idx) {
                    var meta = CAT_META[cat.category] || { icon:'fa-folder', color:'#888', bg:'rgba(136,136,136,0.1)' };
                    return '<div class="sb-cat" onclick="scrollToCat('+idx+')">'+
                        '<div class="sb-cat-head">'+
                            '<div class="sb-cat-icon" style="background:'+meta.bg+';color:'+meta.color+'"><i class="fa-solid '+meta.icon+'"></i></div>'+
                            '<div class="sb-cat-info">'+
                                '<div class="sb-cat-name">'+U.esc(cat.category)+'</div>'+

                            '</div>'+
                            '<i class="fa-solid fa-chevron-right sb-cat-arrow" style="color:'+meta.color+'"></i>'+
                        '</div>'+
                    '</div>';
                }).join('')+
            '</nav>'+

            /* User profile card */
            '<div class="sb-profile" onclick="togPM()" id="ptrig">'+
                '<div class="sb-profile-inner">'+
                    '<div class="sb-profile-avatar">'+
                        '<img src="'+U.esc(user.profile_image)+'" onerror="this.src=\'https://ui-avatars.com/api/?name='+encodeURIComponent(user.name)+'&background=e8922a&color=fff&size=64\'">'+
                        '<div class="sb-profile-dot"></div>'+
                    '</div>'+
                    '<div style="flex:1;min-width:0">'+
                        '<div class="sb-profile-name">'+U.esc(user.name)+'</div>'+
                        '<div class="sb-profile-status">Online</div>'+
                    '</div>'+
                    '<i class="fa-solid fa-ellipsis-vertical sb-profile-ellipsis"></i>'+
                '</div>'+

                /* Dropdown */
                '<div class="dd'+(Store.profileDropdown?'':' hidden')+'" id="pmenu" style="bottom:calc(100% + 8px);left:12px">'+
                    '<button class="ddi" onclick="event.stopPropagation();openProfile()"><i class="fa-regular fa-user w-5 text-center"></i> Profile</button>'+
                    '<button class="ddi" onclick="event.stopPropagation();openSettings()"><i class="fa-solid fa-gear w-5 text-center"></i> Settings</button>'+
                '</div>'+
            '</div>'+

        '</aside>'+

        /* ══════════════════════════════════════
           MAIN AREA
           ══════════════════════════════════════ */
        '<main class="flex-1 flex flex-col min-w-0 relative" style="background:var(--bg)">'+
            '<header class="zeta-header">'+
                '<div class="header-glow"></div>'+
                '<button onclick="togSB()" class="header-btn md:hidden"><i class="fa-solid fa-bars"></i></button>'+
                '<div class="header-divider hidden md:block"></div>'+
                '<div class="flex-1 flex flex-col items-center justify-center py-1">'+
                    '<div class="header-title">Tools</div>'+
                    '<div class="header-subtitle">Sri Lankan Utilities</div>'+
                '</div>'+
                '<div class="header-divider hidden md:block"></div>'+
                '<button onclick="openSettings()" class="header-btn"><i class="fa-solid fa-gear text-sm"></i></button>'+
            '</header>'+
            '<div class="flex-1 overflow-y-auto dot-grid-bg" id="tarea">'+rToolsHub(user)+'</div>'+
        '</main></div>';

    Store.sidebarOpen=false;
    Store.profileDropdown=false;
}

function scrollToCat(idx){clsSBM();var el=document.getElementById('cat-'+idx);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

function rToolsHub(user){
    var first=(user.name||'').split(' ')[0];
    var head='<div class="flex flex-col items-center justify-center px-4 pt-12 pb-8 text-center relative" style="animation:mi .5s ease;z-index:1">'+rParticles()+'<div class="mb-2 bolt-glow" style="color:var(--acc);z-index:1"><i class="fa-solid fa-bolt" style="font-size:36px"></i></div><h1 class="font-display text-2xl md:text-3xl font-bold mb-2" style="z-index:1">'+logo('lg')+'</h1><p style="color:var(--tx2);z-index:1">'+(first?'Hi '+U.esc(first)+', ':'')+'pick a tool to get started.</p></div>';
    var body='<div class="px-4 md:px-8 pb-12 max-w-5xl mx-auto w-full relative" style="z-index:1" id="toolsList">'+TOOLS.map(rCatSection).join('')+'</div>';
    return head+body;
}

var _cardIdx=0;
function rCatSection(cat,idx){_cardIdx=0;return '<div class="mb-8" id="cat-'+idx+'" data-cat="'+U.esc(cat.category).toLowerCase()+'"><h3 class="font-display text-xs font-semibold uppercase tracking-wider mb-3" style="color:var(--tx3)">'+U.esc(cat.category)+'</h3><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">'+cat.items.map(rToolCard).join('')+'</div></div>';}
function rToolCard(t){var delay=_cardIdx*0.08;_cardIdx++;return '<div class="wc" data-t="'+U.esc(t.title).toLowerCase()+'" onclick="'+t.action+'()" style="animation-delay:'+delay+'s"><div class="flex items-center gap-3 mb-2"><div class="wc-icon w-9 h-9 rounded-lg flex items-center justify-center" style="background:'+t.color+'20;color:'+t.color+'"><i class="fa-solid '+t.icon+'" style="font-size:15px"></i></div><span class="text-sm font-semibold">'+U.esc(t.title)+'</span></div><p class="text-xs" style="color:var(--tx3)">'+U.esc(t.desc)+'</p></div>';}

function filterTools(q){var qs=q.toLowerCase();var visible={};document.querySelectorAll('#toolsList .wc').forEach(function(el){var show=(el.dataset.t||'').indexOf(qs)>=0;el.style.display=show?'':'none';var sec=el.closest('[data-cat]');if(sec)visible[sec.id]=visible[sec.id]||show;});document.querySelectorAll('#toolsList [data-cat]').forEach(function(sec){sec.style.display=visible[sec.id]?'':'none';});}

function togSB(){var s=document.getElementById('sb'),o=document.getElementById('sb-ov');if(s)s.classList.toggle('open');if(o)o.classList.toggle('active');}
function clsSBM(){if(window.innerWidth<768){var s=document.getElementById('sb'),o=document.getElementById('sb-ov');if(s)s.classList.remove('open');if(o)o.classList.remove('active');}}
function togPM(){Store.profileDropdown=!Store.profileDropdown;var m=document.getElementById('pmenu');if(m)m.classList.toggle('hidden',!Store.profileDropdown);}
document.addEventListener('click',function(e){if(Store.profileDropdown&&!e.target.closest('#ptrig')&&!e.target.closest('#pmenu')){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');}});

function openProfile(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Profile Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><div class="flex flex-col items-center mb-6"><div class="relative mb-3"><img src="'+U.esc(user.profile_image)+'" id="pprev" class="w-20 h-20 rounded-2xl object-cover" style="border:2px solid var(--brd)" onerror="this.src=\'https://ui-avatars.com/api/?name='+encodeURIComponent(user.name)+'&background=e8922a&color=fff&size=128\'"><label class="absolute -bottom-1 -right-1 w-8 h-8 rounded-lg flex items-center justify-center cursor-pointer" style="background:var(--acc);color:#fff;font-size:12px;border:2px solid var(--bg2)"><i class="fa-solid fa-camera"></i><input type="file" accept="image/*" class="hidden" onchange="avChange(this)"></label></div><p class="text-xs" style="color:var(--tx3)">Click to change photo</p></div><form onsubmit="saveProf(event)">'+inp('pname','Name','text',user.name,{icon:'fa-user'})+'<button type="submit" class="bp" id="psbtn">Save Changes</button></form></div>');}
function avChange(inp){var f=inp.files[0];if(!f)return;if(f.size>2097152){Toast.show('Image must be under 2MB','error');return;}var r=new FileReader();r.onload=function(e){var p=document.getElementById('pprev');if(p)p.src=e.target.result;inp.dataset.du=e.target.result;};r.readAsDataURL(f);}
function saveProf(e){e.preventDefault();var btn=document.getElementById('psbtn');var n=document.getElementById('pname').value.trim();if(!n){Toast.show('Name is required','error');return;}btn.disabled=true;btn.innerHTML=spin()+' Saving...';setTimeout(function(){var up={name:n};var ai=document.querySelector('input[type="file"][accept="image/*"]');if(ai&&ai.dataset.du)up.profile_image=ai.dataset.du;DB.updateUser(Auth.getUser().id,up);Toast.show('Profile updated','success');Modal.close();pgDashboard();},400);}

function openNicChecker(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;var checks=DB.getNicChecks(user.id);Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-id-card mr-2" style="color:var(--acc)"></i>NIC Checker</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Enter a Sri Lankan NIC number to decode birth date, gender, and format.</p><div class="flex gap-2 mb-2"><input type="text" id="ncin" class="ifield" placeholder="e.g. 705693323V or 200012345678" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doNicCheck();}"><button class="bp" id="ncbtn" style="width:auto;padding:12px 20px" onclick="doNicCheck()"><i class="fa-solid fa-magnifying-glass"></i></button></div><div id="ncres" class="mt-4"></div>'+(checks.length?'<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="nclist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">'+checks.map(rNCI).join('')+'</div></div>':'<div id="nclist"></div>')+'</div>');setTimeout(function(){var i=document.getElementById('ncin');if(i)i.focus();},50);}

function doNicCheck(){var inp=document.getElementById('ncin'),btn=document.getElementById('ncbtn'),res=document.getElementById('ncres');var nic=inp.value.trim();if(!nic){Toast.show('Enter a NIC number first','error');return;}if(!/^\d{9}[vVxX]$|^\d{12}$/.test(nic)){Toast.show('Enter a valid NIC (9 digits + V, or 12 digits)','error');return;}btn.disabled=true;var orig=btn.innerHTML;btn.innerHTML=spin(14);NICChecker.decode(nic,function(r){btn.disabled=false;btn.innerHTML=orig;res.innerHTML=rNCResult(r);var user=Auth.getUser();var entry={id:U.id(),nic:r.nic,gender:r.gender,birthDate:r.birthDate,created_at:U.now()};DB.addNicCheck(user.id,entry);var list=document.getElementById('nclist');if(list)list.innerHTML=DB.getNicChecks(user.id).map(rNCI).join('');inp.value='';Toast.show('NIC decoded','success');},function(err){btn.disabled=false;btn.innerHTML=orig;Toast.show(err,'error');});}

function rNCResult(r){return '<div class="nc-res"><div class="nc-row"><span class="l">NIC</span><span class="v">'+U.esc(r.nic)+'</span></div><div class="nc-row"><span class="l">Format</span><span class="v">'+U.esc(r.format||'-')+'</span></div><div class="nc-row"><span class="l">Gender</span><span class="v">'+U.esc(r.gender||'-')+'</span></div><div class="nc-row"><span class="l">Birth Date</span><span class="v">'+U.esc(r.birthDate||'-')+'</span></div><div class="nc-row"><span class="l">Birth Year</span><span class="v">'+U.esc(String(r.birthYear||'-'))+'</span></div></div>';}

function rNCI(l){return '<div class="nc-hi"><i class="fa-solid fa-id-card" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">'+U.esc(l.nic)+'</div><div class="o">'+U.esc(l.gender||'')+(l.birthDate?' &bull; '+U.esc(l.birthDate):'')+'</div></div><button class="nc-ib" title="Copy" onclick="cpText(\''+U.esc(l.nic).replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delNC(\''+l.id+'\')"><i class="fa-solid fa-xmark"></i></button></div>';}
function delNC(id){var user=Auth.getUser();if(!user)return;DB.deleteNicCheck(user.id,id);var list=document.getElementById('nclist');if(list)list.innerHTML=DB.getNicChecks(user.id).map(rNCI).join('');}
function cpText(t){navigator.clipboard.writeText(t).then(function(){Toast.show('Copied','success');});}

var FX_CODES=[{c:'USD',n:'US Dollar'},{c:'GBP',n:'British Pound'},{c:'EUR',n:'Euro'},{c:'AUD',n:'Australian Dollar'},{c:'CAD',n:'Canadian Dollar'},{c:'JPY',n:'Japanese Yen'},{c:'INR',n:'Indian Rupee'},{c:'AED',n:'UAE Dirham'},{c:'SAR',n:'Saudi Riyal'},{c:'SGD',n:'Singapore Dollar'},{c:'CHF',n:'Swiss Franc'},{c:'CNY',n:'Chinese Yuan'}];

function openCurrency(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;var checks=DB.getFxChecks(user.id);Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-money-bill-transfer mr-2" style="color:var(--acc)"></i>LKR Exchange Rate</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Check the live rate for any currency against the Sri Lankan Rupee.</p><div class="grid grid-cols-2 gap-2 mb-2"><div><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">CURRENCY</label><select id="fxcode" class="ifield" style="padding:12px">'+FX_CODES.map(function(f){return '<option value="'+f.c+'">'+f.c+' — '+f.n+'</option>';}).join('')+'</select></div><div><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">AMOUNT</label><input type="number" id="fxamt" class="ifield" value="1" min="0" step="any" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doFxCheck();}"></div></div><button class="bp mt-1" id="fxbtn" onclick="doFxCheck()"><i class="fa-solid fa-arrow-right-arrow-left"></i> Get Rate</button><div id="fxres" class="mt-4"></div>'+(checks.length?'<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="fxlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">'+checks.map(rFXI).join('')+'</div></div>':'<div id="fxlist"></div>')+'</div>');}

function doFxCheck(){var sel=document.getElementById('fxcode'),amtIn=document.getElementById('fxamt'),btn=document.getElementById('fxbtn'),res=document.getElementById('fxres');var code=sel.value;var amt=parseFloat(amtIn.value);if(isNaN(amt)||amt<0){Toast.show('Enter a valid amount','error');return;}btn.disabled=true;var orig=btn.innerHTML;btn.innerHTML=spin(14);CurrencyAPI.getRate(code,function(r){btn.disabled=false;btn.innerHTML=orig;res.innerHTML=rFXResult(r,amt);var user=Auth.getUser();var entry={id:U.id(),code:r.from,rate:r.rate,amount:amt,converted:amt*r.rate,created_at:U.now()};DB.addFxCheck(user.id,entry);var list=document.getElementById('fxlist');if(list)list.innerHTML=DB.getFxChecks(user.id).map(rFXI).join('');Toast.show('Rate updated','success');},function(err){btn.disabled=false;btn.innerHTML=orig;Toast.show(err,'error');});}

function rFXResult(r,amt){var converted=(amt*r.rate).toLocaleString('en-LK',{maximumFractionDigits:2});var updated=r.last_updated_utc?U.relTime(r.last_updated_utc):'-';return '<div class="nc-res"><div class="text-center mb-1" style="padding:8px 0"><div class="text-2xl font-display font-bold" style="color:var(--acc)">Rs. '+converted+'</div><div class="text-xs mt-1" style="color:var(--tx3)">'+U.esc(String(amt))+' '+U.esc(r.from)+' converted to LKR</div></div><div class="nc-row"><span class="l">Rate (1 '+U.esc(r.from)+')</span><span class="v">Rs. '+U.esc(String(r.rate))+'</span></div><div class="nc-row"><span class="l">Inverse Rate</span><span class="v">'+U.esc(String(r.inverse_rate||'-'))+'</span></div><div class="nc-row"><span class="l">Last Updated</span><span class="v">'+U.esc(updated)+'</span></div><div class="nc-row"><span class="l">Source</span><span class="v">'+U.esc(r.source||'-')+'</span></div></div>';}

function rFXI(l){var conv=(l.converted||0).toLocaleString('en-LK',{maximumFractionDigits:2});return '<div class="nc-hi"><i class="fa-solid fa-money-bill-transfer" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">'+U.esc(String(l.amount))+' '+U.esc(l.code)+' &rarr; Rs. '+conv+'</div><div class="o">Rate: '+U.esc(String(l.rate))+' &bull; '+U.esc(U.relTime(l.created_at))+'</div></div><button class="nc-ib" title="Copy" onclick="cpText(\''+conv.replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delFX(\''+l.id+'\')"><i class="fa-solid fa-xmark"></i></button></div>';}
function delFX(id){var user=Auth.getUser();if(!user)return;DB.deleteFxCheck(user.id,id);var list=document.getElementById('fxlist');if(list)list.innerHTML=DB.getFxChecks(user.id).map(rFXI).join('');}

var LOTTERY_GAMES=[{label:'Sasiri',value:'sasiri'},{label:'Samanala',value:'samanala'},{label:'Mahajana',value:'mahajana'},{label:'Nidahas',value:'nidahas'},{label:'Govi',value:'govi'},{label:'Jaya',value:'jaya'},{label:'Wasana',value:'wasana'},{label:'Kotipathi',value:'kotipathi'},{label:'Lagna',value:'lagna'},{label:'Rathu',value:'rathu'}];

function openLotteryChecker(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;var checks=DB.getLotteryChecks(user.id);var pills=LOTTERY_GAMES.map(function(g){return '<button class="text-xs px-3 py-1 rounded-full border border-[var(--brd)] hover:border-[var(--acc)] hover:bg-[var(--acc-g)] transition-all" style="color:var(--tx2)" onclick="document.getElementById(\'lotgame\').value=\''+g.value+'\';doLotteryCheck();">'+U.esc(g.label)+'</button>';}).join('');Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-ticket mr-2" style="color:var(--acc)"></i>Lottery Checker</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Enter a Sri Lankan lottery game name (e.g. <strong>sasiri</strong>) to get the latest draw results.</p><div class="flex flex-wrap gap-2 mb-3">'+pills+'</div><div class="flex gap-2"><input type="text" id="lotgame" class="ifield" placeholder="Game name…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();doLotteryCheck();}"><button class="bp" id="lotbtn" style="width:auto;padding:12px 20px" onclick="doLotteryCheck()"><i class="fa-solid fa-magnifying-glass"></i></button></div><div id="lotres" class="mt-4"></div>'+(checks.length?'<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="lotlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">'+checks.map(rLotteryItem).join('')+'</div></div>':'<div id="lotlist"></div>')+'</div>');setTimeout(function(){var i=document.getElementById('lotgame');if(i)i.focus();},50);}

function doLotteryCheck(){var inp=document.getElementById('lotgame'),btn=document.getElementById('lotbtn'),res=document.getElementById('lotres');var game=inp.value.trim();if(!game){Toast.show('Enter a lottery game name','error');return;}btn.disabled=true;var orig=btn.innerHTML;btn.innerHTML=spin(14);LotteryAPI.fetch(game,function(r){btn.disabled=false;btn.innerHTML=orig;res.innerHTML=rLotteryResult(r);var user=Auth.getUser();var entry={id:U.id(),game:r.game,board:r.board||'DLB',draw_number:r.draw_number||'-',date:r.date||'-',numbers:r.numbers||[],source_url:r.source_url||'',disclaimer:r.disclaimer||'',created_at:U.now()};DB.addLotteryCheck(user.id,entry);var list=document.getElementById('lotlist');if(list)list.innerHTML=DB.getLotteryChecks(user.id).map(rLotteryItem).join('');Toast.show('Lottery results loaded','success');},function(err){btn.disabled=false;btn.innerHTML=orig;Toast.show(err,'error');});}

function rLotteryResult(r){var nums=(r.numbers||[]).map(function(n){return '<span class="lp gold">'+U.esc(String(n))+'</span>';}).join('');var boardClass=(r.board||'').toLowerCase()==='dlb'?'dlb':'';return '<div class="nc-res"><div class="text-center mb-1" style="padding:4px 0"><span class="lot-game-badge '+boardClass+'">'+U.esc(r.board||'DLB')+'</span></div><div class="nc-row"><span class="l">Game</span><span class="v" style="text-transform:capitalize">'+U.esc(r.game||'-')+'</span></div><div class="nc-row"><span class="l">Draw Number</span><span class="v">'+U.esc(r.draw_number||'-')+'</span></div><div class="nc-row"><span class="l">Date</span><span class="v">'+U.esc(r.date||'-')+'</span></div><div class="nc-row" style="flex-wrap:wrap"><span class="l">Winning Numbers</span><span class="v" style="flex-wrap:wrap;display:flex;gap:4px;justify-content:flex-end">'+nums+'</span></div>'+(r.source_url?'<div class="nc-row"><span class="l">Source</span><span class="v"><a href="'+U.esc(r.source_url)+'" target="_blank" rel="noopener noreferrer" style="color:var(--acc-l);text-decoration:underline;font-size:13px">results.govdoc.lk</a></span></div>':'')+(r.disclaimer?'<div class="mt-2 text-xs" style="color:var(--tx3);line-height:1.4">'+U.esc(r.disclaimer)+'</div>':'')+'</div>';}

function rLotteryItem(l){var nums=(l.numbers||[]).slice(0,3).map(function(n){return U.esc(String(n));}).join(' ');var suffix=(l.numbers||[]).length>3?' …':'';var boardLabel=(l.board||'DLB').toUpperCase();return '<div class="nc-hi"><i class="fa-solid fa-ticket" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s">'+U.esc(l.game)+' #'+U.esc(l.draw_number||'-')+' — '+nums+suffix+'</div><div class="o">'+boardLabel+' &bull; '+U.esc(l.date||'')+' &bull; '+U.esc(U.relTime(l.created_at))+'</div></div><button class="nc-ib" title="Copy" onclick="cpText(\''+(l.numbers||[]).join(' ').replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delLot(\''+l.id+'\')"><i class="fa-solid fa-xmark"></i></button></div>';}
function delLot(id){var user=Auth.getUser();if(!user)return;DB.deleteLotteryCheck(user.id,id);var list=document.getElementById('lotlist');if(list)list.innerHTML=DB.getLotteryChecks(user.id).map(rLotteryItem).join('');}

function openPasswordGenerator(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;var entries=DB.getPasswordEntries(user.id);Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold"><i class="fa-solid fa-key mr-2" style="color:var(--acc)"></i>Password Generator</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm mb-4" style="color:var(--tx2)">Generate a secure, random password with a custom length.</p><div class="mb-4"><label class="block text-xs font-medium mb-1" style="color:var(--tx3)">PASSWORD LENGTH</label><div class="pw-length-selector"><input type="range" id="pwrange" class="ri" min="6" max="32" value="16" oninput="document.getElementById(\'pwlen\').textContent=this.value"><span class="length-label" id="pwlen">16</span></div></div><button class="bp" id="pwbtn" onclick="doGeneratePassword()"><i class="fa-solid fa-rotate"></i> Generate Password</button><div id="pwres" class="mt-4"></div>'+(entries.length?'<div class="mt-6"><div class="text-xs font-medium mb-2" style="color:var(--tx3)">RECENT</div><div id="pwlist" class="flex flex-col gap-1 max-h-56 overflow-y-auto">'+entries.map(rPasswordItem).join('')+'</div></div>':'<div id="pwlist"></div>')+'</div>');setTimeout(function(){doGeneratePassword();},100);}

function doGeneratePassword(){var range=document.getElementById('pwrange'),btn=document.getElementById('pwbtn'),res=document.getElementById('pwres');var length=parseInt(range.value,10);if(isNaN(length)||length<6||length>32){Toast.show('Please select a length between 6 and 32','error');return;}btn.disabled=true;var orig=btn.innerHTML;btn.innerHTML=spin(14);PasswordAPI.generate(length,function(r){btn.disabled=false;btn.innerHTML=orig;res.innerHTML=rPasswordResult(r);var user=Auth.getUser();var entry={id:U.id(),password:r.password,length:r.length,created_at:U.now()};DB.addPasswordEntry(user.id,entry);var list=document.getElementById('pwlist');if(list)list.innerHTML=DB.getPasswordEntries(user.id).map(rPasswordItem).join('');Toast.show('Password generated','success');},function(err){btn.disabled=false;btn.innerHTML=orig;Toast.show(err,'error');});}

function rPasswordResult(r){var pw=U.esc(r.password);return '<div class="nc-res"><div class="pw-box"><span class="font-mono tracking-wide">'+pw+'</span><button class="copy-btn" onclick="cpText(\''+pw.replace(/'/g,"\\'")+'\')" title="Copy to clipboard"><i class="fa-regular fa-copy"></i></button></div><div class="nc-row"><span class="l">Length</span><span class="v">'+U.esc(String(r.length))+'</span></div></div>';}

function rPasswordItem(l){var pw=U.esc(l.password);return '<div class="nc-hi"><i class="fa-solid fa-key" style="color:var(--tx3);font-size:12px;min-width:12px"></i><div class="flex-1 min-w-0"><div class="s font-mono text-sm tracking-wide">'+pw+'</div><div class="o">Length '+U.esc(String(l.length))+' &bull; '+U.esc(U.relTime(l.created_at))+'</div></div><button class="nc-ib" title="Copy" onclick="cpText(\''+pw.replace(/'/g,"\\'")+'\')"><i class="fa-regular fa-copy"></i></button><button class="nc-ib" title="Delete" onclick="delPw(\''+l.id+'\')"><i class="fa-solid fa-xmark"></i></button></div>';}
function delPw(id){var user=Auth.getUser();if(!user)return;DB.deletePasswordEntry(user.id,id);var list=document.getElementById('pwlist');if(list)list.innerHTML=DB.getPasswordEntries(user.id).map(rPasswordItem).join('');}

function openSettings(){Store.profileDropdown=false;var m=document.getElementById('pmenu');if(m)m.classList.add('hidden');var user=Auth.getUser();if(!user)return;Modal.open('<div class="p-6"><div class="flex items-center justify-between mb-6"><h3 class="font-display text-lg font-semibold">Settings</h3><button onclick="Modal.close()" class="w-8 h-8 rounded-lg flex items-center justify-center border-none cursor-pointer" style="background:var(--bg3);color:var(--tx2)"><i class="fa-solid fa-xmark"></i></button></div><div class="flex items-center gap-3 p-4 rounded-lg mb-4" style="background:var(--bg3)"><i class="fa-solid fa-moon" style="color:var(--acc)"></i><div><div class="text-sm font-medium">Dark Mode</div><div class="text-xs" style="color:var(--tx3)">Always on for this app</div></div></div><button class="bs" onclick="clearAll()"><i class="fa-solid fa-trash-can"></i> Clear all data</button></div>');}

Router.reg('/dashboard',pgDashboard);
Router.reg('/settings',function(){pgDashboard();setTimeout(openSettings,100);});

(function(){document.documentElement.classList.add('dark');document.documentElement.classList.remove('light');if(!Router.cur()||Router.cur()==='/login'||Router.cur()==='/register')Router.go('/dashboard');Router.init();})();
</script>
</body>
</html>
